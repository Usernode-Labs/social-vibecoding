name: Preview flow contract

on:
  pull_request:
    paths:
      - 'src/services/preview-flow/**'
      - 'src/services/decision-runtime/**'
      - 'src/services/execution/**'
      - 'src/services/cli-preview-handoff/**'
      - 'src/services/proposal-review/**'
      - 'src/services/session-lifecycle.js'
      - 'src/services/cli-handoff-sync.js'
      - 'src/services/proposal-update.js'
      - 'src/services/proposal-description*.js'
      - 'src/services/pr-import-sync.js'
      - 'src/services/check-*.js'
      - 'src/services/preview-lifecycle.js'
      - 'src/services/unit-suite.js'
      - 'src/services/check-history.js'
      - 'src/services/merge-queue.js'
      - 'src/services/visuals.js'
      - 'src/services/application-runtime.js'
      - 'src/services/kubernetes.js'
      - 'src/services/staging-reap.js'
      - 'src/services/db-manager.js'
      - 'src/services/docker.js'
      - 'src/config.js'
      - 'src/services/secrets.js'
      - 'src/services/build-retention.js'
      - 'src/services/homeroom-bot*.js'
      - 'src/services/bench/**'
      - 'src/routes/proposal-handoff.js'
      - 'src/routes/sessions.js'
      - 'src/routes/votes.js'
      - 'src/services/handoff-pipeline.js'
      - 'src/services/staging.js'
      - 'src/services/staging-recovery.js'
      - 'src/services/build-retention-guard.js'
      - 'server.js'
      - 'src/db/**'
      - 'sql-dynamic-baseline.json'
      - 'scripts/check-sql.js'
      - 'scripts/check-preview-ownership.js'
      - 'scripts/test-preview-flow.js'
      - 'scripts/preview-postgres-fixture.js'
      - 'scripts/preview-preparation-worker.js'
      - 'scripts/preview-build-retention.js'
      - 'scripts/test-recoverable-preview-build.js'
      - 'scripts/kpack-local-fixture.js'
      - 'tests/preview-*.test.js'
      - 'tests/decision-runtime.test.js'
      - 'tests/disposable-postgres.test.js'
      - 'tests/execution-worker.test.js'
      - 'tests/recoverable-preview-*.test.js'
      - 'tests/cli-preview-*.test.js'
      - 'tests/cli-check-settlement-postgres.test.js'
      - 'tests/merge-queue.test.js'
      - 'tests/check-*.test.js'
      - 'tests/checks-retirement*.test.js'
      - 'tests/review-work.test.js'
      - 'tests/unpromote-proposal-postgres.test.js'
      - 'tests/unit-suite-check.test.js'
      - 'tests/*runtime*.test.js'
      - 'tests/kubernetes-preview-inventory.test.js'
      - 'tests/staging-reap.test.js'
      - 'tests/homeroom-bot*.test.js'
      - 'tests/pr-import-sync.test.js'
      - 'tests/proposal-update.test.js'
      - 'tests/proposal-description*.test.js'
      - 'tests/lib/**'
      - 'tests/isolated-kpack-fixture.test.js'
      - 'tests/kpack-local-fixture.test.js'
      - 'tests/proposal-handoff.test.js'
      - 'tests/staging-build-serialize.test.js'
      - 'tests/local-agent-tail.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/preview-flow-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Provision owned disposable PostgreSQL
        run: |
          node scripts/preview-postgres-fixture.js create unix:///var/run/docker.sock "$RUNNER_TEMP/preview-postgres-manifest"
          node scripts/preview-postgres-fixture.js github-env "$(cat "$RUNNER_TEMP/preview-postgres-manifest")"
      - name: PostgreSQL decision and adapter contract
        run: node scripts/test-preview-flow.js
      - name: Reviewed preview writer ownership
        run: node scripts/check-preview-ownership.js
      - name: SQL parser and catalog validation
        run: node scripts/preview-postgres-fixture.js run "$PREVIEW_POSTGRES_TEST_CONFIG" npm run lint:sql
      - name: Retire owned PostgreSQL
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/preview-postgres-manifest" ]; then
            node scripts/preview-postgres-fixture.js teardown "$(cat "$RUNNER_TEMP/preview-postgres-manifest")"
          fi
