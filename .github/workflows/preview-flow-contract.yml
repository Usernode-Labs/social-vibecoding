name: Preview flow contract

on:
  pull_request:
    paths:
      - 'src/services/preview-flow/**'
      - 'src/services/handoff-pipeline.js'
      - 'src/services/staging.js'
      - 'src/services/staging-recovery.js'
      - 'src/services/build-retention-guard.js'
      - 'server.js'
      - 'src/db/schema.sql'
      - 'scripts/check-sql.js'
      - 'scripts/check-preview-ownership.js'
      - 'scripts/test-preview-flow.js'
      - 'tests/preview-*.test.js'
      - 'tests/proposal-handoff.test.js'
      - 'tests/staging-build-serialize.test.js'
      - 'tests/local-agent-tail.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/preview-flow-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PREVIEW_FLOW_TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      SQL_CHECK_CONNECTION_URL: postgres://postgres:postgres@postgres:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - run: npm ci
      - name: PostgreSQL decision and adapter contract
        run: node scripts/test-preview-flow.js
      - name: SQL parser and catalog validation
        run: npm run lint:sql
