name: Kubernetes pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kubernetes-pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-lockfiles:
    name: Audit all three lockfiles
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
      - run: |
          npm install --global npm@11.21.1 undici@6.29.1
          image_npm_root="$(npm root --global)"
          rm -rf "$image_npm_root/npm/node_modules/undici"
          mv "$image_npm_root/undici" "$image_npm_root/npm/node_modules/undici"
      - name: Fetch the baseline commit
        id: baseline
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          revision="$BASE_SHA"
          if [[ "$revision" =~ ^[a-f0-9]{40}$ ]] && git fetch --no-tags --depth=1 origin "$revision"; then
            echo "revision=$revision" >> "$GITHUB_OUTPUT"
            echo "name=the pull request's base (${revision:0:9})" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Security baseline::No baseline commit could be read; findings require retry or review of the unavailable comparison."
          fi
      - run: node scripts/security-audit.js
        env:
          SECURITY_BASELINE_REVISION: ${{ steps.baseline.outputs.revision }}
          SECURITY_BASELINE_NAME: ${{ steps.baseline.outputs.name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security
          path: security-reports/
          if-no-files-found: error
          retention-days: 30

  security-images:
    name: Build and scan ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: platform, dockerfile: Dockerfile.kubernetes, context: '.' }
          - { component: standalone, dockerfile: Dockerfile, context: '.' }
          - { component: worker, dockerfile: worker/Dockerfile, context: worker }
          - { component: capture, dockerfile: capture/Dockerfile, context: '.' }
          - { component: starter, dockerfile: '', context: '' }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
      - run: |
          npm install --global npm@11.21.1 undici@6.29.1
          image_npm_root="$(npm root --global)"
          rm -rf "$image_npm_root/npm/node_modules/undici"
          mv "$image_npm_root/undici" "$image_npm_root/npm/node_modules/undici"
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: azure/setup-helm@v4
        if: matrix.component == 'worker'
        with:
          version: v3.19.0
      - name: Read the promoted worker digest for its build cache
        if: matrix.component == 'worker'
        id: live
        run: node scripts/live-release.js
      - name: Resolve Claude Code version
        if: matrix.component == 'worker'
        id: claude
        shell: bash
        run: |
          version="$(bash scripts/resolve-claude-code-version.sh)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'Claude Code: `%s`\n' "$version" >> "$GITHUB_STEP_SUMMARY"
      - name: Find standalone Buildx cache from the main security audit
        if: matrix.component == 'standalone'
        id: standalone_cache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/security-audit.yml/runs" \
            -f branch=main -f status=success -f per_page=7 \
            --jq '.workflow_runs[] | select(.head_branch == "main" and .head_repository.full_name == .repository.full_name and (.event == "schedule" or .event == "workflow_dispatch")) | [.id, .run_attempt] | @tsv')" || exit 0
          while read -r run_id attempt; do
            [[ "$run_id" =~ ^[0-9]+$ && "$attempt" =~ ^[0-9]+$ ]] || continue
            name="standalone-buildx-cache-$attempt"
            artifacts="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" -f "name=$name")" || continue
            if jq -e --arg name "$name" 'any(.artifacts[]; .name == $name and .expired == false)' <<< "$artifacts" >/dev/null; then
              printf 'run_id=%s\nname=%s\n' "$run_id" "$name" >> "$GITHUB_OUTPUT"
              break
            fi
          done <<< "$runs"
      - name: Restore trusted standalone Buildx cache
        id: restore_standalone_cache
        if: matrix.component == 'standalone' && steps.standalone_cache.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.standalone_cache.outputs.run_id }}
          name: ${{ steps.standalone_cache.outputs.name }}
          path: ${{ runner.temp }}/standalone-buildx-cache
      # Baselines are built lazily from the exact PR base. Never restore an
      # inventory cache that an earlier PR revision could have written.
      - name: Build and scan the finished image
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
          SECURITY_BASELINE_REVISION: ${{ github.event.pull_request.base.sha }}
          SECURITY_SCAN_PLATFORM: linux/amd64
          LIVE_WORKER_DIGEST: ${{ steps.live.outputs.worker }}
          CLAUDE_CODE_VERSION: ${{ steps.claude.outputs.version }}
          STANDALONE_CACHE_RESTORED: ${{ steps.restore_standalone_cache.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/security-$COMPONENT"
          mkdir -p "$out"
          trap 'if [ ! -s "$out/assessment.json" ]; then node scripts/security-findings.js --unavailable "$out" "$COMPONENT" "Image build or inventory generation failed"; fi' ERR
          if [ "$COMPONENT" = starter ]; then
            node scripts/security-starter.js "$RUNNER_TEMP/starter-source"
            CONTEXT="$RUNNER_TEMP/starter-source"
            DOCKERFILE="$CONTEXT/Dockerfile"
          fi
          build_args=(--pull --platform linux/amd64 -t "security-$COMPONENT" -f "$DOCKERFILE")
          if [ "$COMPONENT" = standalone ] && [ "$STANDALONE_CACHE_RESTORED" = true ] \
            && [ -s "$RUNNER_TEMP/standalone-buildx-cache/index.json" ]; then
            build_args+=(--cache-from "type=local,src=$RUNNER_TEMP/standalone-buildx-cache")
          fi
          if [ "$COMPONENT" = worker ] && [[ "$LIVE_WORKER_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            # Import build layers only from the image promoted by main. The
            # candidate still builds locally and gets all of its own checks.
            build_args+=(--cache-from "type=registry,ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/social-vibecoding-worker@$LIVE_WORKER_DIGEST")
          fi
          if [ "$COMPONENT" = worker ]; then
            build_args+=(--build-arg "CLAUDE_CODE_VERSION=${CLAUDE_CODE_VERSION:?exact Claude Code version required}")
            sh scripts/check-pr-worker-image.sh "$out" "${build_args[@]}" "$CONTEXT"
          else
            docker buildx build --load "${build_args[@]}" "$CONTEXT"
            sh scripts/create-image-sbom.sh "security-$COMPONENT" "$out/sbom.spdx.json"
            sh scripts/check-image-security.sh "security-$COMPONENT" "$out" "$out/sbom.spdx.json" "$COMPONENT"
          fi
      - name: Verify capture browser and media
        if: matrix.component == 'capture'
        timeout-minutes: 2
        run: |
          docker run --rm -i --network none --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint node security-capture < scripts/verify-capture-image.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-image-security-${{ matrix.component }}
          path: ${{ runner.temp }}/security-${{ matrix.component }}/
          if-no-files-found: error
          retention-days: 30

  security-regressions:
    name: Security regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          cache: npm
      - run: |
          npm install --global npm@11.21.1 undici@6.29.1
          image_npm_root="$(npm root --global)"
          rm -rf "$image_npm_root/npm/node_modules/undici"
          mv "$image_npm_root/undici" "$image_npm_root/npm/node_modules/undici"
      - run: npm ci
      # Deliberately no --test-force-exit: open handles must fail the check.
      - run: node --require ./tests/lib/test-net.js --test --test-timeout=180000 tests/build-stop-hook.test.js tests/inloop-launch.test.js tests/security-update.test.js tests/security-gate-baseline.test.js tests/security-audit-report.test.js tests/web-fetch.test.js tests/web-fetch-dns-pinning.test.js
        timeout-minutes: 6

      - run: node --require ./tests/lib/test-net.js --test --test-timeout=60000 tests/private-streams.test.js
        timeout-minutes: 2

  preview-schema-compatibility:
    name: Preview schema compatibility (PostgreSQL 17/18)
    uses: ./.github/workflows/kubernetes-database-checks.yml
    with:
      full_suite: true

  security-merge-gate:
    name: Security merge gate
    needs: [security-lockfiles, security-images, security-regressions, preview-schema-compatibility]
    # A skipped dependency is not a successful scan. Run even after failure
    # or cancellation so GitHub cannot treat a skipped gate as a pass.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful security and database checks
        env:
          LOCKFILES_RESULT: ${{ needs.security-lockfiles.result }}
          IMAGES_RESULT: ${{ needs.security-images.result }}
          REGRESSIONS_RESULT: ${{ needs.security-regressions.result }}
          DATABASE_RESULT: ${{ needs.preview-schema-compatibility.result }}
        run: |
          if [ "$LOCKFILES_RESULT" != success ] || [ "$IMAGES_RESULT" != success ] \
              || [ "$REGRESSIONS_RESULT" != success ] || [ "$DATABASE_RESULT" != success ]; then
            echo "::error title=Security merge gate::Lockfiles: $LOCKFILES_RESULT; images: $IMAGES_RESULT; regressions: $REGRESSIONS_RESULT; PostgreSQL: $DATABASE_RESULT. All checks must succeed before merging."
            exit 1
          fi
