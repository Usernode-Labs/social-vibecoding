name: Temporary Kubernetes CI benchmark
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inline-cache:
    name: Worker cache from a release-style OCI image
    if: github.head_ref == 'codex/benchmark-kubernetes-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Start isolated OCI registry
        run: docker run --detach -p 127.0.0.1:5000:5000 mirror.gcr.io/library/registry:2
      - uses: docker/setup-buildx-action@v4
        id: seed
        with:
          driver-opts: |
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1
            network=host
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
            [registry."localhost:5000"]
              http = true
      - name: Seed the exact canonical worker using release build arguments and attestations
        id: publish
        env:
          BUILDER: ${{ steps.seed.outputs.name }}
        run: |
          base=9072583cdd1f9fcd91f7a8caf9295389819c99af
          git fetch --depth=1 origin "$base"
          git worktree add --detach "$RUNNER_TEMP/canonical" FETCH_HEAD
          version="$(npm view @anthropic-ai/claude-code@latest version)"
          ref=localhost:5000/worker:release-fixture
          docker buildx build --builder "$BUILDER" --push --pull --platform linux/amd64 \
            --build-arg "GIT_SHA=$base" --build-arg "CLAUDE_CODE_VERSION=$version" \
            --provenance mode=max --sbom=true --cache-to type=inline \
            --metadata-file "$RUNNER_TEMP/worker-metadata.json" -t "$ref" \
            -f "$RUNNER_TEMP/canonical/worker/Dockerfile" "$RUNNER_TEMP/canonical/worker"
          digest="$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/worker-metadata.json")"
          echo "reference=localhost:5000/worker@$digest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        id: cached
        with:
          driver-opts: |
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1
            network=host
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
            [registry."localhost:5000"]
              http = true
      - name: Time candidate build using the immutable OCI cache
        env:
          BUILDER: ${{ steps.cached.outputs.name }}
          SOURCE: ${{ steps.publish.outputs.reference }}
        run: |
          time docker buildx build --builder "$BUILDER" --load --pull --platform linux/amd64 \
            --cache-from "type=registry,ref=$SOURCE" -t security-worker -f worker/Dockerfile worker
