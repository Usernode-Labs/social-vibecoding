name: Frontend checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - "Dockerfile"
      - "server.js"
      - "AGENTS.md"
      - "agent-skills/ui-development/**"
      - "docs/react-migration.md"
      - "tool/**"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "Dockerfile"
      - "server.js"
      - "AGENTS.md"
      - "agent-skills/ui-development/**"
      - "docs/react-migration.md"
      - "tool/**"

jobs:
  react:
    name: React shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run check:tokens
      - run: npm run check:design-system
      - run: npm run check:registry
      - run: npm run check:style-policy
      - run: npm run check:harness
      - run: npm run test:agent-battery
      - run: npm run typecheck
      - run: npm run test:e2e
      - run: npm run test:production-review
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run test:storybook
      - run: npm run check:storybook-build
