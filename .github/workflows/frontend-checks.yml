name: Frontend checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - "public/usernode-bridge.js"
      - "public/usernode-bridge/**"
      - "public/index.html"
      - "public/js/home.js"
      - "public/sw.js"
      - "tests/home-card-menu.test.js"
      - "tests/pwa-sw-classify.test.js"
      - "tests/pwa-sw-session-boundary.test.js"
      - "tests/usernode-bridge*.test.js"
      - "NATIVE-BRIDGE.md"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/frontend-checks.yml"
      - ".github/workflows/deploy.yml"
      - "server.js"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "agent-skills/**"
      - "docs/react-migration.md"
      - "tool/**"
  push:
    branches: [main]

# Every main commit produces the immutable React shell bundled into the
# production image, including backend-only commits. This is deliberate:
# deployment consumes this workflow's artifact and never rebuilds the shell.
permissions:
  contents: read

jobs:
  react:
    name: React shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install root dependencies
        run: npm ci
        working-directory: .
      - name: Install frontend dependencies
        run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run check:tokens
      - run: npm run check:design-system
      - run: npm run check:relationships
      - run: npm run check:registry
      - run: npm run check:style-policy
      - run: npm run check:content
      - run: npm run test:content
      - name: Check harness integrity and publish boundary
        env:
          SLICE_BOUNDARY_CHECK: "true"
          SLICE_PUBLISH_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:harness-integrity
      - name: Report harness fitness
        env:
          HARNESS_FITNESS_OUTPUT: ${{ runner.temp }}/harness-fitness.json
        run: npm run check:harness-fitness
      - name: Upload harness fitness report
        uses: actions/upload-artifact@v4
        with:
          name: harness-fitness-${{ github.sha }}
          path: ${{ runner.temp }}/harness-fitness.json
          if-no-files-found: error
          retention-days: 30
      - run: npm run check:progressive-context
      - name: Enforce loaded-context budget
        run: npm run check:context-budget
      - name: Enforce interface-law ratchets
        run: npm run check:interface-laws
      - run: npm run check:harness
      - run: npm run test:harness
      - run: npm run test:agent-battery
      - run: npm run typecheck
      - run: npm run test:native-bridge-contract
      - name: Build immutable React shell
        env:
          SV_REACT_SHELL_REVISION: ${{ github.sha }}
        run: npm run build
      - name: Run authoritative root suite
        run: npm test
        working-directory: .
      - name: Test the prebuilt service worker
        env:
          CI: ""
          PLAYWRIGHT_PORT: "4363"
        run: |
          set -euo pipefail
          SV_SW_CONTRACT_TEST=true npm run preview -- --host 127.0.0.1 --port "$PLAYWRIGHT_PORT" > /tmp/react-shell-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:${PLAYWRIGHT_PORT}/react/" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/react-shell-preview.log
              exit 1
            fi
            sleep 1
          done
          # Empty CI makes the shared Playwright config reuse the already
          # running production preview instead of starting a Vite dev server.
          npx playwright test tests/react-service-worker.spec.ts --project=desktop --workers=1
      - run: npm run test:e2e
      - run: npm run test:production-guard
      - run: npm run test:production-smoke
      - run: npm run check:cutover-contract
      - run: npm run check:bundle
      - run: npm run test:storybook
      - run: npm run check:storybook-build
      - name: Package verified React shell
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/verified-react-shell"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/public"
          cp -a ../public/react "$STAGE/public/react"
          grep --recursive --fixed-string --quiet "$SOURCE_SHA" "$STAGE/public/react"
          (
            cd "$STAGE"
            find public/react -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > checksums.sha256
          )
          node -e '
            const fs = require("node:fs")
            const sha = process.env.SOURCE_SHA
            fs.writeFileSync(
              process.env.RUNNER_TEMP + "/verified-react-shell/manifest.json",
              JSON.stringify({
                schemaVersion: 1,
                sourceSha: sha,
                reactShellRevision: sha,
                workflowRunId: process.env.GITHUB_RUN_ID,
              }, null, 2) + "\n",
            )
          '
      - name: Upload verified React shell
        uses: actions/upload-artifact@v4
        with:
          name: react-shell-${{ github.sha }}
          path: ${{ runner.temp }}/verified-react-shell
          if-no-files-found: error
          retention-days: 30
