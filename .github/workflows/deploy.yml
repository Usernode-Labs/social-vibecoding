name: Deploy

# Standalone deploy for Usernode Social Vibecoding.
#
# Targets a dedicated VPS (see README — "Standalone deployment"). Code
# is rsync'd to /opt/usernode, an `.env` is written from GitHub
# secrets, then `docker compose up -d --build` brings the stack up.
#
# Auto-deploys on every push to `main`. workflow_dispatch is kept for
# manual re-runs (e.g. rolling forward without a new commit, or
# replaying a deploy after rotating secrets).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_archive_refresh:
        description: "Force archive snapshot refresh + sidecar recreate (default: only when node-related files or upstream image changed)"
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  # When multiple commits land in rapid succession, queue them rather than
  # cancelling. Each deploy is small enough (~1–2 min) that running them in
  # order is fine, and we avoid the case where a cancelled deploy leaves
  # the rsync mid-state on disk. Flip to `true` if queueing ever becomes
  # painful (e.g. a long batch of small commits during active work).
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Signal deploy-in-progress to the /status page BEFORE doing anything
      # else, so users hitting the page during the deploy see "deploy in
      # progress". The matching "Signal deploy finished" step at the bottom
      # runs `if: always()` so cancelled/failed deploys also clear the flag.
      - name: Signal deploy started
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mkdir -p /opt/usernode/runtime
            cat > /opt/usernode/runtime/deploy-status.json <<EOF
            {"deploying":true,"sha":"${{ github.sha }}","startedAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
            EOF

      - uses: actions/checkout@v4

      # Detect whether anything in this commit affects the usernode-node
      # sidecar's archive seeding or service definition. When false (and
      # there's no manual override / upstream image bump), the deploy
      # script skips the archive-fetch + force-recreate step. Pure
      # platform-code deploys then never touch the running sidecar —
      # child-app SSE streams stay open, the deploy is ~1 min faster,
      # and users don't see the loading overlay flash on every push.
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            node:
              - 'docker-compose.yml'
              - '.github/workflows/deploy.yml'
              - 'scripts/fetch-archive-snapshot.sh'
              - 'scripts/package-archive-snapshot.sh'

      - name: Sync repo to VPS
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: deploy
          SOURCE: ./
          TARGET: /opt/usernode/
          # --delete keeps the remote tree a faithful mirror of this
          # commit, but we exclude state + the on-server .env so they
          # survive. .git/.github/node_modules are build-time only.
          # `runtime/` is host-side ephemeral state (deploy-status.json,
          # bind-mounted into the container) — must survive a sync.
          ARGS: "-avz --delete --exclude=.git --exclude=.github --exclude=node_modules --exclude=data --exclude=.env --exclude=runtime"

      - name: Write .env and run docker compose
        uses: appleboy/ssh-action@v1
        env:
          # Path-filter result for files that affect the sidecar. Empty
          # string on workflow_dispatch when paths-filter doesn't run a
          # diff; treated as "false" by the script below.
          NODE_FILES_CHANGED: ${{ steps.changes.outputs.node }}
          # workflow_dispatch escape hatch. Unset on push events, in
          # which case `inputs.force_archive_refresh` evaluates to ''.
          FORCE_ARCHIVE_REFRESH: ${{ inputs.force_archive_refresh || 'false' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Forward the gating flags into the remote shell — appleboy
          # /ssh-action only exports vars listed here, not the whole
          # job env.
          envs: NODE_FILES_CHANGED,FORCE_ARCHIVE_REFRESH
          # Archive fetch can take several minutes on a fresh seed; bump
          # the action's default 10m ceiling so it doesn't kill the deploy
          # mid-tar.
          command_timeout: 30m
          script: |
            set -e
            cd /opt/usernode

            # Single-quoted heredoc: no shell expansion on the server.
            # GitHub Actions has already substituted all the expression
            # interpolations above, so the remote just sees literal
            # key=value lines. Safer than double-quoted, which would try
            # to expand $-refs that might appear inside secrets (e.g. a
            # $ sign in a password).
            cat > .env <<'ENVEOF'
            USERNODE_DOMAIN=${{ vars.USERNODE_DOMAIN }}
            ADMIN_USERNAME=${{ secrets.USERNODE_ADMIN_USERNAME }}
            ADMIN_PASSWORD=${{ secrets.USERNODE_ADMIN_PASSWORD }}
            SESSION_SECRET=${{ secrets.USERNODE_SESSION_SECRET }}
            JWT_SECRET=${{ secrets.USERNODE_JWT_SECRET }}
            USERNODE_DB_PASSWORD=${{ secrets.USERNODE_DB_PASSWORD }}
            GITHUB_APP_ID=${{ secrets.USERNODE_GITHUB_APP_ID }}
            GITHUB_PRIVATE_KEY='${{ secrets.USERNODE_GITHUB_PRIVATE_KEY }}'
            GITHUB_BOT_TOKEN=${{ secrets.USERNODE_GITHUB_BOT_TOKEN }}
            ANTHROPIC_API_KEY=${{ secrets.USERNODE_ANTHROPIC_API_KEY }}
            USERNODE_APP_PUBKEY=${{ secrets.USERNODE_APP_PUBKEY }}
            USERNODE_APP_SECRET_KEY=${{ secrets.USERNODE_APP_SECRET_KEY }}
            LOG_LEVEL=INFO
            GIT_SHA=${{ github.sha }}
            ENVEOF
            chmod 600 .env

            # ----------------------------------------------------------
            # Pull non-buildable images first so we can detect upstream
            # node image bumps. `--ignore-buildable` skips services with
            # a build context (the platform `usernode` image), so this
            # only pulls caddy / postgres / usernode-node. The platform
            # image is rebuilt below by `up -d --build`.
            #
            # We capture usernodelabs/usernode's image ID before+after
            # so the gating block below can treat an upstream bump as
            # equivalent to a node-affecting change — a new sidecar
            # binary may have new archive-format expectations or bug
            # fixes we want paired with a known-good archive.
            # ----------------------------------------------------------
            BEFORE_NODE_IMG=$(docker image inspect usernodelabs/usernode:latest --format '{{.Id}}' 2>/dev/null || echo "none")
            docker compose pull --ignore-buildable
            AFTER_NODE_IMG=$(docker image inspect usernodelabs/usernode:latest --format '{{.Id}}' 2>/dev/null || echo "none")

            # ----------------------------------------------------------
            # Decide whether to refresh the sidecar's archive snapshot
            # and force-recreate the usernode-node container. Refresh is
            # triggered when ANY of:
            #   1. NODE_FILES_CHANGED=true: this commit modifies the
            #      sidecar's compose definition or the archive-fetch
            #      scripts (set by the dorny/paths-filter step).
            #   2. FORCE_ARCHIVE_REFRESH=true: operator passed the
            #      workflow_dispatch input as an explicit override.
            #   3. The pulled usernodelabs/usernode:latest digest
            #      differs from what was on disk before the pull.
            #
            # Otherwise (the common path: pure platform-code change),
            # we leave the running sidecar alone. Its --archive flag
            # self-maintains the on-disk snapshot at the configured
            # interval, so the existing volume stays valid across
            # arbitrarily many code-only deploys. Skipping the refresh
            # avoids dropping every child-app's SSE stream on every
            # push and saves ~1 min of cold-boot.
            # ----------------------------------------------------------
            SHOULD_REFRESH_NODE=0
            if [ "${NODE_FILES_CHANGED:-false}" = "true" ]; then
              SHOULD_REFRESH_NODE=1
              echo "==> Node-related files changed in this commit; will refresh archive."
            fi
            if [ "${FORCE_ARCHIVE_REFRESH:-false}" = "true" ]; then
              SHOULD_REFRESH_NODE=1
              echo "==> Archive refresh forced via workflow_dispatch input."
            fi
            if [ "$BEFORE_NODE_IMG" != "$AFTER_NODE_IMG" ]; then
              SHOULD_REFRESH_NODE=1
              echo "==> Upstream usernodelabs/usernode image changed:"
              echo "      before: $BEFORE_NODE_IMG"
              echo "      after:  $AFTER_NODE_IMG"
              echo "    Will refresh archive."
            fi

            if [ "$SHOULD_REFRESH_NODE" = "1" ]; then
              # ----------------------------------------------------------
              # Archive snapshot: fetch from testnet-seed1 directly from
              # prod (reuses prod's existing seed SSH access — no
              # GH-runner-side key needed). Why:
              # PARTIAL_LEDGER_RECENT_TX_SOURCE_BUG — the sidecar's
              # runtime `tracked_owner/add` calls (every child app fires
              # one at boot) trip the wallet-seed shortcut into
              # partial-ledger overlay by default. Booting from a full
              # archive snapshot fixes it: node loads the full tree at
              # startup and applies every subsequent block in full mode,
              # so RecentTxEntry.source is authoritative and dapps
              # actually see incoming txs on the SSE stream.
              #
              # Prereq on this VPS: ~deploy/.ssh/config must define
              # `testnet-seed1` and the deploy user must have an
              # authorized_keys entry on that seed. Verify with:
              #   ssh -o BatchMode=yes -o ConnectTimeout=5 testnet-seed1 echo ok
              # If that prints `ok` the fetch will succeed.
              # ----------------------------------------------------------
              STAGING_DIR="/tmp/usernode-archive-staging-$$"
              ARCHIVE_VOLUME="usernode_usernode-node-archive"
              FETCH_OK=0

              echo "==> Fetching fresh archive snapshot from testnet-seed1..."
              mkdir -p "$STAGING_DIR"
              if ./scripts/fetch-archive-snapshot.sh testnet-seed1 "$STAGING_DIR" --replace; then
                FETCH_OK=1
                echo "==> Staged archive size:"
                du -sh "$STAGING_DIR"
              else
                echo "==> WARNING: archive fetch from testnet-seed1 failed."
              fi

              if [ "$FETCH_OK" = "1" ]; then
                echo "==> Streaming staged snapshot into docker volume $ARCHIVE_VOLUME..."
                # One-shot alpine container that wipes the existing
                # volume contents and unpacks the fresh snapshot in
                # place. Volume is created lazily by docker run if it
                # doesn't exist yet (first deploy after this workflow
                # lands).
                tar -czf - -C "$STAGING_DIR" . | docker run --rm -i \
                  -v "$ARCHIVE_VOLUME:/archive" alpine \
                  sh -c 'rm -rf /archive/* /archive/.[!.]* /archive/..?* 2>/dev/null; tar -xzf - -C /archive && echo "==> Volume populated: $(du -sh /archive | cut -f1)"'
                rm -rf "$STAGING_DIR"
                # Fresh snapshot landed in the volume — but compose only
                # recreates containers when their *definition* changes,
                # not when their *volume contents* change. Without an
                # explicit recreate the running usernode-node would keep
                # going on whatever in-memory state it loaded at its
                # last boot, and the brand-new archive on disk would
                # sit unused. Force a recreate so the sidecar reboots
                # from the fresh snapshot.
                #
                # `--no-deps` keeps the recreate scoped to this one
                # service (don't restart caddy / db / dapp containers
                # as a side effect). The flag is set here on the
                # success path *only*; on the fallback path we
                # deliberately leave the running node alone since its
                # existing archive is still valid.
                echo "==> Recreating usernode-node so it picks up the fresh archive..."
                docker compose up -d --no-deps --force-recreate usernode-node
              else
                # Fetch failed. The sidecar's --archive flag will self-
                # write new snapshots over time, so a non-empty existing
                # volume is fine to reuse. But an EMPTY volume means the
                # sidecar boots without an archive → wallet-seed
                # shortcut → partial-ledger mode → silent dapp breakage.
                # Fail loudly instead.
                echo "==> Probing existing archive volume..."
                ARCHIVE_SIZE=$(docker run --rm -v "$ARCHIVE_VOLUME:/archive" alpine du -sb /archive 2>/dev/null | cut -f1 || echo 0)
                echo "==> Existing archive size: ${ARCHIVE_SIZE:-0} bytes"
                # A live archive (chain_id + checkpoint binprots + blocks
                # dir) is tens to hundreds of MB. Anything under 1 MB is
                # effectively empty (likely just a stale chain_id stub).
                if [ "${ARCHIVE_SIZE:-0}" -lt 1000000 ]; then
                  echo "::error::Archive fetch from testnet-seed1 FAILED and prod has no usable existing archive (${ARCHIVE_SIZE:-0} bytes). Refusing to deploy a partial-ledger sidecar — that would silently break every dapp via PARTIAL_LEDGER_RECENT_TX_SOURCE_BUG. Fix prod's SSH access to testnet-seed1 (~deploy/.ssh/config) or pre-seed the volume manually, then re-run."
                  rm -rf "$STAGING_DIR"
                  exit 1
                fi
                echo "::warning::Archive fetch failed but prod has an existing archive (${ARCHIVE_SIZE} bytes from a previous deploy or self-write). Continuing with that snapshot — sidecar will boot in full mode."
              fi
            else
              echo "==> No node-affecting changes (compose / scripts / upstream image / manual override); skipping archive refresh."
              echo "==> Sidecar keeps running with its existing self-maintained archive."
            fi

            # Mirror scripts/rollback.sh into /opt/usernode-tools/ so the
            # kill-switch is always at a stable path that survives
            # rsync --delete (which scopes to /opt/usernode/ only). The
            # rollback script must work even when the harness is on
            # fire, so it lives outside the deploy tree intentionally —
            # see scripts/rollback.sh and SELF-HOSTING-PLAN.md Phase 1.
            # `install -d -o deploy -g deploy` is idempotent and uses
            # sudo only on first run (deploy has passwordless sudo per
            # scripts/server-bootstrap.sh).
            sudo install -d -o deploy -g deploy -m 755 /opt/usernode-tools
            install -m 755 scripts/rollback.sh /opt/usernode-tools/rollback.sh

            # ----------------------------------------------------------
            # One-time platform DB rename (SELF-HOSTING-PLAN.md sub-step
            # 2d). The platform's own data moves from the bare `usernode`
            # database to `app_usernode_2d5619`, matching the `app_<slug>`
            # convention every child app follows.
            #
            # This step is idempotent: if the target DB already exists
            # AND its row counts match the source, we skip silently. If
            # the target DB doesn't exist, we stop the harness, dump
            # `usernode`, create the target, restore into it, verify
            # counts, then proceed. Any failure drops the partial target
            # DB and aborts so the next attempt starts clean.
            #
            # The bare `usernode` DB stays in place permanently as the
            # postgres-bookkeeping target db-manager.js issues
            # `CREATE DATABASE` from when spawning child-app DBs.
            #
            # After the migration runs successfully once, this block
            # becomes a 1-line "already exists" no-op for every future
            # deploy. Removing it after a confidence window is safe but
            # not required.
            # ----------------------------------------------------------
            SRC_DB="usernode"
            NEW_DB="app_usernode_2d5619"
            # Tables we expect to exist after schema.sql has run. We
            # only require `users` to have at least one row (the seeded
            # admin) — `apps` and `chat_messages` are legitimately
            # empty on a fresh install and we don't want to false-fail
            # there. The other tables are existence-only sanity checks.
            DB_CHECK_TABLES=(users apps chat_messages)
            DB_NONEMPTY_TABLE="users"

            # `psql -lqt` lists databases; `cut -d\| -f1` extracts names.
            # `grep -qw` is whole-word match so e.g. `app_usernode_2d5619_test`
            # wouldn't satisfy this check.
            if docker exec usernode-db psql -U usernode -lqt 2>/dev/null \
                 | cut -d'|' -f1 | tr -d ' ' | grep -qx "$NEW_DB"; then
              # Steady-state path. We don't compare against SRC_DB
              # here because once the harness has been running on
              # NEW_DB, SRC_DB is stale by definition (new writes only
              # go to NEW_DB). Just sanity-check that NEW_DB has
              # data — if it's empty, something went wrong on a prior
              # run and the operator needs to look.
              echo "==> $NEW_DB already exists; sanity-checking"
              MIGRATED_OK=1
              for tbl in "${DB_CHECK_TABLES[@]}"; do
                TGT=$(docker exec usernode-db psql -U usernode -d "$NEW_DB" -tAc "SELECT count(*) FROM $tbl" 2>/dev/null || echo "missing")
                if [ "$TGT" = "missing" ]; then
                  echo "::error::table $tbl is missing in $NEW_DB"
                  MIGRATED_OK=0
                  break
                fi
                if [ "$tbl" = "$DB_NONEMPTY_TABLE" ] && [ "$TGT" -lt 1 ] 2>/dev/null; then
                  echo "::error::$tbl in $NEW_DB is empty (count=$TGT)"
                  MIGRATED_OK=0
                  break
                fi
              done
              if [ "$MIGRATED_OK" -ne 1 ]; then
                echo "::error::$NEW_DB exists but appears unhealthy. Refusing to proceed."
                echo "::error::Manual intervention required: drop $NEW_DB and re-run, or investigate."
                exit 1
              fi
              echo "==> $NEW_DB looks healthy; skipping migration"
            else
              echo "==> One-time migration: $SRC_DB -> $NEW_DB"

              # Pre-flight: source DB must exist with non-empty data,
              # otherwise we have nothing to migrate from. (A truly
              # green-field deploy where neither DB exists is also
              # supported — schema.sql will populate the empty NEW_DB on
              # first harness boot — but that's not the rename path.)
              if ! docker exec usernode-db psql -U usernode -lqt 2>/dev/null \
                   | cut -d'|' -f1 | tr -d ' ' | grep -qx "$SRC_DB"; then
                echo "==> Source DB $SRC_DB does not exist either. Treating as fresh install:"
                echo "==> creating empty $NEW_DB so schema.sql can populate it on first boot."
                docker exec -u postgres usernode-db createdb \
                  -U usernode -O usernode "$NEW_DB"
              else
                # Stop the harness so no concurrent writes can land in
                # SRC_DB between the dump and the cutover. Caddy will
                # 502 the platform vhost during this window; child apps
                # are unaffected (they don't traverse the harness).
                docker compose stop usernode

                TS=$(date -u +%Y%m%dT%H%M%SZ)
                DUMP_PATH="/tmp/usernode-pre-rename-$TS.sql"
                echo "==> Dumping $SRC_DB to $DUMP_PATH"
                if ! docker exec -i usernode-db pg_dump -U usernode "$SRC_DB" > "$DUMP_PATH"; then
                  echo "::error::pg_dump failed; aborting before any DB-state changes"
                  exit 1
                fi
                echo "==> Dump size: $(du -h "$DUMP_PATH" | cut -f1)"

                echo "==> Creating $NEW_DB"
                if ! docker exec -u postgres usernode-db createdb \
                       -U usernode -O usernode "$NEW_DB"; then
                  echo "::error::createdb failed; $NEW_DB may exist in a partial state"
                  exit 1
                fi

                echo "==> Restoring dump into $NEW_DB"
                if ! docker exec -i usernode-db psql -U usernode -d "$NEW_DB" -v ON_ERROR_STOP=1 < "$DUMP_PATH"; then
                  echo "::error::Restore failed; dropping $NEW_DB so next attempt starts clean"
                  docker exec -u postgres usernode-db dropdb -U usernode "$NEW_DB" || true
                  exit 1
                fi

                echo "==> Verifying row counts match"
                MISMATCH=0
                for tbl in "${DB_CHECK_TABLES[@]}"; do
                  SRC=$(docker exec usernode-db psql -U usernode -d "$SRC_DB" -tAc "SELECT count(*) FROM $tbl")
                  TGT=$(docker exec usernode-db psql -U usernode -d "$NEW_DB" -tAc "SELECT count(*) FROM $tbl")
                  echo "    $tbl: $SRC_DB=$SRC, $NEW_DB=$TGT"
                  if [ "$SRC" != "$TGT" ]; then
                    MISMATCH=1
                  fi
                done
                if [ "$MISMATCH" -eq 1 ]; then
                  echo "::error::Row counts do not match. Dropping $NEW_DB; aborting."
                  docker exec -u postgres usernode-db dropdb -U usernode "$NEW_DB" || true
                  exit 1
                fi
                echo "==> Migration complete; counts match"
              fi
            fi

            # Bring everything up. Build is required on every deploy —
            # the platform usernode image bakes in `COPY . .` so a
            # rebuild is how new code gets in. If the conditional
            # archive-refresh branch above already force-recreated
            # usernode-node, this `up -d` is a no-op for that service.
            # If the migration block above stopped usernode, this
            # restarts it pointed at the new DB.
            docker compose up -d --build --remove-orphans

            # Caddyfile is a read-only mount, so a rebuild of usernode
            # alone won't restart caddy. Force a config reload so any
            # Caddyfile changes from this deploy take effect. `|| true`
            # because on the very first deploy caddy may not be fully
            # up yet (it's racing with TLS issuance).
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile || true

      # Always clear the deploy-in-progress flag so the /status banner goes
      # away even when the deploy itself failed or was cancelled.
      # `if: always()` runs on success/failure/cancel, so this is the
      # closest we get to a guaranteed cleanup.
      - name: Signal deploy finished
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mkdir -p /opt/usernode/runtime
            echo '{"deploying":false}' > /opt/usernode/runtime/deploy-status.json
