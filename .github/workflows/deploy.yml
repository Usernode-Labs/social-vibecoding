name: Deploy

# Standalone deploy for Usernode Social Vibecoding.
#
# Targets a dedicated VPS (see README — "Standalone deployment"). Code
# is rsync'd to /opt/usernode, an `.env` is written from GitHub
# secrets, then `docker compose up -d --build` brings the stack up.
#
# Auto-deploys on every push to `main`. workflow_dispatch is kept for
# manual re-runs (e.g. rolling forward without a new commit, or
# replaying a deploy after rotating secrets).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_archive_refresh:
        description: "Force archive snapshot refresh + sidecar recreate (default: only when node-related files or upstream image changed)"
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  # When multiple commits land in rapid succession, queue them rather than
  # cancelling. Each deploy is small enough (~1–2 min) that running them in
  # order is fine, and we avoid the case where a cancelled deploy leaves
  # the rsync mid-state on disk. Flip to `true` if queueing ever becomes
  # painful (e.g. a long batch of small commits during active work).
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Signal deploy-in-progress to the /status page BEFORE doing anything
      # else, so users hitting the page during the deploy see "deploy in
      # progress". The matching "Signal deploy finished" step at the bottom
      # runs `if: always()` so cancelled/failed deploys also clear the flag.
      - name: Signal deploy started
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mkdir -p /opt/usernode/runtime
            cat > /opt/usernode/runtime/deploy-status.json <<EOF
            {"deploying":true,"sha":"${{ github.sha }}","startedAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
            EOF

      - uses: actions/checkout@v4

      # Detect whether anything in this commit affects the usernode-node
      # sidecar's archive seeding or service definition. When false (and
      # there's no manual override / upstream image bump), the deploy
      # script skips the archive-fetch + force-recreate step. Pure
      # platform-code deploys then never touch the running sidecar —
      # child-app SSE streams stay open, the deploy is ~1 min faster,
      # and users don't see the loading overlay flash on every push.
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            node:
              - 'docker-compose.yml'
              - '.github/workflows/deploy.yml'
              - 'scripts/fetch-archive-snapshot.sh'
              - 'scripts/package-archive-snapshot.sh'
            # caddy is only rebuilt when its image inputs change (#711).
            # Caddyfile is deliberately NOT listed: it's a read-only
            # mount, applied by the `caddy reload` step with no rebuild
            # or container recreate needed.
            caddy:
              - 'caddy.Dockerfile'

      # ------------------------------------------------------------------
      # Resolve GitHub-sourced values for variables that dapp.json's
      # `platform_env` block declares.
      #
      # Every other line in the .env heredoc below names its secret
      # literally, because `${{ secrets.FOO }}` has to be written out
      # when the workflow is authored. A platform variable introduced by
      # a proposal has no line here and can't get one without editing
      # this guardrailed file — which is the whole problem the feature
      # exists to solve. Filtering `toJSON(secrets)` / `toJSON(vars)`
      # against the committed manifest is the only mechanism GitHub
      # offers for reading a dynamically-named one.
      #
      # The manifest is the allow-list: only keys it DECLARES and marks
      # writable are forwarded, using the same readPlatformEnv() the
      # platform uses, so this can never widen the set of secrets that
      # reach the VPS beyond what a reviewed commit asked for. Values
      # are ::add-mask::'d before they can appear in any later log line.
      #
      # This is the fallback path. The primary one is the admin console
      # (resolved on the VPS by scripts/dump-platform-env.js, appended
      # after these lines and therefore winning) — but an operator who
      # would rather keep a value in GitHub can, and a value set here
      # still satisfies the pre-merge check's "somewhere to come from"
      # only once it has also been recorded in the console. Both paths
      # existing is deliberate: the console is not a lock-in.
      # ------------------------------------------------------------------
      - name: Resolve GitHub-sourced platform variables
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
          OUT_FILE: ${{ runner.temp }}/platform-env-github.txt
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { readPlatformEnv } = require('./src/services/app-manifest');

          let declared = [];
          try {
            declared = readPlatformEnv(JSON.parse(fs.readFileSync('dapp.json', 'utf8')));
          } catch (err) {
            console.log(`No readable platform_env block (${err.message}); nothing to forward.`);
          }

          const secrets = JSON.parse(process.env.ALL_SECRETS || '{}');
          const vars = JSON.parse(process.env.ALL_VARS || '{}');
          const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

          const lines = [];
          for (const entry of declared) {
            // Unwritable keys already have an explicit line in the
            // heredoc, sourced from the secret the operator actually
            // named. Forwarding them again would be a no-op at best and
            // a shadowing bug at worst.
            if (entry.unwritable) continue;
            const key = entry.key;
            const value = has(secrets, key) ? secrets[key] : (has(vars, key) ? vars[key] : null);
            if (typeof value !== 'string' || !value.length) continue;
            // Same representability rule the admin console enforces:
            // a single quote can't be escaped inside a single-quoted
            // .env value, and a bare CR can't round-trip the file.
            if (/['\r]/.test(value)) {
              console.log(`Skipping ${key}: not representable as a single-quoted .env value`);
              continue;
            }
            console.log(`::add-mask::${value}`);
            lines.push(`${key}='${value}'`);
          }

          fs.writeFileSync(process.env.OUT_FILE, lines.length ? `${lines.join('\n')}\n` : '');
          console.log(`Forwarding ${lines.length} GitHub-sourced platform variable(s).`);
          NODE
          # Single-line base64 so it survives $GITHUB_ENV and the
          # ssh-action's `envs:` forwarding without any quoting games.
          echo "GH_PLATFORM_ENV_B64=$(base64 -w0 < "$OUT_FILE")" >> "$GITHUB_ENV"
          rm -f "$OUT_FILE"

      # ------------------------------------------------------------------
      # Compose the base `.env` on the runner.
      #
      # These lines lived inside the ssh script below until GitHub started
      # rejecting the file outright: any string carrying a `${{ }}`
      # interpolation is compiled into one format() expression, and an
      # expression may not exceed 21,000 characters. The remote script is
      # ~30 KB, so wrapping the interpolated .env lines in it made the
      # whole workflow invalid ("Exceeded max expression length 21000")
      # and no deploy run was created at all — merges to main stopped
      # reaching production with no failed run to notice.
      #
      # So every interpolation lives in a SHORT step (this one) and the
      # long script receives the result as one opaque base64 blob, the
      # same shape the GitHub-sourced platform variables already use.
      #
      # Same keys, same order, same quoting, same committed defaults as
      # the heredoc this replaced (plus the platform-key block added by
      # the JWT key separation). The single-quoted heredoc still means no
      # shell expansion of its own — GitHub Actions has already
      # substituted every value, so a `$` inside a secret (e.g. a
      # password) stays literal. `#` lines land in .env as comments,
      # which docker compose's env-file parser ignores.
      # ------------------------------------------------------------------
      - name: Compose base .env
        env:
          OUT_FILE: ${{ runner.temp }}/base-env.txt
        run: |
          cat > "$OUT_FILE" <<'ENVEOF'
          USERNODE_DOMAIN=${{ vars.USERNODE_DOMAIN }}
          ZEROSSL_API_KEY=${{ secrets.ZEROSSL_API_KEY }}
          ZEROSSL_EAB_KID=${{ secrets.ZEROSSL_EAB_KID }}
          ZEROSSL_EAB_HMAC=${{ secrets.ZEROSSL_EAB_HMAC }}
          ACME_DNS_USERNAME=${{ secrets.ACME_DNS_USERNAME }}
          ACME_DNS_PASSWORD=${{ secrets.ACME_DNS_PASSWORD }}
          ACME_DNS_SUBDOMAIN=${{ secrets.ACME_DNS_SUBDOMAIN }}
          ADMIN_USERNAME=${{ secrets.USERNODE_ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.USERNODE_ADMIN_PASSWORD }}
          SESSION_SECRET=${{ secrets.USERNODE_SESSION_SECRET }}
          # Platform key separation. One USERNODE_JWT_SECRET used to sign
          # every token type AND double as the at-rest encryption key AND
          # get handed verbatim to every child container. It is now four
          # keys with one job each (src/services/platform-jwt.js).
          #
          # There is deliberately NO JWT_SECRET line any more. Phase 2 cut
          # the iframe authority over to the RSA pair, so nothing in the
          # platform process verifies with the old shared value and a token
          # signed with it now verifies nowhere. Child containers still get
          # a JWT_SECRET env var, but it is injected by
          # src/services/app-identity-env.js and carries the RSA PUBLIC key
          # (a deprecated alias of USERNODE_JWT_PUBLIC_KEY, kept so
          # pre-cutover scaffolds verify unchanged). Do not re-add it here:
          # the platform .env holding the retired secret under a name whose
          # meaning has changed is exactly the confusion to avoid.
          # DATA_ENCRYPTION_KEY deliberately ALSO reads
          # USERNODE_JWT_SECRET: it is the AES-256-GCM KDF input for every
          # BYOK key and app secret already at rest, so the VALUE MUST NOT
          # CHANGE. Renaming the env var is safe; rotating the secret makes
          # every stored ciphertext silently undecryptable (decrypt()
          # returns null — nothing crashes, the values just vanish). Never
          # point this at a freshly generated secret, and never add a
          # separate USERNODE_DATA_ENCRYPTION_KEY.
          DATA_ENCRYPTION_KEY=${{ secrets.USERNODE_JWT_SECRET }}
          # The three new authorities. These ARE free to rotate: rotating
          # the iframe pair or the edge secret just re-auths users;
          # rotating the worker secret evicts warm workers, which
          # re-bootstrap on their next turn. Add them under Settings ->
          # Secrets and variables -> Actions BEFORE the first deploy of
          # this change — boot refuses to start without them (see
          # src/config.js REQUIRED_PROD), and the post-deploy health gate
          # will roll production back.
          # Single-quoted like GITHUB_PRIVATE_KEY: single-line PEMs with
          # literal \n escapes. The pair must be generated TOGETHER — the
          # boot check round-trips a probe token through both halves and
          # exits 1 on a mismatch.
          IFRAME_JWT_PRIVATE_KEY='${{ secrets.USERNODE_IFRAME_JWT_PRIVATE_KEY }}'
          IFRAME_JWT_PUBLIC_KEY='${{ secrets.USERNODE_IFRAME_JWT_PUBLIC_KEY }}'
          WORKER_JWT_SECRET=${{ secrets.USERNODE_WORKER_JWT_SECRET }}
          EDGE_JWT_SECRET=${{ secrets.USERNODE_EDGE_JWT_SECRET }}
          USERNODE_DB_PASSWORD=${{ secrets.USERNODE_DB_PASSWORD }}
          GITHUB_APP_ID=${{ secrets.USERNODE_GITHUB_APP_ID }}
          GITHUB_PRIVATE_KEY='${{ secrets.USERNODE_GITHUB_PRIVATE_KEY }}'
          GITHUB_BOT_TOKEN=${{ secrets.USERNODE_GITHUB_BOT_TOKEN }}
          ANTHROPIC_API_KEY=${{ secrets.USERNODE_ANTHROPIC_API_KEY }}
          USERNODE_APP_PUBKEY=${{ secrets.USERNODE_APP_PUBKEY }}
          USERNODE_APP_SECRET_KEY=${{ secrets.USERNODE_APP_SECRET_KEY }}
          LOG_LEVEL=INFO
          GIT_SHA=${{ github.sha }}
          # Scaling tunables (see README scaling notes). Committed defaults
          # target ~50 concurrent users on the current 20-core/62GB box;
          # override any of them by setting a matching GitHub repo var
          # (Settings -> Secrets and variables -> Actions -> Variables)
          # without a code change.
          MAX_GLOBAL_SESSIONS=${{ vars.MAX_GLOBAL_SESSIONS || '75' }}
          MAX_USER_SESSIONS=${{ vars.MAX_USER_SESSIONS || '3' }}
          WORKER_MEMORY=${{ vars.WORKER_MEMORY || '1280m' }}
          WORKER_CPUS=${{ vars.WORKER_CPUS || '1' }}
          WORKER_IDLE_EVICTION_MS=${{ vars.WORKER_IDLE_EVICTION_MS || '300000' }}
          DB_POOL_MAX=${{ vars.DB_POOL_MAX || '60' }}
          SESSION_AUTOPAUSE_IDLE_MS=${{ vars.SESSION_AUTOPAUSE_IDLE_MS || '300000' }}
          STAGING_IDLE_TEARDOWN_MS=${{ vars.STAGING_IDLE_TEARDOWN_MS || '21600000' }}
          SESSION_SWEEP_INTERVAL_MS=${{ vars.SESSION_SWEEP_INTERVAL_MS || '60000' }}
          SESSION_LRU_ON_RESUME=${{ vars.SESSION_LRU_ON_RESUME || 'true' }}
          SESSION_PRESSURE_GRACE_MS=${{ vars.SESSION_PRESSURE_GRACE_MS || '900000' }}
          PR_STALE_NOTIFY_MS=${{ vars.PR_STALE_NOTIFY_MS || '604800000' }}
          PR_STALE_GRACE_MS=${{ vars.PR_STALE_GRACE_MS || '259200000' }}
          ARCHIVED_RETENTION_MS=${{ vars.ARCHIVED_RETENTION_MS || '2592000000' }}
          STALE_SWEEP_INTERVAL_MS=${{ vars.STALE_SWEEP_INTERVAL_MS || '3600000' }}
          CERT_WARM_TIMEOUT_MS=${{ vars.CERT_WARM_TIMEOUT_MS || '15000' }}
          CERT_PROBE_SLOW_MS=${{ vars.CERT_PROBE_SLOW_MS || '5000' }}
          DOCKER_STOP_GRACE_SEC=${{ vars.DOCKER_STOP_GRACE_SEC || '5' }}
          ENVEOF
          # Single-line base64 so it survives $GITHUB_ENV and the
          # ssh-action's `envs:` forwarding without any quoting games —
          # and so the multi-line GITHUB_PRIVATE_KEY PEM survives it too.
          echo "BASE_ENV_B64=$(base64 -w0 < "$OUT_FILE")" >> "$GITHUB_ENV"
          rm -f "$OUT_FILE"

      - name: Sync repo to VPS
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: deploy
          SOURCE: ./
          TARGET: /opt/usernode/
          # --delete keeps the remote tree a faithful mirror of this
          # commit, but we exclude state + the on-server .env so they
          # survive. .git/.github/node_modules are build-time only.
          # `runtime/` is host-side ephemeral state (deploy-status.json,
          # bind-mounted into the container) — must survive a sync.
          # `.platform-env` is the cached resolution of the console-set
          # platform variables; without the exclude, --delete would wipe
          # it on every deploy and the fallback would have nothing to
          # fall back to.
          ARGS: "-avz --delete --exclude=.git --exclude=.github --exclude=node_modules --exclude=data --exclude=.env --exclude=.platform-env* --exclude=runtime"

      - name: Write .env and run docker compose
        uses: appleboy/ssh-action@v1
        env:
          # Path-filter result for files that affect the sidecar. Empty
          # string on workflow_dispatch when paths-filter doesn't run a
          # diff; treated as "false" by the script below.
          NODE_FILES_CHANGED: ${{ steps.changes.outputs.node }}
          # Same deal for files that require rebuilding the caddy image.
          CADDY_FILES_CHANGED: ${{ steps.changes.outputs.caddy }}
          # workflow_dispatch escape hatch. Unset on push events, in
          # which case `inputs.force_archive_refresh` evaluates to ''.
          FORCE_ARCHIVE_REFRESH: ${{ inputs.force_archive_refresh || 'false' }}
          # base64 of the GitHub-sourced platform_env lines resolved above
          # (empty string when there are none).
          GH_PLATFORM_ENV_B64: ${{ env.GH_PLATFORM_ENV_B64 }}
          # base64 of the base .env composed by the step above. The remote
          # script decodes it instead of carrying the interpolations itself
          # (see that step's comment for why it cannot).
          BASE_ENV_B64: ${{ env.BASE_ENV_B64 }}
          # The sha being deployed. Forwarded rather than interpolated for
          # the same reason — the script must stay expression-free.
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Forward the gating flags into the remote shell — appleboy
          # /ssh-action only exports vars listed here, not the whole
          # job env.
          envs: NODE_FILES_CHANGED,CADDY_FILES_CHANGED,FORCE_ARCHIVE_REFRESH,GH_PLATFORM_ENV_B64,BASE_ENV_B64,DEPLOY_SHA
          # Archive fetch can take several minutes on a fresh seed; bump
          # the action's default 10m ceiling so it doesn't kill the deploy
          # mid-tar.
          command_timeout: 30m
          script: |
            set -e
            cd /opt/usernode

            # The sha currently deployed, read from the .env we are about
            # to overwrite. This is what the post-deploy health probe
            # rolls back to if the new container never becomes healthy.
            # Best-effort: on a green-field deploy there is no previous
            # .env, PREV_SHA stays empty, and the probe reports the
            # failure without attempting a rollback to nothing.
            PREV_SHA=$(grep -m1 '^GIT_SHA=' .env 2>/dev/null | cut -d= -f2- || true)
            echo "==> Previous GIT_SHA: ${PREV_SHA:-(none)}"

            # Base .env, composed on the runner by the "Compose base .env"
            # step above and handed over as ONE base64 blob. It used to be a
            # `cat > .env <<'ENVEOF'` heredoc right here, and it cannot be:
            # GitHub compiles any string carrying an interpolation into a
            # single format() expression, and expressions are capped at
            # 21,000 characters. Wrapping ~45 interpolated .env lines in
            # ~500 lines of remote script pushed this scalar to ~30 KB and
            # GitHub rejected the whole workflow ("Invalid workflow file …
            # Exceeded max expression length 21000") — no run was created at
            # all, so merges to main silently stopped reaching production.
            # Keeping this script free of interpolations is what keeps it a
            # plain literal, and therefore unbounded in length.
            #
            # Written (not appended): this is the authoritative base layer
            # that the two platform-variable blocks below override.
            if [ -z "${BASE_ENV_B64:-}" ]; then
              echo "::error::BASE_ENV_B64 was not forwarded from the runner; refusing to truncate .env"
              exit 1
            fi
            echo "$BASE_ENV_B64" | base64 -d > .env
            chmod 600 .env

            # GitHub-sourced values for manifest-declared platform
            # variables (resolved on the runner above). Appended AFTER the
            # heredoc so they override a committed default for the same
            # key — docker compose's env-file parser takes the last
            # occurrence. The admin-console values are appended after
            # these and win over both.
            if [ -n "${GH_PLATFORM_ENV_B64:-}" ]; then
              echo "$GH_PLATFORM_ENV_B64" | base64 -d >> .env
              echo "==> Applied $(echo "$GH_PLATFORM_ENV_B64" | base64 -d | grep -c . || true) GitHub-sourced platform variable(s)"
            fi

            # ----------------------------------------------------------
            # Pull non-buildable images first so we can detect upstream
            # node image bumps. `--ignore-buildable` skips services with
            # a build context (the platform `usernode` image), so this
            # only pulls caddy / postgres / usernode-node. The platform
            # image is rebuilt below by `up -d --build`.
            #
            # We capture usernodelabs/usernode's image ID before+after
            # so the gating block below can treat an upstream bump as
            # equivalent to a node-affecting change — a new sidecar
            # binary may have new archive-format expectations or bug
            # fixes we want paired with a known-good archive.
            # ----------------------------------------------------------
            BEFORE_NODE_IMG=$(docker image inspect usernodelabs/usernode:latest --format '{{.Id}}' 2>/dev/null || echo "none")
            docker compose pull --ignore-buildable
            AFTER_NODE_IMG=$(docker image inspect usernodelabs/usernode:latest --format '{{.Id}}' 2>/dev/null || echo "none")

            # ----------------------------------------------------------
            # Decide whether to refresh the sidecar's archive snapshot
            # and force-recreate the usernode-node container. Refresh is
            # triggered when ANY of:
            #   1. NODE_FILES_CHANGED=true: this commit modifies the
            #      sidecar's compose definition or the archive-fetch
            #      scripts (set by the dorny/paths-filter step).
            #   2. FORCE_ARCHIVE_REFRESH=true: operator passed the
            #      workflow_dispatch input as an explicit override.
            #   3. The pulled usernodelabs/usernode:latest digest
            #      differs from what was on disk before the pull.
            #
            # Otherwise (the common path: pure platform-code change),
            # we leave the running sidecar alone. Its --archive flag
            # self-maintains the on-disk snapshot at the configured
            # interval, so the existing volume stays valid across
            # arbitrarily many code-only deploys. Skipping the refresh
            # avoids dropping every child-app's SSE stream on every
            # push and saves ~1 min of cold-boot.
            # ----------------------------------------------------------
            SHOULD_REFRESH_NODE=0
            if [ "${NODE_FILES_CHANGED:-false}" = "true" ]; then
              SHOULD_REFRESH_NODE=1
              echo "==> Node-related files changed in this commit; will refresh archive."
            fi
            if [ "${FORCE_ARCHIVE_REFRESH:-false}" = "true" ]; then
              SHOULD_REFRESH_NODE=1
              echo "==> Archive refresh forced via workflow_dispatch input."
            fi
            if [ "$BEFORE_NODE_IMG" != "$AFTER_NODE_IMG" ]; then
              SHOULD_REFRESH_NODE=1
              echo "==> Upstream usernodelabs/usernode image changed:"
              echo "      before: $BEFORE_NODE_IMG"
              echo "      after:  $AFTER_NODE_IMG"
              echo "    Will refresh archive."
            fi

            if [ "$SHOULD_REFRESH_NODE" = "1" ]; then
              # ----------------------------------------------------------
              # Archive snapshot: fetch from testnet-seed1 directly from
              # prod (reuses prod's existing seed SSH access — no
              # GH-runner-side key needed). Why:
              # PARTIAL_LEDGER_RECENT_TX_SOURCE_BUG — the sidecar's
              # runtime `tracked_owner/add` calls (every child app fires
              # one at boot) trip the wallet-seed shortcut into
              # partial-ledger overlay by default. Booting from a full
              # archive snapshot fixes it: node loads the full tree at
              # startup and applies every subsequent block in full mode,
              # so RecentTxEntry.source is authoritative and dapps
              # actually see incoming txs on the SSE stream.
              #
              # Prereq on this VPS: ~deploy/.ssh/config must define
              # `testnet-seed1` and the deploy user must have an
              # authorized_keys entry on that seed. Verify with:
              #   ssh -o BatchMode=yes -o ConnectTimeout=5 testnet-seed1 echo ok
              # If that prints `ok` the fetch will succeed.
              # ----------------------------------------------------------
              STAGING_DIR="/tmp/usernode-archive-staging-$$"
              ARCHIVE_VOLUME="usernode_usernode-node-archive"
              FETCH_OK=0

              echo "==> Fetching fresh archive snapshot from testnet-seed1..."
              mkdir -p "$STAGING_DIR"
              if ./scripts/fetch-archive-snapshot.sh testnet-seed1 "$STAGING_DIR" --replace; then
                FETCH_OK=1
                echo "==> Staged archive size:"
                du -sh "$STAGING_DIR"
              else
                echo "==> WARNING: archive fetch from testnet-seed1 failed."
              fi

              if [ "$FETCH_OK" = "1" ]; then
                echo "==> Streaming staged snapshot into docker volume $ARCHIVE_VOLUME..."
                # One-shot alpine container that wipes the existing
                # volume contents and unpacks the fresh snapshot in
                # place. Volume is created lazily by docker run if it
                # doesn't exist yet (first deploy after this workflow
                # lands).
                tar -czf - -C "$STAGING_DIR" . | docker run --rm -i \
                  -v "$ARCHIVE_VOLUME:/archive" alpine \
                  sh -c 'rm -rf /archive/* /archive/.[!.]* /archive/..?* 2>/dev/null; tar -xzf - -C /archive && echo "==> Volume populated: $(du -sh /archive | cut -f1)"'
                rm -rf "$STAGING_DIR"
                # Fresh snapshot landed in the volume — but compose only
                # recreates containers when their *definition* changes,
                # not when their *volume contents* change. Without an
                # explicit recreate the running usernode-node would keep
                # going on whatever in-memory state it loaded at its
                # last boot, and the brand-new archive on disk would
                # sit unused. Force a recreate so the sidecar reboots
                # from the fresh snapshot.
                #
                # `--no-deps` keeps the recreate scoped to this one
                # service (don't restart caddy / db / dapp containers
                # as a side effect). The flag is set here on the
                # success path *only*; on the fallback path we
                # deliberately leave the running node alone since its
                # existing archive is still valid.
                echo "==> Recreating usernode-node so it picks up the fresh archive..."
                docker compose up -d --no-deps --force-recreate usernode-node

                # Child-app cache flush. Every dapp server keeps an
                # in-memory raw-tx cache (createAppStateCache) that
                # dedups by tx_id. If the sidecar was running in
                # partial-ledger mode for any window before this
                # recreate, those caches will hold rows with
                # source=null, and the new full-mode SSE stream's
                # re-deliveries (same tx_ids, source set) get dropped
                # by the dedup. Result: dapp UI stays silently broken
                # until each child container is restarted, even after
                # the sidecar is healthy. Restart them all so they
                # re-backfill from the now-authoritative sidecar.
                #
                # Cheap (<1s per container, parallel-safe), idempotent,
                # and runs only on the success path where we just
                # rotated the sidecar — pure platform-code deploys
                # skip this entirely.
                echo "==> Restarting child-app containers to flush stale source-null cache rows..."
                docker ps --format '{{.Names}}' | grep '^usernode-app-' \
                  | xargs -r -n 1 -P 8 docker restart \
                  | sed 's/^/    restarted: /'
              else
                # Fetch failed. The sidecar's --archive flag will self-
                # write new snapshots over time, so a non-empty existing
                # volume is fine to reuse. But an EMPTY volume means the
                # sidecar boots without an archive → wallet-seed
                # shortcut → partial-ledger mode → silent dapp breakage.
                # Fail loudly instead.
                echo "==> Probing existing archive volume..."
                ARCHIVE_SIZE=$(docker run --rm -v "$ARCHIVE_VOLUME:/archive" alpine du -sb /archive 2>/dev/null | cut -f1 || echo 0)
                echo "==> Existing archive size: ${ARCHIVE_SIZE:-0} bytes"
                # A live archive (chain_id + checkpoint binprots + blocks
                # dir) is tens to hundreds of MB. Anything under 1 MB is
                # effectively empty (likely just a stale chain_id stub).
                if [ "${ARCHIVE_SIZE:-0}" -lt 1000000 ]; then
                  echo "::error::Archive fetch from testnet-seed1 FAILED and prod has no usable existing archive (${ARCHIVE_SIZE:-0} bytes). Refusing to deploy a partial-ledger sidecar — that would silently break every dapp via PARTIAL_LEDGER_RECENT_TX_SOURCE_BUG. Fix prod's SSH access to testnet-seed1 (~deploy/.ssh/config) or pre-seed the volume manually, then re-run."
                  rm -rf "$STAGING_DIR"
                  exit 1
                fi
                echo "::warning::Archive fetch failed but prod has an existing archive (${ARCHIVE_SIZE} bytes from a previous deploy or self-write). Continuing with that snapshot — sidecar will boot in full mode."
              fi
            else
              echo "==> No node-affecting changes (compose / scripts / upstream image / manual override); skipping archive refresh."
              echo "==> Sidecar keeps running with its existing self-maintained archive."
            fi

            # Mirror scripts/rollback.sh into /opt/usernode-tools/ so the
            # kill-switch is always at a stable path that survives
            # rsync --delete (which scopes to /opt/usernode/ only). The
            # rollback script must work even when the harness is on
            # fire, so it lives outside the deploy tree intentionally —
            # see scripts/rollback.sh and SELF-HOSTING.md Phase 1.
            # `install -d -o deploy -g deploy` is idempotent and uses
            # sudo only on first run (deploy has passwordless sudo per
            # scripts/server-bootstrap.sh).
            sudo install -d -o deploy -g deploy -m 755 /opt/usernode-tools
            install -m 755 scripts/rollback.sh /opt/usernode-tools/rollback.sh

            # ----------------------------------------------------------
            # One-time platform DB rename (SELF-HOSTING.md sub-step
            # 2d). The platform's own data moves from the bare `usernode`
            # database to `app_usernode_2d5619`, matching the `app_<slug>`
            # convention every child app follows.
            #
            # This step is idempotent: if the target DB already exists
            # AND its row counts match the source, we skip silently. If
            # the target DB doesn't exist, we stop the harness, dump
            # `usernode`, create the target, restore into it, verify
            # counts, then proceed. Any failure drops the partial target
            # DB and aborts so the next attempt starts clean.
            #
            # The bare `usernode` DB stays in place permanently as the
            # postgres-bookkeeping target db-manager.js issues
            # `CREATE DATABASE` from when spawning child-app DBs.
            #
            # After the migration runs successfully once, this block
            # becomes a 1-line "already exists" no-op for every future
            # deploy. Removing it after a confidence window is safe but
            # not required.
            # ----------------------------------------------------------
            SRC_DB="usernode"
            NEW_DB="app_usernode_2d5619"
            # Tables we expect to exist after schema.sql has run. We
            # only require `users` to have at least one row (the seeded
            # admin) — `apps` and `chat_messages` are legitimately
            # empty on a fresh install and we don't want to false-fail
            # there. The other tables are existence-only sanity checks.
            DB_CHECK_TABLES=(users apps chat_messages)
            DB_NONEMPTY_TABLE="users"

            # `psql -lqt` lists databases; `cut -d\| -f1` extracts names.
            # `grep -qw` is whole-word match so e.g. `app_usernode_2d5619_test`
            # wouldn't satisfy this check.
            if docker exec usernode-db psql -U usernode -lqt 2>/dev/null \
                 | cut -d'|' -f1 | tr -d ' ' | grep -qx "$NEW_DB"; then
              # Steady-state path. We don't compare against SRC_DB
              # here because once the harness has been running on
              # NEW_DB, SRC_DB is stale by definition (new writes only
              # go to NEW_DB). Just sanity-check that NEW_DB has
              # data — if it's empty, something went wrong on a prior
              # run and the operator needs to look.
              echo "==> $NEW_DB already exists; sanity-checking"
              MIGRATED_OK=1
              for tbl in "${DB_CHECK_TABLES[@]}"; do
                TGT=$(docker exec usernode-db psql -U usernode -d "$NEW_DB" -tAc "SELECT count(*) FROM $tbl" 2>/dev/null || echo "missing")
                if [ "$TGT" = "missing" ]; then
                  echo "::error::table $tbl is missing in $NEW_DB"
                  MIGRATED_OK=0
                  break
                fi
                if [ "$tbl" = "$DB_NONEMPTY_TABLE" ] && [ "$TGT" -lt 1 ] 2>/dev/null; then
                  echo "::error::$tbl in $NEW_DB is empty (count=$TGT)"
                  MIGRATED_OK=0
                  break
                fi
              done
              if [ "$MIGRATED_OK" -ne 1 ]; then
                echo "::error::$NEW_DB exists but appears unhealthy. Refusing to proceed."
                echo "::error::Manual intervention required: drop $NEW_DB and re-run, or investigate."
                exit 1
              fi
              echo "==> $NEW_DB looks healthy; skipping migration"
            else
              echo "==> One-time migration: $SRC_DB -> $NEW_DB"

              # Pre-flight: source DB must exist with non-empty data,
              # otherwise we have nothing to migrate from. (A truly
              # green-field deploy where neither DB exists is also
              # supported — schema.sql will populate the empty NEW_DB on
              # first harness boot — but that's not the rename path.)
              if ! docker exec usernode-db psql -U usernode -lqt 2>/dev/null \
                   | cut -d'|' -f1 | tr -d ' ' | grep -qx "$SRC_DB"; then
                echo "==> Source DB $SRC_DB does not exist either. Treating as fresh install:"
                echo "==> creating empty $NEW_DB so schema.sql can populate it on first boot."
                docker exec -u postgres usernode-db createdb \
                  -U usernode -O usernode "$NEW_DB"
              else
                # Stop the harness so no concurrent writes can land in
                # SRC_DB between the dump and the cutover. Caddy will
                # 502 the platform vhost during this window; child apps
                # are unaffected (they don't traverse the harness).
                docker compose stop usernode

                TS=$(date -u +%Y%m%dT%H%M%SZ)
                DUMP_PATH="/tmp/usernode-pre-rename-$TS.sql"
                echo "==> Dumping $SRC_DB to $DUMP_PATH"
                if ! docker exec -i usernode-db pg_dump -U usernode "$SRC_DB" > "$DUMP_PATH"; then
                  echo "::error::pg_dump failed; aborting before any DB-state changes"
                  exit 1
                fi
                echo "==> Dump size: $(du -h "$DUMP_PATH" | cut -f1)"

                echo "==> Creating $NEW_DB"
                if ! docker exec -u postgres usernode-db createdb \
                       -U usernode -O usernode "$NEW_DB"; then
                  echo "::error::createdb failed; $NEW_DB may exist in a partial state"
                  exit 1
                fi

                echo "==> Restoring dump into $NEW_DB"
                if ! docker exec -i usernode-db psql -U usernode -d "$NEW_DB" -v ON_ERROR_STOP=1 < "$DUMP_PATH"; then
                  echo "::error::Restore failed; dropping $NEW_DB so next attempt starts clean"
                  docker exec -u postgres usernode-db dropdb -U usernode "$NEW_DB" || true
                  exit 1
                fi

                echo "==> Verifying row counts match"
                MISMATCH=0
                for tbl in "${DB_CHECK_TABLES[@]}"; do
                  SRC=$(docker exec usernode-db psql -U usernode -d "$SRC_DB" -tAc "SELECT count(*) FROM $tbl")
                  TGT=$(docker exec usernode-db psql -U usernode -d "$NEW_DB" -tAc "SELECT count(*) FROM $tbl")
                  echo "    $tbl: $SRC_DB=$SRC, $NEW_DB=$TGT"
                  if [ "$SRC" != "$TGT" ]; then
                    MISMATCH=1
                  fi
                done
                if [ "$MISMATCH" -eq 1 ]; then
                  echo "::error::Row counts do not match. Dropping $NEW_DB; aborting."
                  docker exec -u postgres usernode-db dropdb -U usernode "$NEW_DB" || true
                  exit 1
                fi
                echo "==> Migration complete; counts match"
              fi
            fi

            # ----------------------------------------------------------
            # Bring the stack up WITHOUT rebuilding caddy on routine
            # deploys (#711). The old unscoped `up -d --build` rebuilt
            # every buildable image, including usernode-caddy:acmedns —
            # and xcaddy builds are not reproducible, so any build-cache
            # eviction on the VPS minted a new image ID and compose
            # recreated caddy: a full edge outage (TLS drop, every
            # SSE/WS stream cut) on a deploy that didn't touch caddy at
            # all.
            #
            # 1. Scoped `up usernode`: rebuild is required on every
            #    deploy — the platform image bakes in `COPY . .`, so a
            #    rebuild is how new code gets in. Recreates only the
            #    platform container (and starts its depends_on services
            #    if they're stopped). If the migration block above
            #    stopped usernode, this restarts it pointed at the new
            #    DB; if the archive-refresh branch already recreated
            #    usernode-node, this is a no-op for that service.
            # 2. Unscoped `up` WITHOUT --build: ensures caddy/acme-dns/
            #    db/node are running and prunes orphans. Images are only
            #    built here if they don't exist at all (green-field
            #    first deploy), so an existing caddy container is never
            #    recreated by this step.
            # 3. caddy is rebuilt only when caddy.Dockerfile changed
            #    (CADDY_FILES_CHANGED via the paths-filter step; empty
            #    on workflow_dispatch → treated as false). Caddyfile
            #    changes need no rebuild — the `caddy reload` below
            #    applies them to the running container.
            # ----------------------------------------------------------
            # Build first, separately from `up`, so the freshly-built
            # image can resolve the admin-console platform variables into
            # .env BEFORE the platform container starts with it. (This
            # was `up -d --build usernode`; splitting it is what makes
            # the step below possible on the same deploy that introduces
            # a variable, rather than one deploy later.)
            docker compose build usernode

            # ----------------------------------------------------------
            # Materialize the platform variables an admin set in the
            # console. They live encrypted in the platform's own
            # database, so something with the DB credentials has to
            # decrypt them — and /opt/usernode/runtime is mounted :ro,
            # so the running platform cannot write the snapshot itself.
            # A throwaway container off the image we just built has the
            # credentials already via env_file and needs no new mount,
            # port, or auth surface. --no-deps because usernode-db is
            # already up from the previous deploy; -T so stdout and
            # stderr stay separate streams.
            #
            # Failure is non-fatal by design: `|| true` plus the sentinel
            # check means a DB hiccup reuses the previous run's cached
            # .platform-env rather than failing the deploy or silently
            # truncating the platform's configuration. Losing an
            # override for one deploy is cheaper than a failed deploy.
            # ----------------------------------------------------------
            RAW_ENV=$(docker compose run --rm --no-deps -T usernode \
              node scripts/dump-platform-env.js 2>/dev/null || true)
            if echo "$RAW_ENV" | grep -q '^#__PLATFORM_ENV_END__$'; then
              # `|| true`: a complete-but-empty block (no console-set
              # variables yet) makes grep -v exit 1, which under set -e
              # killed the whole deploy with no output — first hit on the
              # first deploy after the platform_env tables existed.
              echo "$RAW_ENV" \
                | sed -n '/^#__PLATFORM_ENV_BEGIN__$/,/^#__PLATFORM_ENV_END__$/p' \
                | { grep -v '^#__PLATFORM_ENV_' || true; } > .platform-env.new
              mv .platform-env.new .platform-env
              chmod 600 .platform-env
              echo "==> Resolved $(grep -c . .platform-env || true) console-set platform variable(s)"
            else
              echo "==> WARNING: platform-env resolution produced no complete block; reusing cache"
            fi
            if [ -s .platform-env ]; then
              cat .platform-env >> .env
            fi

            # ----------------------------------------------------------
            # Don't cut over while a pg_dump of the platform database is
            # in flight. Every staging-preview build of the self-app dumps
            # $NEW_DB from *inside* the usernode-db container, so the dump
            # survives the platform container being recreated — and its
            # ACCESS SHARE locks on every table block the new container's
            # boot migrations (ALTER TABLE needs ACCESS EXCLUSIVE), eating
            # the whole 120s health gate and triggering a spurious
            # rollback (2026-07-30 incident, run 30578204174).
            #
            # 10-minute cap: a dump of the ~10 GB platform DB finishes in
            # single-digit minutes. If one is somehow stuck we proceed
            # anyway — migrate.js's lock_timeout+retry loop and the health
            # gate below are the second line of defense.
            # ----------------------------------------------------------
            DUMP_WAITED=0
            while [ "$DUMP_WAITED" -lt 600 ]; do
              ACTIVE_DUMPS=$(docker exec usernode-db psql -U usernode -d postgres -Atc \
                "SELECT count(*) FROM pg_stat_activity WHERE application_name = 'pg_dump' AND datname = '$NEW_DB'" \
                2>/dev/null || echo 0)
              if [ "${ACTIVE_DUMPS:-0}" = "0" ]; then break; fi
              if [ "$DUMP_WAITED" -eq 0 ]; then
                echo "==> Waiting for $ACTIVE_DUMPS in-flight pg_dump(s) of $NEW_DB (staging clone) to finish before cutover..."
              fi
              sleep 10
              DUMP_WAITED=$((DUMP_WAITED + 10))
            done
            if [ "$DUMP_WAITED" -ge 600 ]; then
              echo "==> WARNING: platform-DB pg_dump still running after ${DUMP_WAITED}s; proceeding anyway."
            elif [ "$DUMP_WAITED" -gt 0 ]; then
              echo "==> Platform-DB dump(s) finished after ${DUMP_WAITED}s; cutting over."
            fi

            docker compose up -d usernode
            docker compose up -d --remove-orphans

            # ----------------------------------------------------------
            # Post-deploy health gate. A platform variable that is
            # declared, unset, and read at boot is exactly the failure
            # this feature's pre-merge check tries to prevent — but the
            # check can be skipped (force-merge, a value cleared after
            # the merge, a GitHub outage that made it fail open), so the
            # deploy needs its own answer to "did it actually come up?".
            #
            # Two CONSECUTIVE successes: a container mid-boot can answer
            # once and then exit, and a single 200 from a process that
            # is about to crash is worse than no signal at all.
            # ----------------------------------------------------------
            HEALTH_OK=0
            HEALTH_STREAK=0
            HEALTH_WAITED=0
            while [ "$HEALTH_WAITED" -lt 120 ]; do
              if docker compose exec -T usernode wget -qO- http://localhost:3000/health >/dev/null 2>&1; then
                HEALTH_STREAK=$((HEALTH_STREAK + 1))
                if [ "$HEALTH_STREAK" -ge 2 ]; then HEALTH_OK=1; break; fi
              else
                HEALTH_STREAK=0
              fi
              sleep 5
              HEALTH_WAITED=$((HEALTH_WAITED + 5))
            done

            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "::error::Platform did not become healthy within 120s of deploying ${DEPLOY_SHA:-(unknown sha)}"
              echo "==> Last 200 log lines from the unhealthy container:"
              docker compose logs --tail 200 usernode || true
              if [ -n "$PREV_SHA" ] && [ -x /opt/usernode-tools/rollback.sh ]; then
                echo "==> Rolling back to $PREV_SHA"
                /opt/usernode-tools/rollback.sh "$PREV_SHA" || \
                  echo "::error::Rollback to $PREV_SHA also failed — manual intervention required"
              else
                echo "::error::No previous sha or rollback script available; leaving the stack as-is"
              fi
              exit 1
            fi
            echo "==> Platform healthy after ${HEALTH_WAITED}s"

            if [ "${CADDY_FILES_CHANGED:-false}" = "true" ]; then
              echo "==> caddy.Dockerfile changed; rebuilding + recreating caddy"
              docker compose build caddy
              docker compose up -d caddy
            fi

            # Caddyfile is a read-only mount, so a rebuild of usernode
            # alone won't restart caddy. Force a config reload so any
            # Caddyfile changes from this deploy take effect. `|| true`
            # because on the very first deploy caddy may not be fully
            # up yet (it's racing with TLS issuance).
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile || true

      # Always clear the deploy-in-progress flag so the /status banner goes
      # away even when the deploy itself failed or was cancelled.
      # `if: always()` runs on success/failure/cancel, so this is the
      # closest we get to a guaranteed cleanup.
      - name: Signal deploy finished
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mkdir -p /opt/usernode/runtime
            echo '{"deploying":false}' > /opt/usernode/runtime/deploy-status.json
