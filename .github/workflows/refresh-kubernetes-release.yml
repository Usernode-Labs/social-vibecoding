name: Refresh Kubernetes release in Argo CD

on:
  workflow_run:
    workflows: [Build Kubernetes images]
    branches: [main]
    types: [completed]

permissions:
  actions: read

jobs:
  refresh:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && github.event.workflow_run.path == '.github/workflows/build-kubernetes-images.yml'
          && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      # A superseded run can succeed without pushing a chart. Use its exact
      # attempt so a skipped run cannot pick up the push from an earlier one.
      - name: Confirm a chart was published
        id: chart
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          published="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" \
            --jq 'any(.jobs[]; .name == "Publish atomic Helm release" and any(.steps[]; .name == "Publish OCI Helm release" and .conclusion == "success"))')"
          echo "published=$published" >> "$GITHUB_OUTPUT"

      # If periodic reconciliation already started this exact sync, a hard
      # refresh makes Argo enumerate chart tags again during the rollout.
      # Otherwise bypass the cached stable 0.1.* lookup to discover this chart.
      - name: Ask Argo CD to refresh the release
        if: steps.chart.outputs.published == 'true'
        continue-on-error: true
        env:
          ARGOCD_REFRESH_TOKEN: ${{ secrets.ARGOCD_REFRESH_TOKEN }}
          ARGOCD_SERVER: argocd.platform.beta.usernodelabs.org
          ARGOCD_APPLICATION: social-vibecoding-platform
          RELEASE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RELEASE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          [ -n "$ARGOCD_REFRESH_TOKEN" ] || exit 0
          # The build names each immutable chart by its release run and attempt.
          chart_version="0.1.$((RELEASE_RUN_NUMBER * 1000 + RELEASE_ATTEMPT))"
          application_url="https://${ARGOCD_SERVER}/api/v1/applications/${ARGOCD_APPLICATION}"
          application="$(curl --silent --fail --max-time 5 \
            --header "Authorization: Bearer ${ARGOCD_REFRESH_TOKEN}" \
            "$application_url" || true)"
          if jq -e --arg chart "$chart_version" '
            .status.operationState as $operation
            | ($operation.phase == "Running" or $operation.phase == "Succeeded")
              and (($operation.operation.sync.revisions[0] // $operation.syncResult.revisions[0]) == $chart)
          ' >/dev/null 2>&1 <<< "$application"; then
            echo "Argo CD already started syncing chart ${chart_version}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 120 \
            --header "Authorization: Bearer ${ARGOCD_REFRESH_TOKEN}" \
            "${application_url}?refresh=hard")" \
            || status="curl exit $?"
          if [ "$status" = "200" ]; then
            echo "Argo CD re-read the chart registry and compared ${ARGOCD_APPLICATION}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning title=Argo CD refresh not confirmed::${ARGOCD_APPLICATION} returned '${status}'. Periodic reconciliation will pick up the chart. See the infra runbook for token configuration."
          exit 1
