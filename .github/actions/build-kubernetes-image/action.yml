name: Build or reuse Kubernetes image
description: Build a release image, or resolve a previously published worker or capture image.
inputs:
  component:
    description: Kubernetes image component
    required: true
  force-rebuild:
    description: Component to refresh without cached layers
    default: none
  claude-code-version:
    description: Exact npm version used to build the worker
outputs:
  image:
    description: Image repository
    value: ${{ steps.reuse.outputs.image }}
  digest:
    description: Immutable index digest to verify and release
    value: ${{ steps.reuse.outputs.digest || steps.build.outputs.digest }}
  reason:
    description: Why this image was built or reused
    value: ${{ steps.reuse.outputs.reason }}
runs:
  using: composite
  steps:
    # The runner and BuildKit both use the mirror to avoid Docker Hub's
    # anonymous limits, including when BuildKit pulls its SBOM scanner.
    - uses: docker/setup-buildx-action@v4
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]

    - name: Resolve reusable image
      id: reuse
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        FORCE_REBUILD: ${{ inputs.force-rebuild }}
        CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
      run: node scripts/resolve-kubernetes-image.js

    - name: Build and push image
      id: build
      if: steps.reuse.outputs.digest == ''
      uses: docker/build-push-action@v7
      with:
        context: ${{ steps.reuse.outputs.context }}
        file: ${{ steps.reuse.outputs.dockerfile }}
        platforms: linux/amd64
        push: true
        tags: |
          ${{ steps.reuse.outputs.image }}:sha-${{ github.sha }}
          ${{ steps.reuse.outputs.reuse_tag }}
        pull: true
        no-cache: ${{ steps.reuse.outputs.refresh == 'true' }}
        build-args: |
          ${{ inputs.component == 'platform' && format('GIT_SHA={0}', github.sha) || '' }}
          ${{ inputs.component == 'worker' && format('CLAUDE_CODE_VERSION={0}', inputs.claude-code-version) || '' }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=social-vibecoding-${{ inputs.component }}
        cache-to: |
          type=gha,mode=max,scope=social-vibecoding-${{ inputs.component }}
          ${{ inputs.component == 'worker' && 'type=inline' || '' }}
        provenance: mode=max
        sbom: true
