[package]
name = "wasm-data"
description = "The data service: a Wasm app's only way to its database"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wasm-data"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
fallible-iterator = "0.2"
futures = "0.3"
postgres-protocol = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "sync", "time"] }
tokio-postgres = "0.7"
wasm-common = { path = "../common" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "sync", "time"] }
