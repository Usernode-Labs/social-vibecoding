[package]
name = "wasm-runner"
description = "The runner: builds app modules and runs them, a fresh instance per request"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wasm-runner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
flate2 = "1"
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "sync", "time", "process", "fs"] }
url = "2"
wasm-common = { path = "../common" }
wasmtime = { version = "51", default-features = false, features = ["async", "cranelift", "runtime", "pooling-allocator", "parallel-compilation", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
