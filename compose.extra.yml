  usernode-db:
    image: postgres:17-alpine
    container_name: project-usernode-db
    restart: unless-stopped
    networks:
      - web
    volumes:
      - usernode-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: usernode
      POSTGRES_USER: usernode
      POSTGRES_PASSWORD: ${USERNODE_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usernode"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    security_opt:
      - no-new-privileges:true

# extra_volumes
  usernode-db-data:
