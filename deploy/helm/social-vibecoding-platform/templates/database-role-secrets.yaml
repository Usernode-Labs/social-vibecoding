{{- if and .Values.enabled .Values.databaseRoles.enabled .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "social-vibecoding-platform.databaseMigrationSecret" . }}
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
type: Opaque
stringData:
  DATABASE_URL: {{ include "social-vibecoding-platform.databaseRoleUrl" (dict "root" . "role" "migrator" "database" .Values.postgresql.applicationDatabase) | quote }}
  DB_ADMIN_URL: {{ include "social-vibecoding-platform.databaseRoleUrl" (dict "root" . "role" "provisioner" "database" .Values.postgresql.database) | quote }}
---
# Only the bounded bootstrap Job imports this Secret. Neither serving role
# nor the ordinary schema migration receives a cluster-superuser URL.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "social-vibecoding-platform.databaseBootstrapSecret" . }}
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
type: Opaque
stringData:
  DATABASE_BOOTSTRAP_URL: {{ printf "postgres://%s:%s@%s:%d/%s" .Values.postgresql.username .Values.secrets.databasePassword (include "social-vibecoding-platform.postgresqlHost" .) (int .Values.postgresql.port) .Values.postgresql.database | quote }}
  DATABASE_WEB_PASSWORD: {{ .Values.secrets.webDatabasePassword | quote }}
  DATABASE_CONDUCTOR_PASSWORD: {{ .Values.secrets.conductorDatabasePassword | quote }}
  DATABASE_MIGRATOR_PASSWORD: {{ .Values.secrets.migratorDatabasePassword | quote }}
  DATABASE_PROVISIONER_PASSWORD: {{ .Values.secrets.provisionerDatabasePassword | quote }}
  {{- if .Values.previewPostgresql.enabled }}
  STAGING_DATABASE_BOOTSTRAP_URL: {{ printf "postgres://%s:%s@%s:%d/%s" .Values.previewPostgresql.username .Values.secrets.previewDatabasePassword .Values.previewPostgresql.host (int .Values.previewPostgresql.port) .Values.previewPostgresql.database | quote }}
  STAGING_DATABASE_READ_PASSWORD: {{ .Values.secrets.previewReadDatabasePassword | quote }}
  STAGING_DATABASE_PROVISIONER_PASSWORD: {{ .Values.secrets.previewProvisionerDatabasePassword | quote }}
  {{- else }}
  STAGING_DATABASE_BOOTSTRAP_URL: ""
  {{- end }}
{{- end }}
