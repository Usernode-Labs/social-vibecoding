{{- if and .Values.enabled .Values.podDisruptionBudget.enabled .Values.platform.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}-platform
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "social-vibecoding-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: platform
{{- end }}
{{- if and .Values.enabled .Values.podDisruptionBudget.enabled .Values.postgresql.enabled }}
{{- if .Values.platform.enabled }}
---
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}-postgresql
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "social-vibecoding-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
{{- end }}
