{{- if and .Values.enabled .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}-migrate
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "social-vibecoding-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "social-vibecoding-platform.fullname" . }}-migrator
      automountServiceAccountToken: {{ .Values.databaseControlPlane.bindingsEnabled }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "social-vibecoding-platform.image" .Values.platform.image | quote }}
          imagePullPolicy: {{ .Values.platform.image.pullPolicy }}
          command: ["node", "scripts/migrate-kubernetes.js"]
          securityContext:
            {{- include "social-vibecoding-platform.containerSecurityContext" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "social-vibecoding-platform.secretName" . }}
          env:
            - {name: SV_DATABASE_BINDINGS_ENABLED, value: {{ .Values.databaseControlPlane.bindingsEnabled | quote }}}
            {{- if .Values.databaseControlPlane.runtimeSecret }}
            - {name: SV_DATABASE_TARGETS_FILE, value: /etc/sv-database-targets/targets.json}
            {{- end }}
            {{- if .Values.databaseControlPlane.bindingsEnabled }}
            - {name: SV_DATABASE_POLICY_FILE, value: /etc/sv-database/policy.json}
            {{- end }}
            - {name: NODE_ENV, value: production}
            - {name: APP_RUNTIME, value: kubernetes}
            - {name: WORKER_RUNTIME, value: kubernetes}
            - {name: CAPTURE_RUNTIME, value: kubernetes}
            - {name: NODE_RPC_URL, value: {{ .Values.config.nodeRpcUrl | quote }}}
            - {name: NATIVE_SESSION_V2_TESTNET_CHAIN_ID, value: {{ .Values.config.nativeSessionV2TestnetChainId | quote }}}
            - {name: GIT_SHA, value: {{ .Values.release.sourceRevision | quote }}}
            - {name: USERNODE_DOMAIN, value: {{ .Values.config.domain | quote }}}
            - {name: USERNODE_APPS_DOMAIN, value: {{ default .Values.config.domain .Values.config.appsDomain | quote }}}
            - {name: USERNODE_PLATFORM_REPO, value: {{ .Values.config.platformRepository | quote }}}
            - {name: CLI_CANONICAL_ORIGIN, value: {{ printf "https://%s" .Values.config.domain | quote }}}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.databaseControlPlane.runtimeSecret }}
            - {name: database-targets, mountPath: /etc/sv-database-targets, readOnly: true}
            {{- end }}
            {{- if .Values.databaseControlPlane.bindingsEnabled }}
            - {name: database-policy, mountPath: /etc/sv-database, readOnly: true}
            {{- end }}
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- if .Values.databaseControlPlane.runtimeSecret }}
        - name: database-targets
          secret:
            secretName: {{ .Values.databaseControlPlane.runtimeSecret | quote }}
        {{- end }}
        {{- if .Values.databaseControlPlane.bindingsEnabled }}
        - name: database-policy
          configMap:
            name: {{ .Values.databaseControlPlane.policyConfigMap }}
        {{- end }}
        - {name: tmp, emptyDir: {sizeLimit: 512Mi}}
{{- end }}

{{- if and .Values.enabled .Values.migration.enabled .Values.databaseControlPlane.bindingsEnabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}-migrator-bindings-api
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  endpointSelector:
    matchLabels:
      {{- include "social-vibecoding-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: migration
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{port: '443', protocol: TCP}, {port: '6443', protocol: TCP}]
{{- end }}
