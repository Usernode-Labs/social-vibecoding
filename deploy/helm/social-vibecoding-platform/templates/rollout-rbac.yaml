{{- if and .Values.enabled .Values.platform.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}-rollout-reader
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [{{ include "social-vibecoding-platform.fullname" . | quote }}]
    verbs: [get]
  # A platform process reads its OWN Pod when it boots, for what ended the
  # process before it in that Pod: the reason (OOMKilled, Error), exit code
  # and memory limit behind a crash (src/services/platform-release.js
  # recordPodExit). Pod names change with every rollout, so the rule cannot
  # name them; it is get only (no list, no watch), in this namespace only.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}-rollout-reader
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: social-platform-runtime
    namespace: {{ .Release.Namespace }}
  {{- with .Values.platform.web.serviceAccountName }}
  # The web Pods' own account (platform.web): they read their Deployment and
  # Pod too.
  - kind: ServiceAccount
    name: {{ . }}
    namespace: {{ $.Release.Namespace }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "social-vibecoding-platform.fullname" . }}-rollout-reader
{{- end }}
