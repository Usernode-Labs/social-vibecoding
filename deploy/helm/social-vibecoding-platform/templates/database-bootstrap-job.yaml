{{- if and .Values.enabled .Values.databaseRoles.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}-database-bootstrap
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-bootstrap
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-2"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "social-vibecoding-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database-bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "social-vibecoding-platform.fullname" . }}-migrator
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: database-bootstrap
          image: {{ include "social-vibecoding-platform.image" .Values.platform.image | quote }}
          imagePullPolicy: {{ .Values.platform.image.pullPolicy }}
          command: ["node", "scripts/bootstrap-database-roles.js"]
          securityContext:
            {{- include "social-vibecoding-platform.containerSecurityContext" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "social-vibecoding-platform.databaseBootstrapSecret" . }}
          env:
            {{- include "social-vibecoding-platform.databaseRoleEnv" . | nindent 12 }}
            - {name: DATABASE_NAME, value: {{ .Values.postgresql.applicationDatabase | quote }}}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 512Mi}}
{{- end }}
