{{- include "social-vibecoding-platform.validate" . }}
{{- if and .Values.enabled .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
type: Opaque
stringData:
  {{- if .Values.databaseRoles.enabled }}
  DATABASE_URL: {{ include "social-vibecoding-platform.databaseRoleUrl" (dict "root" . "role" "web" "database" .Values.postgresql.applicationDatabase) | quote }}
  # Clear existing keys as well as masking them on the web Pod.
  DB_ADMIN_URL: ""
  STAGING_DB_ADMIN_URL: ""
  POSTGRES_PASSWORD: ""
  DATABASE_BOOTSTRAP_URL: ""
  STAGING_DATABASE_BOOTSTRAP_URL: ""
  {{- if .Values.previewPostgresql.enabled }}
  STAGING_DB_READ_URL: {{ include "social-vibecoding-platform.databaseRoleUrl" (dict "root" . "role" "web" "database" .Values.previewPostgresql.database "preview" true) | quote }}
  {{- else }}
  STAGING_DB_READ_URL: ""
  {{- end }}
  {{- else }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:%d/%s" .Values.postgresql.username .Values.secrets.databasePassword (include "social-vibecoding-platform.postgresqlHost" .) (int .Values.postgresql.port) .Values.postgresql.applicationDatabase | quote }}
  DB_ADMIN_URL: {{ printf "postgres://%s:%s@%s:%d/%s" .Values.postgresql.username .Values.secrets.databasePassword (include "social-vibecoding-platform.postgresqlHost" .) (int .Values.postgresql.port) .Values.postgresql.database | quote }}
  {{- if .Values.previewPostgresql.enabled }}
  STAGING_DB_ADMIN_URL: {{ printf "postgres://%s:%s@%s:%d/%s" .Values.previewPostgresql.username .Values.secrets.previewDatabasePassword .Values.previewPostgresql.host (int .Values.previewPostgresql.port) .Values.previewPostgresql.database | quote }}
  {{- end }}
  POSTGRES_PASSWORD: {{ .Values.secrets.databasePassword | quote }}
  {{- end }}
  ADMIN_USERNAME: {{ .Values.secrets.adminUsername | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  DATA_ENCRYPTION_KEY: {{ .Values.secrets.dataEncryptionKey | quote }}
  JWT_SECRET: {{ .Values.secrets.dataEncryptionKey | quote }}
  IFRAME_JWT_PRIVATE_KEY: {{ .Values.secrets.iframeJwtPrivateKey | quote }}
  IFRAME_JWT_PUBLIC_KEY: {{ .Values.secrets.iframeJwtPublicKey | quote }}
  WORKER_JWT_SECRET: {{ .Values.secrets.workerJwtSecret | quote }}
  EDGE_JWT_SECRET: {{ .Values.secrets.edgeJwtSecret | quote }}
  TOPOCHAIN_PARTNER_API_KEY: {{ .Values.secrets.topochainPartnerApiKey | quote }}
  GITHUB_APP_ID: {{ .Values.secrets.githubAppId | quote }}
  {{- if include "social-vibecoding-platform.conductorSecret" . }}
  # Explicitly clear old shared values; omitting a key leaves it in a live Secret.
  GITHUB_PRIVATE_KEY: ""
  GIT_HOST_TOKEN: ""
  {{- else }}
  GITHUB_PRIVATE_KEY: {{ .Values.secrets.githubPrivateKey | quote }}
  GIT_HOST_TOKEN: {{ .Values.secrets.gitHostToken | default "" | quote }}
  {{- end }}
  GIT_HOST_READ_TOKEN: {{ .Values.secrets.gitHostReadToken | default "" | quote }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.secrets.githubWebhookSecret | quote }}
  ALERTMANAGER_WEBHOOK_TOKEN: {{ .Values.secrets.alertmanagerWebhookToken | default "" | quote }}
  GITHUB_LINK_CLIENT_ID: {{ .Values.secrets.githubLinkClientId | quote }}
  GITHUB_LINK_CLIENT_SECRET: {{ .Values.secrets.githubLinkClientSecret | quote }}
  X_LINK_CLIENT_ID: {{ .Values.secrets.xLinkClientId | quote }}
  X_LINK_CLIENT_SECRET: {{ .Values.secrets.xLinkClientSecret | quote }}
  WAITLIST_GITHUB_CLIENT_ID: {{ .Values.secrets.waitlistGithubClientId | quote }}
  WAITLIST_GITHUB_CLIENT_SECRET: {{ .Values.secrets.waitlistGithubClientSecret | quote }}
  WAITLIST_X_CLIENT_ID: {{ .Values.secrets.waitlistXClientId | quote }}
  WAITLIST_X_CLIENT_SECRET: {{ .Values.secrets.waitlistXClientSecret | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  ANTHROPIC_ADMIN_KEY: {{ .Values.secrets.anthropicAdminKey | quote }}
  {{- if include "social-vibecoding-platform.conductorSecret" . }}
  # The conductor's own Secret holds it (below). Said empty here, never left
  # out: a key dropped from stringData stays in the live Secret's data, so a
  # value written before would still reach every Pod. The conductor imports
  # its own Secret after this one, and the later import wins.
  OPENROUTER_MANAGEMENT_API_KEY: ""
  {{- else }}
  OPENROUTER_MANAGEMENT_API_KEY: {{ .Values.secrets.openrouterManagementApiKey | quote }}
  {{- end }}
  GMAIL_OAUTH_CLIENT_ID: {{ .Values.secrets.gmailOauthClientId | quote }}
  GMAIL_OAUTH_CLIENT_SECRET: {{ .Values.secrets.gmailOauthClientSecret | quote }}
  GMAIL_OAUTH_REFRESH_TOKEN: {{ .Values.secrets.gmailOauthRefreshToken | quote }}
  PLATFORM_MAIL_TRACKING_SECRET: {{ .Values.secrets.platformMailTrackingSecret | quote }}
  MEDIA_STORAGE_ACCESS_KEY: {{ .Values.secrets.mediaStorageAccessKey | quote }}
  MEDIA_STORAGE_SECRET_KEY: {{ .Values.secrets.mediaStorageSecretKey | quote }}
  MOBILE_PUSH_ENABLED: {{ .Values.secrets.mobilePushEnabled | quote }}
  PUSH_ENV: {{ .Values.secrets.pushEnv | quote }}
  FIREBASE_PROJECT_ID: {{ .Values.secrets.firebaseProjectId | quote }}
  FIREBASE_SERVICE_ACCOUNT_JSON_B64: {{ .Values.secrets.firebaseServiceAccountJsonB64 | quote }}
  FIREBASE_WEB_API_KEY: {{ .Values.secrets.firebaseWebApiKey | quote }}
  BREVO_API_KEY: {{ .Values.secrets.brevoApiKey | quote }}
  BREVO_SMS_SENDER_IDS: {{ .Values.secrets.brevoSmsSenderIds | quote }}
  TWILIO_ACCOUNT_SID: {{ .Values.secrets.twilioAccountSid | quote }}
  TWILIO_AUTH_TOKEN: {{ .Values.secrets.twilioAuthToken | quote }}
  TWILIO_SMS_SENDER_IDS: {{ .Values.secrets.twilioSmsSenderIds | quote }}
  TWILIO_STATUS_CALLBACK_URL: {{ .Values.secrets.twilioStatusCallbackUrl | quote }}
{{- end }}
{{- if include "social-vibecoding-platform.conductorSecret" . }}
---
# What only the conductor may hold: the web Pods serve requests and ask the
# conductor for what needs these (docs/plans/web-and-conductor.md), so they
# never import this Secret (templates/platform.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}-conductor
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
type: Opaque
stringData:
  {{- if .Values.databaseRoles.enabled }}
  DATABASE_URL: {{ include "social-vibecoding-platform.databaseRoleUrl" (dict "root" . "role" "conductor" "database" .Values.postgresql.applicationDatabase) | quote }}
  DB_ADMIN_URL: {{ include "social-vibecoding-platform.databaseRoleUrl" (dict "root" . "role" "provisioner" "database" .Values.postgresql.database) | quote }}
  {{- if .Values.previewPostgresql.enabled }}
  STAGING_DB_ADMIN_URL: {{ include "social-vibecoding-platform.databaseRoleUrl" (dict "root" . "role" "provisioner" "database" .Values.previewPostgresql.database "preview" true) | quote }}
  {{- else }}
  STAGING_DB_ADMIN_URL: ""
  {{- end }}
  {{- else }}
  # Explicit legacy values also make an operator-requested rollback work:
  # dropping these keys would leave the prior role URLs in a live Secret.
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:%d/%s" .Values.postgresql.username .Values.secrets.databasePassword (include "social-vibecoding-platform.postgresqlHost" .) (int .Values.postgresql.port) .Values.postgresql.applicationDatabase | quote }}
  DB_ADMIN_URL: {{ printf "postgres://%s:%s@%s:%d/%s" .Values.postgresql.username .Values.secrets.databasePassword (include "social-vibecoding-platform.postgresqlHost" .) (int .Values.postgresql.port) .Values.postgresql.database | quote }}
  {{- if .Values.previewPostgresql.enabled }}
  STAGING_DB_ADMIN_URL: {{ printf "postgres://%s:%s@%s:%d/%s" .Values.previewPostgresql.username .Values.secrets.previewDatabasePassword .Values.previewPostgresql.host (int .Values.previewPostgresql.port) .Values.previewPostgresql.database | quote }}
  {{- else }}
  STAGING_DB_ADMIN_URL: ""
  {{- end }}
  {{- end }}
  GITHUB_PRIVATE_KEY: {{ .Values.secrets.githubPrivateKey | quote }}
  GIT_HOST_TOKEN: {{ .Values.secrets.gitHostToken | default "" | quote }}
  # src/services/openrouter-managed-keys.js: every managed key is made,
  # capped, disabled and deleted on the conductor.
  OPENROUTER_MANAGEMENT_API_KEY: {{ .Values.secrets.openrouterManagementApiKey | quote }}
{{- end }}
