enabled: false

nameOverride: ""
fullnameOverride: social-vibecoding

imagePullSecrets: []

# DNS suffix used for cross-namespace Service addresses. Keep this aligned
# with the Kubernetes cluster's configured cluster domain.
clusterDomain: cluster.local

# Populated in values.release.yaml by the image build workflow before the
# immutable OCI chart is packaged. Cluster values must not override it.
release:
  sourceRevision: ""

platform:
  enabled: true
  # Before & after shots are on by default. Set false only as an emergency
  # kill switch; legacy default-root screenshots stay suppressed. This was
  # visualEvidenceV2Enabled before the rename; that key is no longer read.
  shotsEnabled: true
  # How long a platform Pod a release replaced keeps finishing the work it
  # started (turns and what follows them, previews, checks, shots runs,
  # merges) before it hands the rest over and exits. It exits as soon as it
  # holds nothing, so this is a ceiling, not a cost; the Pod's grace period
  # is this plus a minute (docs/plans/draining-releases.md).
  drainMinutes: 40
  # How many replaced Pods may finish work at once, beside the one serving.
  # When releases come faster than work finishes, the oldest hands its work
  # over first rather than keep one Pod per release.
  drainingMax: 2
  replicas: 1
  # The web and conductor split (docs/plans/web-and-conductor.md). On, the
  # Pods above serve people's requests and never lead (PROCESS_ROLE=web), and
  # a Deployment of its own runs the conductor (PROCESS_ROLE=conductor): the
  # leader, its timers, sweeps, merge queue, workflow loops, Homeroom bot and
  # bench lane, on Pods the Service sends no requests to. Off, the Pods above
  # serve and stand for leader, as they always did. Either way round, the
  # Service's selector changes only after the Deployments are healthy (its
  # Argo CD sync wave), so the release that flips it keeps serving.
  conductor:
    enabled: true
    # More than one is a standby: it waits for the leader lock.
    replicas: 1
    # Empty: the platform's resources above.
    resources: {}
  image:
    repository: ghcr.io/replace-me/social-vibecoding-platform
    digest: ""
    pullPolicy: IfNotPresent
  workerImage:
    repository: ghcr.io/replace-me/social-vibecoding-worker
    digest: ""
  captureImage:
    repository: ghcr.io/replace-me/social-vibecoding-capture
    digest: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 1Gi
    limits:
      cpu: "4"
      memory: 3Gi
      ephemeral-storage: 4Gi
  # Node's heap ceiling for the platform process. Without it Node stops at
  # about 1.5 GB whatever limits.memory says, and on 2026-09-25 the platform
  # crash-looped on "JavaScript heap out of memory" with half its container
  # unused. Keep it below limits.memory: buffers, code and stacks live outside
  # the heap. An empty value leaves Node's default.
  nodeOptions: "--max-old-space-size=2304"
  tmpSizeLimit: 2Gi

postgresql:
  # Deploy the chart-owned StatefulSet by default. Set enabled=false and host
  # to use an externally managed PostgreSQL cluster such as CloudNativePG.
  enabled: true
  host: ""
  port: 5432
  # Selects external PostgreSQL Pods for platform and migration egress.
  # Leave namespace empty when PostgreSQL runs in the release namespace.
  namespace: ""
  podSelector: {}
  image:
    repository: postgres
    tag: 17-bookworm
    digest: sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
    pullPolicy: IfNotPresent
  database: usernode
  applicationDatabase: app_usernode_2d5619
  username: usernode
  storage:
    size: 50Gi
    storageClassName: openebs-lvm-retain
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi
  sharedMemorySizeLimit: 1Gi

# A second PostgreSQL server that holds preview databases only: the redacted
# staging templates, each preview's copy, and the copies before & after shots
# use. Off by default, and with it off nothing changes. The chart does not
# create the server; docs/kubernetes-operations.md ("A separate server for
# preview databases") lists what the cluster has to provide and how to switch
# it on and off.
#
# The platform reads the server's address and credential from
# STAGING_DB_ADMIN_URL. With secrets.create=true the chart writes it from the
# values below and secrets.previewDatabasePassword; with an existing Secret,
# add that key to it yourself. Either way `enabled` is the switch: while it
# is false the chart sets STAGING_DB_ADMIN_URL to an empty value on the
# platform, which overrides a key left in the Secret.
previewPostgresql:
  enabled: false
  # First step of switching back: new preview databases are made on the main
  # server again while the ones already on this server are still cleaned up.
  # Set enabled=false once those previews have expired.
  drain: false
  host: ""
  port: 5432
  # Selects the server's Pods for the platform's egress. Leave namespace
  # empty when it runs in the release namespace.
  namespace: ""
  podSelector: {}
  # The database administrative statements connect to; it must exist.
  database: postgres
  username: ""

migration:
  enabled: true
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
      ephemeral-storage: 2Gi

config:
  # Prefer the external CNPG primary's zone for previews, production apps and
  # the platform's own Pods (web and conductor), with normal scheduler
  # fallback. Uses postgresql.namespace and podSelector["cnpg.io/cluster"].
  # No effect for bundled PostgreSQL or external databases without that label.
  previewFollowDatabasePrimary: true
  # Canonical platform host for the UI, authentication, and platform API.
  domain: social-vibecoding.example.invalid
  # Empty retains the historical <slug>.<domain> layout.
  appsDomain: ""
  # The app-host gate (scripts/app-gate.js): "on" routes every app and preview
  # Ingress through a platform-owned check (members-only private apps, and
  # signing people in at an app's own address); "off" routes them straight to
  # their own Services. Before "on", the app namespace's policy (foundation)
  # must allow pods labelled app.kubernetes.io/name=usernode-app-gate to reach
  # app pods on 3000 and the platform Service, and allow ingress-controller
  # traffic to the gate. "off" again, plus an Argo sync, is the fallback.
  appGate: "off"
  # "off" stops signing people in at an app's own address (no hop to the
  # platform for a sign-in, no identity added to app requests); the gate
  # itself, and members-only private apps, are unaffected.
  appHostSignin: "on"
  # Optional waitlist OAuth callback origin. Empty uses the application's canonical origin.
  waitlistOauthOrigin: ""
  # Firebase phone authentication flag; enable in the cluster's plaintext values.
  firebasePhoneAuthEnabled: false
  platformRepository: https://github.com/replace-me/social-vibecoding
  nodeRpcUrl: http://replace-me.invalid:3000
  # Explorer host[:port] without a scheme. Public hosts use HTTPS; private
  # numeric addresses use HTTP, matching the platform's existing proxy logic.
  explorerUpstream: testnet-explorer.usernodelabs.org
  explorerUpstreamBase: /api
  explorerUseHttp: false
  # Canonical Rust ChainId for the current testnet. Override this only when
  # deploying a different genesis; the application validates the exact value.
  nativeSessionV2TestnetChainId: "utc1rq8tql3wr5w8u6nvkwepu7dazq89kv2838xwf02xmg2w5vzgly3s6xf63v"
  internalUrl: http://social-vibecoding.social-platform.svc.cluster.local:3000
  logLevel: INFO
  workerMemory: 2g
  # A worker on the platform's own repository (its agent boots the whole
  # platform and a browser): 2g OOM-killed most of its bot builds that died.
  workerMemoryPlatformRepo: 4g
  # Platform signals (src/services/platform-signals.js): every problem the
  # platform detects in itself becomes one request on Homeroom's board.
  # `mode`: shadow keeps the rows the topic pages and figures read and files
  # nothing; file files the requests; off does nothing. `kinds`: a comma list
  # of the kinds allowed to file (empty: every kind), so a noisy one can go
  # back to shadow alone. `bot`: "off" leaves every request to people.
  platformSignals:
    mode: shadow
    kinds: ""
    bot: "on"
  workerCpus: "2"
  captureMemory: 6g
  captureCpus: "8"
  # Proposal checks runs with Jobs on the cluster at once (a capture Job and a
  # unit-suite Job each); further runs wait for a slot after their preview is
  # built. Main-watch's run of main has one slot besides these. 0 turns the
  # queue off. See the chart README.
  checksMaxConcurrentRuns: 4
  # A dedicated node pool for check Jobs, as the pool nodes' label key=value
  # (for example "usernodelabs.org/node-pool=cpu-heavy"). Checks tolerate a
  # NoSchedule taint with the same pair and prefer those nodes, falling back
  # to the others when the pool is full or down. Empty keeps the default
  # spread over every node. See the chart README.
  checkNodePool: ""
  # Match application defaults here; each cluster declares its own capacity.
  dbPoolMax: 10
  maxGlobalSessions: 25
  maxUserSessions: 3
  maxUserPromotedSessions: 5
  maxAdminUserSessions: 5
  maxAdminUserPromotedSessions: 8
  workerIdleEvictionMs: 600000
  sessionAutopauseIdleMs: 300000
  stagingIdleTeardownMs: 21600000

secrets:
  create: false
  existingSecret: social-vibecoding
  databasePassword: ""
  # The preview database server's credential (previewPostgresql above).
  previewDatabasePassword: ""
  adminUsername: ""
  adminPassword: ""
  sessionSecret: ""
  dataEncryptionKey: ""
  iframeJwtPrivateKey: ""
  iframeJwtPublicKey: ""
  workerJwtSecret: ""
  # Alertmanager's bearer token for /api/internal/alerts. Empty turns the
  # route off (503). The same value goes in the infra repo's receiver.
  alertmanagerWebhookToken: ""
  edgeJwtSecret: ""
  topochainPartnerApiKey: ""
  githubAppId: ""
  githubPrivateKey: ""
  githubBotToken: ""
  # Optional signed pull_request webhook; supply through encrypted external values.
  githubWebhookSecret: ""
  # Optional GitHub account-linking OAuth credentials. Set both in encrypted external values.
  githubLinkClientId: ""
  githubLinkClientSecret: ""
  # Optional X account-linking OAuth credentials. Set both in encrypted external values.
  xLinkClientId: ""
  xLinkClientSecret: ""
  # Optional waitlist OAuth credentials. Set each pair in encrypted external values.
  waitlistGithubClientId: ""
  waitlistGithubClientSecret: ""
  waitlistXClientId: ""
  waitlistXClientSecret: ""
  anthropicApiKey: ""
  anthropicAdminKey: ""
  # Optional OpenRouter management credential, supplied through encrypted external values.
  openrouterManagementApiKey: ""
  # Optional Gmail sender credentials. Set all three in encrypted external values.
  gmailOauthClientId: ""
  gmailOauthClientSecret: ""
  gmailOauthRefreshToken: ""
  # Optional engagement tracking with the existing sender. Supply through SOPS.
  platformMailTrackingSecret: ""
  # Optional mobile push settings. Supply all four through encrypted external values.
  mobilePushEnabled: false
  pushEnv: ""
  firebaseProjectId: ""
  firebaseServiceAccountJsonB64: ""
  # Optional Firebase web API key, supplied through encrypted external values.
  firebaseWebApiKey: ""

ingress:
  enabled: true
  className: cilium
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-public
    ingress.cilium.io/loadbalancer-mode: shared
  tls:
    enabled: true
    secretName: social-vibecoding-tls

networkPolicy:
  enabled: true
  ciliumApiServerEgress: true
  # Must match APP_NAMESPACE in the foundation's social-build-policy ConfigMap.
  appNamespace: social-apps
  # Optional cross-namespace access to the selected UserNode HTTP endpoint.
  # Keep the Pod selector specific so the platform cannot reach every workload
  # in the network namespace merely because it needs one node's /status API.
  nodeRpc:
    enabled: false
    namespace: ""
    port: 3000
    podSelector: {}
  explorer:
    enabled: false
    namespace: ""
    port: 3080
    podSelector: {}
  # Generated apps and workers call authenticated internal platform APIs.
  internalCallerNamespaces:
    - social-apps
    - social-workers
    # Alertmanager's `homeroom` receiver posts infra alerts to
    # /api/internal/alerts (src/routes/alerts-webhook.js), which checks its
    # token.
    - monitoring
  # Generated applications connect directly to their dedicated PostgreSQL
  # databases using per-database roles. Workers do not require database access.
  databaseCallerNamespaces:
    - social-apps

podDisruptionBudget:
  enabled: true
