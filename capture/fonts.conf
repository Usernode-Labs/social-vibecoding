<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The capture image's type (capture/Dockerfile). The platform's text is set
  in the reader's own system face: SF Pro on an iPhone, Roboto on Android,
  Segoe on Windows. None of them exists in this Debian image, so Chromium's
  `system-ui` and `sans-serif` resolved to Liberation Sans or DejaVu Sans,
  and every before/after capture looked like a different product from the
  one people vote on. Inter is the closest open face to those, drawn for
  screens at these sizes, so both generic families prefer it here.
  Liberation stays installed as the fallback for anything Inter lacks, and
  Noto Color Emoji still draws the emoji.
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Inter</family></prefer>
  </alias>
</fontconfig>
