       any stylesheet has loaded. Both live UP HERE, ahead of the theme
       module, because that module rewrites the meta from the resolved theme
       and the critical style has to beat the compiled Tailwind sheet (the LAST
       stylesheet in this head, by a contract documented on its own link). The
       value is a starting point only — a dark-mode viewer's first paint is

  <meta name="theme-color" content="#eaeaea">
  <style>
    /* WHY THIS IS INLINE AND NOT IN app.css. The page ground is a Tailwind
       utility on <body> (`bg-zinc-100 dark:bg-zinc-950`, see
       frontend/scripts/build-shell.mjs), and the stylesheet that defines it
       is the last resource in this head. Everything before it paints against
       the browser's default canvas — WHITE — so every load flashed white
       before settling on #eaeaea, and a dark-mode load flashed white before
       going near-black. The service worker makes that MORE visible rather
       than less: a shell served from cache paints immediately, so the gap
       between "there is a document" and "there is a stylesheet" is where the
       whole first impression happens.
       Set on <html> so it also fills the rubber-band area and any strip the
       body's own box does not cover. Duplicating the two values is the point:
       this rule has to be true with no stylesheet at all. */
    html { background-color: #eaeaea; }
    html.dark { background-color: #0b0b0c; }

  <script>
    // Theme module — Light / Dark / System mode selector.
    // Storage contract:
    //   'light'  → light mode
    //   'dark'   → dark mode
    //   key absent → system (follows OS preference)
    // System removes the key; Light and Dark store the value explicitly.
    //
    // INLINE AND HEAD-BLOCKING ON PURPOSE (#1079 chunk B). This was
    // public/js/theme.js — an external tag here, preceded by a duplicate
    // three-line "no-flash guard" that re-implemented get()+apply() so the
    // stored mode landed on <html> before first paint. Both are this one
    // block now: the module ends by calling apply(), so it IS the no-flash
    // guard, and there is no longer a second copy of the storage contract to
    // drift from the first.
    //
    // It could not move into the React bundle with the rest of chunk B's
    // modules. That bundle is a deferred module: it runs after the document
    // is parsed, which is several frames too late to decide whether the page
    // is dark — the user would watch a light shell repaint dark on every
    // load. `window.Theme` also has to exist before app.js's init reads
    // Theme.get(), and the drawer's theme segments in
    // features/header/header-menu.tsx call Theme.set().
    window.Theme = (function () {
      const KEY = 'theme';
      const _listeners = [];

      function get() {
        try {
          const val = window.localStorage.getItem(KEY);
          if (val === 'light' || val === 'dark') return val;
          return 'system';
        } catch {
          return 'system';
        }
      }

      // The two page grounds, spelled here as well as in
      // frontend/scripts/build-shell.mjs's `bg-zinc-100 dark:bg-zinc-950` on
      // <body>. They are tailwind.config.js's zinc-100 / zinc-950, and the
      // critical <style> below plus the theme-color meta both need them
      // BEFORE any stylesheet has loaded, which is the whole point.
      const GROUND = { light: '#eaeaea', dark: '#0b0b0c' };

      function apply() {
        const mode = get();
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const wantDark = mode === 'dark' || (mode === 'system' && prefersDark);
        if (wantDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        // THE BROWSER CHROME IS PART OF THE PAGE'S BACKGROUND, and it was
        // pinned to the dark ground for everybody. `theme-color` paints the
        // address bar on Android, the status-bar strip and the rubber-band
        // area on iOS, and the window ground a standalone install shows
        // before the document paints — so a light-mode viewer got a black
        // band above a #eaeaea page on every load and every overscroll.
        // Written from the RESOLVED theme rather than left to a
        // `media="(prefers-color-scheme: …)"` pair, because the shell's own
        // Light/Dark override is a class on <html> that no media query can
        // see: a viewer who picks Light on a dark OS has to get the light
        // one. This runs before first paint on load and again on every
        // set() / OS change, so the chrome tracks the page it frames.
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', wantDark ? GROUND.dark : GROUND.light);
      }

      function set(mode) {
        try {
          if (mode === 'light' || mode === 'dark') {
            window.localStorage.setItem(KEY, mode);
          } else {
            window.localStorage.removeItem(KEY);
          }
        } catch {}
        apply();
        _listeners.forEach(function (fn) { try { fn(mode); } catch {} });
      }

      function onChange(fn) {
        _listeners.push(fn);
      }

      // Re-apply when OS preference changes (only meaningful in system mode).
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        if (get() === 'system') {
          apply();
          _listeners.forEach(function (fn) { try { fn('system'); } catch {} });
        }
      });

      // Sync across tabs when another tab writes localStorage.theme.
      window.addEventListener('storage', function (e) {
        if (e.key === KEY) {
          apply();
          _listeners.forEach(function (fn) { try { fn(get()); } catch {} });
        }
      });

      // Apply before first paint. This is the no-flash guard.
      apply();

      return { get, set, apply, onChange };
    }());
  </script>

  <script>
    // Mark the document when running as the top frame of the Usernode
    // Flutter WebView. This used to hide the header title as well — the
    // shell shows the screen name in its own AppBar — but on a device
    // that read as a screen with no title, so the in-page one is drawn
    // there now too (see css/app.css). The class still gates the
    // safe-area and native-performance rules, so it is applied the same
    // way: on <html>, before app.js runs, so nothing flashes — the
    // bridge sets
    // `window.usernode.isNative` synchronously at load time based on
    // the presence of the injected `Usernode` JS channel.
    // `?un-native-webview=1` forces the same class from a plain URL. The
    // real signal is the injected JS channel, which a headless browser can
    // never have — so without this override the native-only presentation
    // (see the "Native iOS performance baseline" block in css/app.css) is
    // unreachable by proposal checks and invisible to before/after
    // screenshots. Mirrors the kit's own `?un-platform=ios` skin override,
    // and is deliberately NOT staging-gated: a pure presentation flag with
    // no writes, so the "before" shot works the moment this ships.
    var forcedNative = false;
    try {
      forcedNative = new URLSearchParams(window.location.search)
        .get('un-native-webview') === '1';
    } catch (e) { /* no URL API / opaque origin — fall through */ }
    if (forcedNative || (window.usernode && window.usernode.isNative)) {
      document.documentElement.classList.add('in-native-webview');
    }
  </script>

  <!-- Tailwind, COMPILED and served by this app (was cdn.tailwindcss.com's
       in-browser JIT plus an inline `tailwind.config` here). The config moved
       verbatim to tailwind.config.js at the repo root. Dockerfile runs
       `npm run build:css` in a disposable builder stage for every image and
       copies only the generated stylesheet into the production runtime. The
       output is ignored locally and never committed.

       POSITION MATTERS — KEEP THIS LINK LAST, after native.css and app.css.
       The Play CDN did NOT inject its <style> up where its <script> tag sat:
       it compiled asynchronously (it awaits PostCSS) and then ran
       `document.head.append(...)`, so the generated stylesheet always landed
       at the END of <head>, i.e. after both of those links. Utilities
       therefore won every equal-specificity conflict against them, and
       app.css was written against exactly that cascade. Linking the compiled
       file first inverted it and silently broke every such collision —
       `.attr-chip { font: inherit; background: none }` in app.css, for one,
       started beating `text-[0.65rem] font-medium bg-zinc-500/10` and blew up
       the "Set priority" / "Set category" / "Unassigned" chips on the dev
       screen (#938 fallout). tests/tailwind-build.test.js asserts this
       ordering so it cannot regress again. -->
  <link rel="stylesheet" href="/css/tailwind.css">
  <script>
    // Cascade self-check. The source-order contract above is asserted at build
    // time by tests/tailwind-build.test.js, but that only sees THIS file — it
    // cannot see a stale service-worker precache, a proxy that reorders, or a
    // deploy that ships a half-built stylesheet. So verify the outcome in the
    // browser: probe the exact trio that regressed (an app.css `.attr-chip`
    // shorthand vs. the utilities it collides with) and report if a utility
    // lost. The only cost on a healthy load is one detached span.
    //
    // console.error is the point, not a side effect: the dev console forwards
    // it, and the platform's proposal checks fail any route that logs one — so
    // a reordered stylesheet blocks the merge instead of shipping a screen of
    // 16px unstyled chips.
    // Runs on DOMContentLoaded, not inline: a probe appended while <body> is
    // still unparsed has no layout box, and getComputedStyle returns empty
    // strings for it.
    document.addEventListener('DOMContentLoaded', function () {
      try {
        var probe = document.createElement('span');
        probe.className = 'attr-chip text-[0.65rem] font-medium bg-zinc-500/10';
        probe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none';
        document.body.appendChild(probe);
        // Read everything BEFORE detaching — getComputedStyle is live, and a
        // removed element resolves back to empty strings.
        var s = getComputedStyle(probe);
        var fontSize = s.fontSize;
        var size = parseFloat(fontSize);
        var weight = s.fontWeight;
        var bg = s.backgroundColor;
        probe.remove();
        var tinted = bg && !/^(transparent|rgba\(0, 0, 0, 0\))$/.test(bg);
        if (!(size > 0 && size < 12) || weight !== '500' || !tinted) {
          console.error(
            '[tailwind] compiled utilities are losing the cascade to app.css — '
            + '/css/tailwind.css must be the LAST stylesheet in <head>. Probe got '
            + 'font-size:' + fontSize + ' font-weight:' + weight
            + ' background:' + bg + ' (expected ~10.4px / 500 / a tint).');
        }
      } catch (e) { /* never let a self-check break the shell */ }
    });
  </script>
