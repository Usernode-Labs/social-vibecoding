
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- THE PLATFORM'S NAME, not "dApps". This is the title the SERVICE WORKER
       serves: public/index.html is precached, so a cached load shows it in the
       tab, the task switcher and the native AppBar until the SPA routes and
       calls App.setHeaderTitle('Social Vibecoding'). "dApps" is the name this
       shell had before the platform had one, and every other surface —
       manifest.webmanifest, the header on home, the landing page — says
       Social Vibecoding. A cached document that names the product something
       nothing else calls it is the discontinuity, not just the delay. -->
  <title>Social Vibecoding</title>
  <!-- The browser-chrome colour, and the ground the shell paints on before
       any stylesheet has loaded. Both live UP HERE, ahead of the theme
       module, because that module rewrites the meta from the resolved theme
       and the critical style has to beat the compiled Tailwind sheet (the LAST
       stylesheet in this head, by a contract documented on its own link). The
       value is a starting point only — a dark-mode viewer's first paint is
       corrected by Theme.apply() below, in the same head-blocking pass that
       adds `.dark`, so nothing flashes either way. -->
  <meta name="theme-color" content="#f4f2e4">
  <style>
    /* WHY THIS IS INLINE AND NOT IN app.css. The page ground is a Tailwind
       utility on <body> (`bg-zinc-100 dark:bg-zinc-950`, see
       frontend/scripts/build-shell.mjs), and the stylesheet that defines it
       is the last resource in this head. Everything before it paints against
       the browser's default canvas — WHITE — so every load flashed white
       before settling on #eaeaea, and a dark-mode load flashed white before
       going near-black. The service worker makes that MORE visible rather
       than less: a shell served from cache paints immediately, so the gap
       between "there is a document" and "there is a stylesheet" is where the
       whole first impression happens.
       Set on <html> so it also fills the rubber-band area and any strip the
       body's own box does not cover. Duplicating the two values is the point:
       this rule has to be true with no stylesheet at all.

       `color-scheme` rides along because a background alone does not settle
       what the USER AGENT paints. It is what tells the engine which of its
       own two palettes to use, and it reaches three surfaces no declaration
       of ours can: the canvas underneath the document (the strip a WebView
       shows between navigation start and the first painted frame — the white
       flash the Usernode Flutter shell shows on cold launch), the scrollbars,
       and the default rendering of form controls, which without it stay
       light-on-light inside a near-black shell.

       CLASS-KEYED, NOT `light dark`. The bare two-value form delegates the
       choice to the OS, and the shell's Light/Dark override is a class on
       <html> that no OS preference can see — so a viewer who picks Light on
       a dark phone would get dark scrollbars and dark <select> menus on a
       #eaeaea page. Keyed off `.dark` it tracks the resolved theme instead,
       and Theme.apply() below adds that class in the same head-blocking pass
       that fixes the background. */
    html { background-color: #f4f2e4; color-scheme: light; }
    html.dark { background-color: #0b0d1b; color-scheme: dark; }
  </style>
  <script>
    // Theme module — Light / Dark / System mode selector.
    // Storage contract:
    //   'light'  → light mode
    //   'dark'   → dark mode
    //   key absent → system (follows OS preference)
    // System removes the key; Light and Dark store the value explicitly.
    //
    // INLINE AND HEAD-BLOCKING ON PURPOSE (#1079 chunk B). This was
    // public/js/theme.js — an external tag here, preceded by a duplicate
    // three-line "no-flash guard" that re-implemented get()+apply() so the
    // stored mode landed on <html> before first paint. Both are this one
    // block now: the module ends by calling apply(), so it IS the no-flash
    // guard, and there is no longer a second copy of the storage contract to
    // drift from the first.
    //
    // It could not move into the React bundle with the rest of chunk B's
    // modules. That bundle is a deferred module: it runs after the document
    // is parsed, which is several frames too late to decide whether the page
    // is dark — the user would watch a light shell repaint dark on every
    // load. `window.Theme` also has to exist before app.js's init reads
    // Theme.get(), and the drawer's theme segments in
    // features/header/header-menu.tsx call Theme.set().
    window.Theme = (function () {
      const KEY = 'theme';
      const _listeners = [];

      // Screenshot-state deep link `?shot=dark` / `?shot=light`: pins the
      // mode for THIS LOAD only, nothing stored. The capture runner and the
      // dapp.json checks reach the page by URL with a fresh profile and no
      // way to press the drawer's theme segment, so without this every
      // screenshot of a dark-mode change shows the light shell. Read here
      // rather than in apply() so the drawer's segments agree with the page.
      let shot = null;
      try { shot = new URLSearchParams(window.location.search).get('shot'); } catch {}
      const PINNED = (shot === 'dark' || shot === 'light') ? shot : null;

      function get() {
        if (PINNED) return PINNED;
        try {
          const val = window.localStorage.getItem(KEY);
          if (val === 'light' || val === 'dark') return val;
          return 'system';
        } catch {
          return 'system';
        }
      }

      // The two page grounds: THE WALLPAPER'S CREAM, and that cream
      // inverted — the homescreen design's page and its dark derivation,
      // which app.css paints (with its washes and star, re-tuned for dark)
      // on the launcher, the app view and their peer screens; messages and
      // the admin console keep the body's zinc-100 / zinc-950 on top of it.
      // The critical <style> above and the theme-color meta both need these
      // BEFORE any stylesheet has loaded, which is the whole point.
      // public/manifest.webmanifest carries the light one too, for the
      // standalone install's splash.
      const GROUND = { light: '#f4f2e4', dark: '#0b0d1b' };

      function apply() {
        const mode = get();
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const wantDark = mode === 'dark' || (mode === 'system' && prefersDark);
        if (wantDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        // THE BROWSER CHROME IS PART OF THE PAGE'S BACKGROUND, and it was
        // pinned to the dark ground for everybody. `theme-color` paints the
        // address bar on Android, the status-bar strip and the rubber-band
        // area on iOS, and the window ground a standalone install shows
        // before the document paints — so a light-mode viewer got a black
        // band above a #eaeaea page on every load and every overscroll.
        // Written from the RESOLVED theme rather than left to a
        // `media="(prefers-color-scheme: …)"` pair, because the shell's own
        // Light/Dark override is a class on <html> that no media query can
        // see: a viewer who picks Light on a dark OS has to get the light
        // one. This runs before first paint on load and again on every
        // set() / OS change, so the chrome tracks the page it frames.
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', wantDark ? GROUND.dark : GROUND.light);
      }

      function set(mode) {
        try {
          if (mode === 'light' || mode === 'dark') {
            window.localStorage.setItem(KEY, mode);
          } else {
            window.localStorage.removeItem(KEY);
          }
        } catch {}
        apply();
        _listeners.forEach(function (fn) { try { fn(mode); } catch {} });
      }

      function onChange(fn) {
        _listeners.push(fn);
      }

      // Re-apply when OS preference changes (only meaningful in system mode).
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        if (get() === 'system') {
          apply();
          _listeners.forEach(function (fn) { try { fn('system'); } catch {} });
        }
      });

      // Sync across tabs when another tab writes localStorage.theme.
      window.addEventListener('storage', function (e) {
        if (e.key === KEY) {
          apply();
          _listeners.forEach(function (fn) { try { fn(get()); } catch {} });
        }
      });

      // Apply before first paint. This is the no-flash guard.
      apply();

      return { get, set, apply, onChange };
    }());
  </script>
  <script>
    // ── The boot watchdog: the floor under everything else here ──────────
    //
    // When the boot fails, it fails INVISIBLY. Every island is left as the
    // empty markup the prerender shipped, the screen the router reveals has
    // nothing in it, and what a reader gets is a blank page that reports
    // nothing at all. Diagnosing #1670 took four rounds of inference for
    // exactly that reason: the failure could not be observed on the device
    // that had it, only reasoned about from a sandbox that did not.
    //
    // So: capture every error from as early in this document as a script can
    // run, and if the boot has produced NOTHING by the deadline, paint what
    // went wrong. Written as an inline classic script, with no imports, no
    // framework and no stylesheet, because the things it reports on are
    // precisely the bundle, the framework and the stylesheet. It has to work
    // when they did not.
    //
    // `window.__unBoot.errors` is the shared record; frontend/src/lib/
    // boot-guard.ts pushes into the same list from inside the bundle, so one
    // list holds a failed classic script, a failed boot step and a rejected
    // promise alike.
    (function () {
      'use strict';
      var W = (window.__unBoot = window.__unBoot || { errors: [], steps: [] });
      if (!Array.isArray(W.errors)) W.errors = [];
      if (!Array.isArray(W.steps)) W.steps = [];
      function push(step, message, stack) {
        try {
          W.errors.push({ step: step, message: String(message || ''), stack: stack || '' });
        } catch (e) { /* a full or frozen array is not worth a throw */ }
      }
      window.addEventListener('error', function (e) {
        push('error', (e && e.message) || 'script error', e && e.error && e.error.stack);
      });
      // A script or stylesheet that FAILED TO LOAD fires `error` on its own
      // element and it does not bubble, so the listener above never hears
      // it. That is the one failure that leaves the boot record empty while
      // the boot produced nothing: the module the whole shell hangs off was
      // never fetched, and nothing threw because nothing ran. Capture phase
      // sees it. A thrown error has `window` as its target and is already
      // recorded above.
      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (!t || t === window || !t.tagName) return;
        var url = '';
        try { url = String(t.src || t.href || '').split('?')[0].split('#')[0]; } catch (x) { url = ''; }
        push('resource', String(t.tagName).toLowerCase() + ' failed to load: ' + (url || '(no url)'));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        push('unhandledrejection', (r && r.message) || String(r), r && r.stack);
      });

      // `?shot=boot-failed` forces the panel so the dapp.json check and the
      // before/after screenshots can reach a state that otherwise only exists
      // when the shell is broken. Every OTHER ?shot= / ?demo= route opts out
      // entirely: those render one state deterministically for a capture or a
      // declared check, and a panel arriving mid-assertion is the
      // nondeterminism they exist to be free of. Same guard, and the same
      // reason, as prefetchSettings() and AdminConsole.prefetchSections().
      var forced = false;
      var optedOut = false;
      try {
        var q = new URLSearchParams(window.location.search);
        forced = q.get('shot') === 'boot-failed';
        optedOut = !forced && (!!q.get('shot') || !!q.get('demo'));
      } catch (e) { /* no URL API: watch anyway, it is the failing case */ }
      if (optedOut) return;

      // Generous on purpose. The slowest boot this repo has measured (4x CPU,
      // 150ms link, cold worker) put its first card up ~2.4s in, so this sits
      // well past any load that is merely slow. The panel is for a boot that
      // is not coming.
      var DEADLINE_MS = 8000;
      // One extra window, and only when the parser is demonstrably still
      // working. Keeps a slow load from being accused without letting a
      // document that never finishes parsing escape judgement forever.
      var GRACE_MS = 6000;
      // A SCREEN TRANSITION IS A BOOT TOO. Login is in place (auth-screens.js
      // finishLogin hands over to App.enterAuthed in the same document), so
      // the blank that follows a login arrives whenever the login does: 3s
      // in with a password manager, 30s in typed by hand. One judgement at
      // 8s sees the first and misses the second. So after each transition
      // signal the page publishes (sv:session and sv:authed from app.js, the
      // fragment changing, the document coming back into view) judge once
      // more, this long after the last of them, and never more than
      // MAX_REJUDGES times in one document. The first blank paints; a page
      // that keeps producing content is never accused.
      var REJUDGE_MS = 5000;
      var MAX_REJUDGES = 3;
      // A timer that fires long after it was due did not tick: the document
      // was suspended (an app switch, a password-manager sheet, a frozen
      // tab). What it would sample is the page before it has laid out again,
      // which is how a working login got accused on a real device. Re-arm a
      // fresh window instead, once.
      var SUSPEND_SLACK_MS = 4000;

      // ASK THE PIXELS, NOT THE TREE.
      //
      // This used to ask "does any unhidden screen root have a box and text",
      // which is not the same question as "can the reader see anything" — and
      // the difference is exactly the failure this watchdog exists for.
      // `#auth-landing-screen` is `fixed inset-0 z-40 bg-white` with no
      // children, and a boot that dies reveals it OVER a `#home-screen` that
      // is still unhidden and still carries the text the prerender shipped.
      // The old predicate found that text, concluded the boot had worked, and
      // stayed silent while the reader looked at a white rectangle. Both roots
      // unhidden at once is a state observed in this repo's own harness, not
      // a hypothetical.
      //
      // document.elementFromPoint answers the right question, because it
      // returns what is actually ON TOP at a coordinate. Sample a handful of
      // points; the screen is blank only when EVERY one of them lands on
      // something with no text and no picture.
      //
      // Still conservative in the direction that matters. One sample with
      // content is enough to call the boot working, an unreadable document
      // counts as working, and a throw counts as working — a watchdog that
      // cannot tell must never accuse a page that is fine.
      function hasVisibleContent(el, strict) {
        if (!el || el === document.documentElement || el === document.body) return false;
        // Its own text first: the cheapest yes there is.
        var own = '';
        for (var n = el.firstChild; n; n = n.nextSibling) {
          if (n.nodeType === 3) own += n.nodeValue;
        }
        if (own.trim()) return true;
        var tag = (el.tagName || '').toLowerCase();
        // Real media counts, and so does an iframe: the landing directory's
        // app viewer and #app-view are iframes, and what the reader sees
        // there is the framed document, which this script cannot read and
        // must not accuse.
        if (tag === 'img' || tag === 'svg' || tag === 'canvas' || tag === 'video' || tag === 'iframe') return true;
        // The two rules below are leniency for a LIVE page: a skeleton block,
        // a card whose text sits in a child. A document whose parser is still
        // stuck at the deadline has no live page; all it can show is the
        // static prerender, and a header from that is not a boot. Strict
        // mode stops here.
        if (strict) return false;
        // Text anywhere inside the element that is on top. This is safe HERE
        // and was not in the old predicate, because elementFromPoint has
        // already put this element on top at the sampled point: the failure
        // this file exists for was reading text off a root that something
        // opaque COVERED, and the covering element is what is in hand now.
        var inner = '';
        try { inner = el.innerText || ''; } catch (e) { inner = ''; }
        if (inner.trim()) return true;
        // A painted box smaller than the screen: a skeleton block, a card, a
        // button that has not got its label yet. SIZE is the line, and it is
        // the same line the wallpaper sits on: every screen root, every
        // backdrop and the empty landing overlay fill the viewport, and so
        // does the ground they are painted on. A ground is not content; a
        // thing on the ground is. (DELIBERATELY NOT the background image:
        // the platform's wallpaper is one, painted on the very roots this
        // samples, and measured, it turned every empty overlay into
        // "content". Colour on a sub-viewport box is a different signal.)
        var r = el.getBoundingClientRect();
        if (r.width < 8 || r.height < 8) return false;
        if (r.width >= window.innerWidth * 0.95 && r.height >= window.innerHeight * 0.95) return false;
        var bg = '';
        try { bg = window.getComputedStyle(el).backgroundColor || ''; } catch (e) { bg = ''; }

      }

      // Spread across the viewport rather than clustered: a working shell
      // has its header near the top and content through the middle.
      function samplePoints() {
        var w = window.innerWidth || 0;
        var h = window.innerHeight || 0;
        if (!(w > 0 && h > 0)) return [];
        return [
          [w * 0.5, h * 0.1], [w * 0.5, h * 0.3], [w * 0.5, h * 0.5],
          [w * 0.5, h * 0.7], [w * 0.25, h * 0.4], [w * 0.75, h * 0.4],
        ];
      }

      function bootProducedSomething(strict) {
        try {
          if (typeof document.elementFromPoint !== 'function') return true;
          var pts = samplePoints();
          if (!pts.length) return true;
          for (var i = 0; i < pts.length; i++) {
            var el = document.elementFromPoint(pts[i][0], pts[i][1]);
            if (hasVisibleContent(el, strict)) return true;
          }
          return false;
        } catch (e) { return true; }
      }

      // WHAT THE PAGE LOOKED LIKE, for the panel.
      //
      // "No error was recorded" is where the previous panel stopped, and on a
      // real device that is exactly what it said: JavaScript alive, nothing
      // thrown, six blank points. A blank with no error is a STATE, and the
      // state is readable from here: which roots are shown, what is on top
      // at each sampled point, whether React adopted the document, which
      // boot steps completed, whether a session is held, which interiors
      // were asked for. Every line is its own try/catch and answers "?" on
      // failure, because a watchdog that throws would be the joke of the
      // file. Nothing here prints a token: the fragment is cut at its first
      // segment and query values are never read, only their keys.
      function nameOf(el) {
        if (!el) return 'null';
        var t = (el.tagName || '?').toLowerCase();
        if (el.id) return t + '#' + el.id;
        var c = el.classList && el.classList.length ? el.classList[0] : '';

      }
      function safeRoute() {
        var keys = [];
        try {
          new URLSearchParams(window.location.search).forEach(function (v, k) { keys.push(k); });

      function describeState(trigger) {
        var lines = [];
        function add(label, fn) {

          return trigger + ' at ' + Math.round(window.performance.now()) + 'ms';

          for (var i = 0; i < els.length; i++) {

        add('globals', function () {
          var names = ['App', 'AuthScreens', 'Home', 'Offline', 'NativeChrome', 'UsernodeReact'];
          var have = [];
          var miss = [];
          for (var i = 0; i < names.length; i++) (window[names[i]] ? have : miss).push(names[i]);
          var mount = window.UsernodeReact && window.UsernodeReact.mount;
          (mount && mount.ensure ? have : miss).push('UsernodeReact.mount');

        });
        add('react', function () {
          var keys = Object.keys(document.body || {});
          for (var i = 0; i < keys.length; i++) {
            if (keys[i].indexOf('__reactContainer') === 0) return 'adopted the document';
          }
          return 'has NOT adopted the document';
        });
        add('boot steps', function () {
          var s = W.steps || [];
          if (!s.length) return 'none completed';
          var out = [];
          for (var i = 0; i < s.length; i++) out.push(s[i].step + '@' + s[i].at + 'ms');

          var A = window.App;
          if (!A) return 'no App';

            + ', fromSnapshot=' + !!A._sessionFromSnapshot

          try { void window.localStorage.length; return 'readable'; } catch (e) { return 'throws'; }
        });

          return sw && sw.controller ? 'controlling this page' : 'not controlling this page';
        });

          return new URLSearchParams(window.location.search).get('un-boot-retry') === '1' ? 'spent' : 'unspent';
        });
        add('html class', function () {
          return (document.documentElement.className || '').slice(0, 100) || '-';
        });
        return lines.join('\n');
      }

      function paint(trigger) {
        try {
          if (document.getElementById('boot-watchdog')) return;
          var dark = document.documentElement.classList.contains('dark');
          var panel = document.createElement('div');
          panel.id = 'boot-watchdog';
          panel.setAttribute('role', 'alert');
          panel.style.cssText = 'position:fixed;inset:0;z-index:2147483647;overflow:auto;'
            + 'padding:24px;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;'
            + '-webkit-text-size-adjust:100%;'
            + (dark ? 'background:#0b0d1b;color:#e4e4e7' : 'background:#f4f2e4;color:#18181b');

          var h = document.createElement('div');
          h.textContent = 'This screen did not finish loading';
          h.style.cssText = 'font-size:18px;font-weight:600;margin-bottom:8px';
          panel.appendChild(h);

          var p = document.createElement('div');
          p.textContent = 'The app is still installed and your data is safe. '
            + 'This panel exists so the failure can be read here instead of '
            + 'looking like a blank screen.';
          p.style.cssText = 'margin-bottom:16px;opacity:.8;max-width:52ch';
          panel.appendChild(p);

          var retry = document.createElement('button');
          retry.id = 'boot-watchdog-retry';
          retry.type = 'button';
          retry.textContent = 'Try again';
          retry.style.cssText = 'appearance:none;border:0;border-radius:10px;padding:10px 18px;'
            + 'font:inherit;font-weight:500;cursor:pointer;background:#1f86ff;color:#fff;'
            + 'min-height:44px;margin-bottom:20px';
          retry.addEventListener('click', function () {
            // Drop the one-shot reload marker so a retry is a genuinely fresh
            // attempt rather than one that starts with its budget spent.
            try {
              var u = new URL(window.location.href);
              u.searchParams.delete('un-boot-retry');
              window.location.replace(u.toString());
            } catch (e) { window.location.reload(); }
          });
          panel.appendChild(retry);

          var mono = 'font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;'
            + 'white-space:pre-wrap;word-break:break-word;opacity:.85;'
            // Selectable on purpose: on a phone this text is copied out by
            // long-press, and that is the whole report.
            + '-webkit-user-select:text;user-select:text';

          var errs = (W.errors || []).slice(0, 8);
          var list = document.createElement('div');
          list.id = 'boot-watchdog-errors';
          list.style.cssText = mono;
          if (!errs.length) {
            list.textContent = 'No error was recorded. The boot simply never '
              + 'produced a screen. What the page looked like is below.';
          } else {
            for (var j = 0; j < errs.length; j++) {
              var row = document.createElement('div');
              row.style.cssText = 'margin-bottom:10px';
              // textContent throughout: these strings come from thrown values
              // and are never markup.
              row.textContent = (j + 1) + '. [' + errs[j].step + '] ' + errs[j].message
                + (errs[j].stack ? '\n' + String(errs[j].stack).split('\n').slice(0, 3).join('\n') : '');
              list.appendChild(row);
            }
          }
          panel.appendChild(list);

          var stateLabel = document.createElement('div');
          stateLabel.textContent = 'State when judged';
          stateLabel.style.cssText = 'margin:18px 0 6px;font-weight:600;font-size:13px';
          panel.appendChild(stateLabel);
          var state = document.createElement('div');
          state.id = 'boot-watchdog-state';
          state.style.cssText = mono;
          state.textContent = describeState(trigger || 'deadline');
          panel.appendChild(state);

          (document.body || document.documentElement).appendChild(panel);
        } catch (e) { /* a watchdog that throws would be the joke of the file */ }
      }

      // ARMED HERE, NOT ON DOMContentLoaded.
      //
      // The timer used to start inside a DOMContentLoaded listener, which
      // made a watchdog for a boot that dies depend on the boot reaching a
      // milestone. A synchronous hang in any of the ~47 classic scripts, and
      // the event never fires, and the panel can never paint — silence in
      // precisely the case it was built to break.
      //
      // Starting at script-evaluation time removes that dependency. The one
      // thing it must not do is accuse a document that is merely still
      // arriving, so a deadline reached while the parser is still going buys
      // ONE grace period; after that it judges regardless, because an event
      // that has not come by then may never come.
      var extended = false;
      var done = false;
      var rejudged = 0;
      var suspendRearms = 0;
      var armedAt = 0;
      var armedFor = 0;
      var pendingRejudge = null;

      function armed(ms) {
        armedAt = Date.now();
        armedFor = ms;
      }
      function judgeNow(trigger, strict) {
        if (done) return;
        if (Date.now() - armedAt > armedFor + SUSPEND_SLACK_MS && suspendRearms < 1) {
          // Late by more than any main-thread stall: the document was
          // suspended. Do not sample a page that has not laid out since.
          suspendRearms++;
          armed(REJUDGE_MS);
          setTimeout(function () { judgeNow(trigger, strict); }, REJUDGE_MS);
          return;
        }
        // A hidden document may not lay out at all. The visibilitychange
        // listener below re-arms when it is back.
        if (document.visibilityState === 'hidden') return;
        if (trigger !== 'deadline') {
          if (rejudged >= MAX_REJUDGES) return;
          rejudged++;
        }
        if (!bootProducedSomething(strict)) {
          done = true;
          W.trigger = trigger;
          paint(trigger);
        }
      }
      function judge() {
        if (document.readyState === 'loading' && !extended) {
          extended = true;
          armed(GRACE_MS);
          setTimeout(judge, GRACE_MS);
          return;
        }
        // Past the grace window and STILL parsing: no module has run, no
        // island has rendered, and whatever is on screen is the prerender.
        // Judge it strictly (see hasVisibleContent).
        judgeNow('deadline', document.readyState === 'loading');
      }
      // Debounced: a burst (sv:session, then sv:authed, then the fragment)
      // is one transition and gets one judgement, REJUDGE_MS after the last
      // signal. The initial deadline timer is never cancelled by this.
      function rejudge(trigger) {
        if (done || rejudged >= MAX_REJUDGES) return;
        if (pendingRejudge) clearTimeout(pendingRejudge);
        armed(REJUDGE_MS);
        pendingRejudge = setTimeout(function () {
          pendingRejudge = null;
          judgeNow(trigger);
        }, REJUDGE_MS);
      }

      if (forced) {
        // The probe still waits for a body to paint into.
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () {
            push('probe', 'panel forced by ?shot=boot-failed');
            setTimeout(function () { paint('probe'); }, 0);
          });
        } else {
          push('probe', 'panel forced by ?shot=boot-failed');
          setTimeout(function () { paint('probe'); }, 0);
        }
      } else {
        armed(DEADLINE_MS);
        setTimeout(judge, DEADLINE_MS);
        document.addEventListener('sv:session', function () { rejudge('sv:session'); });
        document.addEventListener('sv:authed', function () { rejudge('sv:authed'); });
        window.addEventListener('hashchange', function () { rejudge('hashchange'); });
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') rejudge('visible');
        });
      }
    }());
  </script>

    // never have — so without this override the native-only presentation
    // (see the "Native iOS performance baseline" block in css/app.css) is
    // unreachable by proposal checks and invisible to before/after
    // screenshots. Mirrors the kit's own `?un-platform=ios` skin override,
    // and is deliberately NOT staging-gated: a pure presentation flag with
    // no writes, so the "before" shot works the moment this ships.
    var forcedNative = false;

  <!-- Tailwind, COMPILED and served by this app (was cdn.tailwindcss.com's
       in-browser JIT plus an inline `tailwind.config` here). The config moved
       verbatim to tailwind.config.js at the repo root. Dockerfile runs
       `npm run build:css` in a disposable builder stage for every image and
       copies only the generated stylesheet into the production runtime. The
       output is ignored locally and never committed.

       POSITION MATTERS — KEEP THIS LINK LAST, after native.css and app.css.
       The Play CDN did NOT inject its <style> up where its <script> tag sat:
       it compiled asynchronously (it awaits PostCSS) and then ran
       `document.head.append(...)`, so the generated stylesheet always landed
       at the END of <head>, i.e. after both of those links. Utilities
       therefore won every equal-specificity conflict against them, and
       app.css was written against exactly that cascade. Linking the compiled
       file first inverted it and silently broke every such collision —
       `.attr-chip { font: inherit; background: none }` in app.css, for one,
       started beating `text-[0.65rem] font-medium bg-zinc-500/10` and blew up
       the "Set priority" / "Set category" / "Unassigned" chips on the dev
       screen (#938 fallout). tests/tailwind-build.test.js asserts this
       ordering so it cannot regress again. -->
  <link rel="stylesheet" href="/css/tailwind.css">
  <script>
    // Cascade self-check. The source-order contract above is asserted at build
    // time by tests/tailwind-build.test.js, but that only sees THIS file — it
    // cannot see a stale service-worker precache, a proxy that reorders, or a
    // deploy that ships a half-built stylesheet. So verify the outcome in the
    // browser: probe the exact trio that regressed (an app.css `.attr-chip`
    // shorthand vs. the utilities it collides with) and report if a utility
    // lost. The only cost on a healthy load is one detached span.
    //
    // console.error is the point, not a side effect: the dev console forwards
    // it, and the platform's proposal checks fail any route that logs one — so
    // a reordered stylesheet blocks the merge instead of shipping a screen of
    // 16px unstyled chips.
    // Runs on DOMContentLoaded, not inline: a probe appended while <body> is
    // still unparsed has no layout box, and getComputedStyle returns empty
    // strings for it.
    document.addEventListener('DOMContentLoaded', function () {
      try {
        var probe = document.createElement('span');
        probe.className = 'attr-chip text-[0.65rem] font-medium bg-zinc-500/10';
        probe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none';
        document.body.appendChild(probe);
        // Read everything BEFORE detaching — getComputedStyle is live, and a
        // removed element resolves back to empty strings.
        var s = getComputedStyle(probe);
        var fontSize = s.fontSize;
        var size = parseFloat(fontSize);
        var weight = s.fontWeight;
        var bg = s.backgroundColor;
        probe.remove();
        var tinted = bg && !/^(transparent|rgba\(0, 0, 0, 0\))$/.test(bg);
        if (!(size > 0 && size < 12) || weight !== '500' || !tinted) {
          console.error(
            '[tailwind] compiled utilities are losing the cascade to app.css — '
            + '/css/tailwind.css must be the LAST stylesheet in <head>. Probe got '
            + 'font-size:' + fontSize + ' font-weight:' + weight
            + ' background:' + bg + ' (expected ~10.4px / 500 / a tint).');
        }
      } catch (e) { /* never let a self-check break the shell */ }
    });
  </script>
