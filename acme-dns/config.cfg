# acme-dns — a tiny purpose-built DNS server that answers ONLY the ACME
# DNS-01 challenge (`_acme-challenge.*`) for our wildcard cert.
#
# Why this exists: issuing `*.social-vibecoding.usernodelabs.org` via DNS-01
# normally means letting Caddy write TXT records into the zone. Our zone is
# Namecheap-hosted `usernodelabs.org` (production), and Namecheap's only DNS
# write API REPLACES the entire host-record set per call — a prod-zone-wipe
# footgun. Instead we delegate just `_acme-challenge.social-vibecoding...`
# (one static CNAME, added by hand once) to this server, so Caddy's DNS-01
# writes land here and NEVER touch the production Namecheap zone.
#
# Public surface is DNS only (:53). The HTTP API (:8081) that Caddy uses to
# register + set TXT values is NOT published to the host — it's reachable
# only on the internal docker network (http://acme-dns:8081).

[general]
listen = "0.0.0.0:53"
protocol = "both"
# This server is authoritative for `acmedns.usernodelabs.org`. The parent
# zone (Namecheap) delegates it via a static NS + glue A record (added once,
# by hand — see deploy notes).
domain = "acmedns.usernodelabs.org"
# Separate nameserver host (ns1.*) so the parent zone delegation uses a
# distinct owner name for the glue A and the NS record (avoids A+NS on the
# same owner, which some DNS UIs reject).
nsname = "ns1.acmedns.usernodelabs.org"
nsadmin = "admin.usernodelabs.org"
# Self-published authoritative records so the delegation resolves. The glue A
# must match the server's public IP.
records = [
    "ns1.acmedns.usernodelabs.org. A 144.76.85.53",
    "acmedns.usernodelabs.org. NS ns1.acmedns.usernodelabs.org.",
]
debug = false

[database]
engine = "sqlite3"
connection = "/var/lib/acme-dns/acme-dns.db"

[api]
ip = "0.0.0.0"
port = "8081"
# Registration stays enabled, but the API is internal-only (not port-mapped),
# so only Caddy on the docker network can reach it.
disable_registration = false
tls = "none"
use_header = false
header_name = "X-Forwarded-For"

[logconfig]
loglevel = "info"
logtype = "stdout"
logformat = "text"
