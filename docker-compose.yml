# Standalone production stack for Usernode Social Vibecoding.
#
# Lives on a dedicated VPS at the domain set in `.env` (USERNODE_DOMAIN).
# Three services: Caddy (TLS + reverse proxy), the platform itself,
# and Postgres for platform data. Child apps are spawned at runtime by
# the platform onto the same Docker network (`usernode-net`), so Caddy
# can reach them by container name without any extra config.
#
# This compose file is consumed by .github/workflows/deploy.yml during
# deploys. For local dev, see README.md.

name: usernode

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Shared with the usernode service so it can write per-app route
      # blocks (myapp.<USERNODE_DOMAIN> { reverse_proxy ... }) and
      # reload Caddy via `docker exec caddy caddy reload`.
      - caddy-runtime:/etc/caddy/runtime
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # Caddyfile uses {$USERNODE_DOMAIN} substitution for the main
      # vhost. Must be set in Caddy's process env at config-load time.
      USERNODE_DOMAIN: ${USERNODE_DOMAIN}
    networks:
      - usernode-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"

  usernode:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    container_name: usernode
    restart: unless-stopped
    networks:
      - usernode-net
    expose:
      - "3000"
    env_file:
      - ./.env
    environment:
      # Tell the platform which Docker network to spawn child apps on
      # so Caddy can reach them, and which file path to write Caddy
      # route blocks into. Both are read by src/services/{docker,
      # caddy,worker}.js. Override DATABASE_URL inline to point at
      # the in-compose Postgres service instead of project-usernode-db.
      # DB_CONTAINER is the name `db-manager.js` `docker exec`'s into
      # to spawn per-app databases — must match the usernode-db
      # service's container_name below.
      DOCKER_NETWORK: usernode-net
      DB_CONTAINER: usernode-db
      USERNODE_CONF_PATH: /etc/caddy/runtime/usernode.conf
      # Where the platform reads ambient host-state from — currently
      # just deploy-status.json, written by the deploy workflow so the
      # /status page can render an in-progress banner. See
      # services/status.js + .github/workflows/deploy.yml.
      USERNODE_RUNTIME_PATH: /var/lib/usernode/runtime
      # Per Phase 2d (SELF-HOSTING.md), the platform's own data
      # lives in `app_usernode_<hex>` instead of the bare `usernode`
      # database. Same `app_<slug>` convention every child app
      # follows, with the hex suffix avoiding a collision with a
      # hypothetical child app slugged `usernode`. The hex is frozen
      # in src/config.js (SELF_APP_DB_NAME) and must match this URL.
      # The bare `usernode` database stays around as the postgres-
      # bookkeeping target db-manager.js issues `CREATE DATABASE`
      # from when it spawns child-app DBs.
      DATABASE_URL: postgres://usernode:${USERNODE_DB_PASSWORD}@usernode-db:5432/app_usernode_2d5619
      NODE_RPC_URL: http://usernode-node:3000
    volumes:
      # Required: the platform spawns child-app containers via the
      # host Docker daemon. Standard Usernode pattern.
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared with Caddy — see comment on caddy service.
      - caddy-runtime:/etc/caddy/runtime
      # Read-only host bind for deploy signals (see deploy workflow).
      # The deploy user on the host writes /opt/usernode/runtime/
      # deploy-status.json; the platform reads it from in-container.
      - /opt/usernode/runtime:/var/lib/usernode/runtime:ro
    depends_on:
      usernode-db:
        condition: service_healthy
      usernode-node:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    security_opt:
      - no-new-privileges:true

  usernode-db:
    image: postgres:17-alpine
    container_name: usernode-db
    restart: unless-stopped
    networks:
      - usernode-net
    volumes:
      - usernode-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: usernode
      POSTGRES_USER: usernode
      POSTGRES_PASSWORD: ${USERNODE_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usernode"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    security_opt:
      - no-new-privileges:true

  usernode-node:
    image: usernodelabs/usernode
    container_name: usernode-node
    restart: unless-stopped
    networks:
      - usernode-net
    environment:
      # Names must match what the `usernode node` clap parser reads:
      # `--genesis-url` / `USERNODE_GENESIS_URL` and `--peer-list-url` /
      # `PEER_LIST_URL` (see crates/cli/src/commands/node.rs in usernode).
      # If these don't match, the binary silently falls back to its
      # built-in defaults (which include a stale baked-in seedlist
      # pointing at long-gone peers), so the node sits in `Connecting`
      # forever and every dapp shows the loading overlay indefinitely.
      # The outer `${GENESIS_URL:-...}` / `${SEEDLIST_URL:-...}` lets an
      # operator override the upstream defaults from the host env / .env.
      USERNODE_GENESIS_URL: ${GENESIS_URL:-https://static.usernodelabs.org/testnet/genesis.json}
      PEER_LIST_URL: ${SEEDLIST_URL:-https://static.usernodelabs.org/testnet/seedlist.txt}
      RUST_LOG: info
    # `--archive --archive-path /archive` makes the sidecar a true
    # full-ledger node (fixes PARTIAL_LEDGER_RECENT_TX_SOURCE_BUG —
    # RecentTxEntry.source goes null for ~half the incoming txs because
    # the partial UTXO tree can't resolve commitments belonging to
    # non-tracked owners). Child apps register their own pubkeys at
    # runtime via `POST /wallet/tracked_owner/add`, which trips the
    # wallet-seed shortcut into partial-ledger overlay mode by default;
    # the archive flag overrides that and keeps the node in full mode.
    #
    # The deploy workflow seeds the `usernode-node-archive` volume with
    # a fresh snapshot from a seed node before bringing the stack up;
    # from then on the node both LOADS that snapshot at boot AND WRITES
    # new ones at the snapshot interval, so subsequent restarts (and
    # even deploys that skip the fetch) recover from whatever's on disk.
    #
    # `--enable-recent-tx-stream` is the CLI form of the older
    # USERNODE_ENABLE_RECENT_TX_STREAM env var; both work, the flag is
    # what dapp-starter uses so we match.
    command:
      - "--work-dir"
      - "/var/lib/usernode"
      - "--archive"
      - "--archive-path"
      - "/archive"
      - "--port"
      - "3000"
      - "--enable-recent-tx-stream"
    volumes:
      - usernode-node-data:/var/lib/usernode
      - usernode-node-archive:/archive
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1"
    security_opt:
      - no-new-privileges:true

networks:
  usernode-net:
    name: usernode-net
    driver: bridge

volumes:
  caddy-runtime:
  caddy-data:
  caddy-config:
  usernode-db-data:
  # Sidecar node working directory (chain-scoped wallet cache, etc.) and
  # archive root (manifest + snapshot binprots + block tail). Both must
  # be persistent — without persistence every restart re-syncs from
  # genesis (~15 min on testnet) and every deploy loses the archive
  # snapshot, dropping the node back to partial-ledger mode for the
  # duration. See the usernode-node service comment.
  usernode-node-data:
  usernode-node-archive:
