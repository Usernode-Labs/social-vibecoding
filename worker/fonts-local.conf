<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  #4087: the shots browser's system font. The shell's text is Tailwind's
  font-sans stack (ui-sans-serif, system-ui, sans-serif, then emoji fonts),
  which on a Mac lands on San Francisco with real weights 400-800. Bookworm
  slim has no such face, so headings, labels and buttons came out regular in
  another typeface. Inter (fonts-inter) ships every static weight; this file
  makes every system-UI family name and the generic sans-serif resolve to it,
  ahead of the fonts Playwright installs with Chromium's apt deps.
  Installed as /etc/fonts/local.conf by worker/Dockerfile.
-->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>-apple-system</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>ui-sans-serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
  </match>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
</fontconfig>
