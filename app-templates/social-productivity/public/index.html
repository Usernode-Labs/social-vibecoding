<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- usernode-dev-console -->
  <title>Social productivity</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a6ee0'/><path d='M28 34h44M28 50h44M28 66h28' stroke='white' stroke-width='8' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="/tailwind.css">
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme)
          || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 min-h-screen">
  <main class="max-w-lg mx-auto px-4 py-8 flex flex-col gap-5">
    <header class="flex flex-col gap-1">
      <h1 class="text-2xl font-bold">Shared lists</h1>
      <p class="text-sm text-zinc-500 dark:text-zinc-400">Lists everyone here can add to, claim and tick off.</p>
    </header>

    <p id="template-note" class="rounded-xl bg-accent-soft text-accent-ink dark:bg-accent-soft-dark dark:text-accent-soft-ink text-sm px-4 py-3">
      Started from the Social productivity template. To change it, tap the Homeroom icon in the header and choose <strong class="font-semibold">Start a new change</strong>.
    </p>

    <form id="new-list-form" class="flex gap-2">
      <label for="new-list-title" class="sr-only">New list name</label>
      <input id="new-list-title" type="text" maxlength="120" placeholder="Start a list, like Trip packing"
             class="flex-1 min-w-0 rounded-full bg-white dark:bg-zinc-900 ring-1 ring-zinc-200 dark:ring-zinc-800 px-4 py-2.5 text-[15px] placeholder:text-zinc-400 dark:placeholder:text-zinc-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-accent">
      <button type="submit" class="shrink-0 rounded-full bg-accent text-white font-semibold px-4 py-2.5 text-[15px] hover:bg-accent-strong focus:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 dark:focus-visible:ring-offset-zinc-950">
        Add list
      </button>
    </form>

    <p id="board-error" class="hidden rounded-xl bg-red-50 text-red-800 dark:bg-red-950 dark:text-red-200 text-sm px-4 py-3" role="alert"></p>

    <section id="lists-board" class="flex flex-col gap-4" aria-live="polite"></section>

    <section id="lists-empty" class="hidden rounded-2xl bg-white dark:bg-zinc-900 ring-1 ring-zinc-200 dark:ring-zinc-800 px-5 py-8 text-center">
      <p class="text-[15px] font-semibold">No lists yet</p>
      <p class="mt-1 text-sm text-zinc-500 dark:text-zinc-400">Start one above, then anyone here can add tasks to it.</p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
