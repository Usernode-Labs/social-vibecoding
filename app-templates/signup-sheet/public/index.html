<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{DEV_CONSOLE_FORWARDER}}
  <title>{{APP_NAME}}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- This app's precompiled Tailwind (npm run build writes it on every
       image build; tailwind.config.js says which files it scans). -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path.
       Never vendor it and never write a hostname in front of it. It is also
       how the app answers the shell, so keep it even if no bridge API is
       called. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
  <!-- What takes the loading shapes' place fades in, briefly, rather than
       cutting over: an animation replays whenever [hidden] comes off, so
       nothing has to start it. None under reduced motion. -->
  <style>
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: no-preference) { .appear { animation: appear 200ms ease-out; } }
  </style>
</head>
<body class="min-h-screen bg-ground text-fg">
  <!-- data-mode is how this app answers ('slots' or 'rsvp', chosen when the
       project was made): a new event is that kind. Text with a
       data-copy-slots and a data-copy-rsvp version shows the one for the
       mode (app.js). data-example-slot is the add-a-slot field's example. -->
  <main id="app" class="page-column flex flex-col gap-8 px-4 py-8" data-mode="{{SHEET_MODE}}" data-example-slot="{{SLOT_EXAMPLE}}">
    <header class="flex flex-col gap-1">
      <h1 class="text-title">{{APP_NAME}}</h1>
      <p class="text-body text-muted"
        data-copy-slots="A sign-up sheet for each event: take a slot, so everyone knows what is covered."
        data-copy-rsvp="Say if you are coming, so everyone knows how many to expect.">Say if you are coming, or take a slot.</p>
    </header>

    <p id="status" class="text-small text-danger" role="alert" hidden></p>

    <!-- Loading: shapes where the next event will be. -->
    <div id="loading" class="flex flex-col gap-3" aria-label="Loading">
      <div class="flex flex-col gap-2 px-1">
        <div class="skeleton h-6 w-2/3"></div>
        <div class="skeleton h-4 w-1/2"></div>
      </div>
      <ul class="list" aria-hidden="true">
        <li class="list-row"><div class="flex flex-1 flex-col gap-2"><div class="skeleton h-4 w-1/2"></div><div class="skeleton h-3 w-1/3"></div></div><div class="skeleton h-11 w-20"></div></li>
        <li class="list-row"><div class="flex flex-1 flex-col gap-2"><div class="skeleton h-4 w-2/3"></div><div class="skeleton h-3 w-1/4"></div></div><div class="skeleton h-11 w-20"></div></li>
        <li class="list-row"><div class="flex flex-1 flex-col gap-2"><div class="skeleton h-4 w-1/3"></div><div class="skeleton h-3 w-1/3"></div></div><div class="skeleton h-11 w-20"></div></li>
      </ul>
    </div>

    <!-- Error: only when the load failed. -->
    <div id="error" class="state-error card" hidden>
      <p class="text-heading">The events did not load</p>
      <p class="text-body text-muted">Nothing is lost. Check your connection and try again.</p>
      <button id="retry" type="button" class="btn-secondary">Retry</button>
    </div>

    <!-- Empty: only when the load worked and nothing is coming up. -->
    <div id="empty" class="state-empty card" hidden>
      <p class="text-heading" data-copy-slots="No sign-up sheets yet" data-copy-rsvp="Nothing planned yet">Nothing planned yet</p>
      <p class="text-body text-muted"
        data-copy-slots="Make one for the next thing that needs people: a cleanup, a shift rota, a bake sale. Then add the slots."
        data-copy-rsvp="Make one for the next get-together, and everyone can say if they are coming.">Make one below.</p>
    </div>

    <!-- The events coming up, soonest first. -->
    <div id="events" class="flex flex-col gap-12 appear" hidden></div>

    <section class="flex flex-col gap-3 border-t border-line pt-8">
      <button id="new-event" type="button" class="btn-secondary w-full" aria-expanded="false" aria-controls="new-form">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        <span data-copy-slots="New sign-up sheet" data-copy-rsvp="New event">New event</span>
      </button>
      <form id="new-form" class="card flex flex-col gap-3" autocomplete="off" hidden>
        <h2 class="text-heading" data-copy-slots="New sign-up sheet" data-copy-rsvp="New event">New event</h2>
        <div class="flex flex-col gap-1">
          <label for="new-name" class="px-1 text-small text-muted">What is it?</label>
          <input id="new-name" name="name" type="text" maxlength="80" required class="field"
            placeholder="{{EVENT_EXAMPLE}}">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div class="flex flex-col gap-1">
            <label for="new-date" class="px-1 text-small text-muted">Day</label>
            <input id="new-date" name="date" type="date" required class="field">
          </div>
          <div class="flex flex-col gap-1">
            <label for="new-time" class="px-1 text-small text-muted">Time</label>
            <input id="new-time" name="time" type="time" required class="field" value="18:00">
          </div>
        </div>
        <div class="flex flex-col gap-1">
          <label for="new-place" class="px-1 text-small text-muted">Where, if you know</label>
          <input id="new-place" name="place" type="text" maxlength="120" class="field"
            placeholder="e.g. the community hall">
        </div>
        <p class="px-1 text-small text-muted"
          data-copy-slots="Once it is made, add the slots that need people and how many each takes."
          data-copy-rsvp="Once it is made, everyone can say going, maybe or can't.">Once it is made, everyone can answer.</p>
        <div class="flex flex-wrap gap-2">
          <button type="submit" class="btn-primary">Make it</button>
          <button id="new-cancel" type="button" class="btn-secondary">Cancel</button>
        </div>
        <p id="new-status" class="text-small text-danger" role="alert" hidden></p>
      </form>
    </section>

    <section id="past-section" class="flex flex-col appear" hidden>
      <h2 class="section-label">Past</h2>
      <ul id="past" class="list"></ul>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
