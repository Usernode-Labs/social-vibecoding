<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Homeroom">
  <!--
    The Homeroom mark, as the bridge draws it in the corner of an app opened on
    its own subdomain (the __USERNODE_PLATFORM_LINK__ block in
    usernode-bridge/v1/bridge.js). It is served from HERE, under one of the
    three centrally hosted asset prefixes, so an app reaches it at the RELATIVE
    path /usernode-bridge/v1/mark.svg and carries no platform hostname — the
    same contract bridge.js, native.css and tailwind.js are served under, and
    for the same reason (Caddyfile's @platform_assets matcher,
    PLATFORM_ASSET_PREFIXES in services/kubernetes.js, and the `.svg` entry in
    scripts/serve-platform-assets.js's TYPES table that lets the Kubernetes
    sidecar answer for it).

    PROVENANCE. The path below is the star of the Homeroom logotype — Figma
    node 1246:118 in file 4kAYqXh9NhpoCU44QwWvYo, the eighth and last of that
    drawing's subpaths — transcribed verbatim from
    frontend/@/components/ui/wordmark.tsx, which public/brand/README.md records
    as the logotype's source of truth. The star is the one element of the
    logotype that still reads at 28px; the seven letterforms beside it do not.
    tests/bridge-platform-mark.test.js compares this copy against that one
    character for character, so the two cannot drift.

    WHY A FILE, AND NOT currentColor SOURCE. wordmark.tsx inlines its paths so
    that one drawing takes the ink of wherever it sits. This one does not sit
    in a document the platform owns: it sits on an app's page, over an app's
    background, in whatever theme that app chose. So it carries its own ground
    — the platform violet, with the star knocked out in white — which reads on
    any backdrop. currentColor cannot promise that here, and an <img> could not
    inherit it anyway.

    The transform maps the star's own logotype coordinates (bounding box
    331.668,50.1955 → 413.68,136.279) to a 19px figure centred in the 32px
    tile: centre it on the box's midpoint, scale, then move that midpoint to
    the tile's centre. Editing the `d` without redoing those three numbers will
    push the star off the tile.
  -->
  <rect width="32" height="32" rx="8" fill="#7C3AED"/>
