<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usernode — Status</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = {
    darkMode: 'class',
    theme: { extend: { colors: {
      zinc: { 50:'#f6f6fb',100:'#eeeef6',200:'#d4d4e4',300:'#b0b0c8',400:'#9898b0',500:'#6e6e8a',600:'#4e4e6a',700:'#484870',800:'#2e2e50',900:'#1a1a30',950:'#08080f' },
      violet: { 400:'#a78bfa',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9' },
    } } },
  }</script>
  <script>
    if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <script src="/js/theme.js"></script>
  <style>
    .pill { display:inline-flex; align-items:center; gap:0.375rem; padding:0.125rem 0.5rem; border-radius:9999px; font-size:0.7rem; font-weight:600; white-space:nowrap; }
    .pill .dot { width:0.5rem; height:0.5rem; border-radius:9999px; }
    .pill-running { background:rgba(34,197,94,0.1); color:#4ade80; }
    .pill-running .dot { background:#22c55e; box-shadow:0 0 6px #22c55e; }
    .pill-stopped { background:rgba(250,204,21,0.1); color:#facc15; }
    .pill-stopped .dot { background:#facc15; }
    .pill-missing { background:rgba(239,68,68,0.1); color:#f87171; }
    .pill-missing .dot { background:#ef4444; }
    .pill-creating { background:rgba(167,139,250,0.1); color:#a78bfa; }
    .pill-creating .dot { background:#8b5cf6; }
    /* Light-mode pill overrides: the 10%-opacity tint over white is too pale
       for the bright dark-mode fill colors, so darken the text and slightly
       strengthen the tint. The page toggles `.dark` on <html>, so target the
       light state via html:not(.dark). Dots stay (solid, saturated). */
    html:not(.dark) .pill-running { background:rgba(34,197,94,0.15); color:#15803d; }
    html:not(.dark) .pill-stopped { background:rgba(202,138,4,0.15); color:#a16207; }
    html:not(.dark) .pill-missing { background:rgba(239,68,68,0.15); color:#b91c1c; }
    html:not(.dark) .pill-creating { background:rgba(139,92,246,0.15); color:#6d28d9; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    body:not(.is-admin) .admin-only { display: none !important; }
  </style>
</head>
<body class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen">
<div class="max-w-7xl mx-auto p-4 lg:p-6">

  <!-- Header -->
  <header class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-3">
      <h1 class="text-xl font-bold">Usernode Status</h1>
      <span id="version" class="text-xs mono text-zinc-500"></span>
      <span id="admin-badge" class="admin-only text-[10px] uppercase tracking-wide px-1.5 py-0.5 rounded bg-violet-100 dark:bg-violet-700/30 text-violet-700 dark:text-violet-300">admin view</span>
    </div>
    <div class="flex items-center gap-4 text-xs text-zinc-500">
      <label class="flex items-center gap-2">
        <input id="autorefresh" type="checkbox" checked class="accent-violet-500">
        auto-refresh <span id="refresh-countdown" class="mono"></span>
      </label>
      <button id="refresh-now" class="px-2 py-1 rounded bg-zinc-200 dark:bg-zinc-800 hover:bg-zinc-300 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-200">refresh</button>
      <a href="/" class="text-violet-600 dark:text-violet-400 hover:text-violet-700 dark:hover:text-violet-300">&larr; home</a>
    </div>
  </header>

  <!-- Deploy-in-progress banner. Hidden by default; renderDeploy() toggles. -->
  <div id="deploy-banner" class="hidden mb-4 rounded-lg border border-violet-300 dark:border-violet-700/50 bg-violet-50 dark:bg-violet-900/20 px-4 py-3">
    <div class="flex items-center gap-3">
      <span class="relative flex h-2.5 w-2.5">
        <span class="absolute inline-flex h-full w-full rounded-full bg-violet-400 opacity-75 animate-ping"></span>
        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-violet-500"></span>
      </span>
      <div class="text-sm">
        <span class="font-semibold text-violet-800 dark:text-violet-200">Deploy in progress</span>
        <span class="text-violet-700 dark:text-violet-300/80"> — your changes may take a minute to go live.</span>
      </div>
      <span id="deploy-meta" class="ml-auto text-xs mono text-violet-600 dark:text-violet-400"></span>
    </div>
  </div>

  <!-- Summary bar -->
  <div id="summary" class="grid grid-cols-2 md:grid-cols-6 gap-2 mb-6"></div>

  <!-- Usernode sidecar status. Populated by renderNode(); the cached snapshot
       is updated server-side every 500ms-2s by services/node-status.js, so
       this card stays fresh without each tab independently polling /status
       on the sidecar. The "→ full status" link opens the dedicated
       /node-status viewer (modeled on dapp-server.js's /status page). -->
  <section class="mb-6">
    <div class="flex items-baseline justify-between mb-2">
      <h2 class="text-sm font-semibold text-zinc-600 dark:text-zinc-400 uppercase tracking-wide">Usernode node</h2>
      <a href="/node-status" target="_blank" rel="noopener" class="text-xs text-violet-600 dark:text-violet-400 hover:text-violet-700 dark:hover:text-violet-300">
        → full status
      </a>
    </div>
    <div id="node" class="rounded-lg border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900/40 p-4 text-sm"></div>
  </section>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Left: Apps tree -->
    <div class="lg:col-span-2 space-y-3">
      <h2 class="text-sm font-semibold text-zinc-600 dark:text-zinc-400 uppercase tracking-wide">Apps</h2>
      <div id="apps" class="space-y-3"></div>
    </div>

    <!-- Right: System lanes -->
    <div class="space-y-6">
      <section class="admin-only">
        <h2 class="text-sm font-semibold text-zinc-600 dark:text-zinc-400 uppercase tracking-wide mb-2">Capacity &amp; host</h2>
        <div id="capacity" class="rounded-lg border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900/40 p-4 text-sm"></div>
      </section>

      <section>
        <h2 class="text-sm font-semibold text-zinc-600 dark:text-zinc-400 uppercase tracking-wide mb-2">Workers</h2>
        <div id="workers" class="space-y-2 text-sm"></div>
      </section>

      <section>
        <h2 class="text-sm font-semibold text-zinc-600 dark:text-zinc-400 uppercase tracking-wide mb-2">Stuck sessions</h2>
        <div id="stuck" class="space-y-2 text-sm"></div>
      </section>

      <section class="admin-only">
        <h2 class="text-sm font-semibold text-zinc-600 dark:text-zinc-400 uppercase tracking-wide mb-2">LLM today</h2>
        <div id="llm" class="space-y-1 text-sm"></div>
      </section>

      <section>
        <h2 class="text-sm font-semibold text-zinc-600 dark:text-zinc-400 uppercase tracking-wide mb-2">Drift</h2>
        <div id="drift" class="space-y-2 text-sm"></div>
      </section>

      <section class="admin-only">
        <h2 class="text-sm font-semibold text-zinc-600 dark:text-zinc-400 uppercase tracking-wide mb-2">Recent events</h2>
        <div id="events" class="space-y-0.5 text-xs mono max-h-80 overflow-y-auto"></div>
      </section>
    </div>
  </div>
</div>

<script src="/js/dev-host.js"></script>
<script>
const REFRESH_MS = 5000;
let refreshTimer = null;
let countdownTimer = null;

function h(str) {
  return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmtDuration(seconds) {
  if (seconds == null) return '—';
  if (seconds < 60) return `${seconds}s`;
  if (seconds < 3600) return `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
  if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ${Math.floor((seconds % 3600) / 60)}m`;
  return `${Math.floor(seconds / 86400)}d ${Math.floor((seconds % 86400) / 3600)}h`;
}

function fmtDollars(cents) {
  return `$${(Number(cents || 0) / 100).toFixed(2)}`;
}

function fmtBytes(bytes) {
  if (bytes == null) return '—';
  const gb = bytes / (1024 ** 3);
  if (gb >= 1) return `${gb.toFixed(1)} GB`;
  return `${(bytes / (1024 ** 2)).toFixed(0)} MB`;
}

// A labeled meter row: label, value text, and a colored fill bar at pct.
function meterRow(label, valueText, pct, tone = 'zinc') {
  const barTone = { zinc: 'bg-zinc-500', green: 'bg-green-500', yellow: 'bg-yellow-500', red: 'bg-red-500' }[tone] || 'bg-zinc-500';
  const w = Math.max(0, Math.min(100, Math.round(pct || 0)));
  return `
    <div class="mb-2">
      <div class="flex justify-between text-xs mb-1">
        <span class="text-zinc-600 dark:text-zinc-400">${h(label)}</span>
        <span class="mono text-zinc-700 dark:text-zinc-300">${valueText}</span>
      </div>
      <div class="h-1.5 rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden">
        <div class="h-full ${barTone}" style="width:${w}%"></div>
      </div>
    </div>`;
}

// Capacity & host panel — the ramp dashboard. Leads with the two numbers
// that decide whether the box is near its limit (sessions vs cap, active
// turns) then host RAM/load and DB pool saturation, then the lifecycle
// backlog (paused / stale-heading-to-archive / resumable archives).
function renderCapacity(data) {
  const c = data.capacity;
  if (!c) return '<div class="text-zinc-500">No capacity data.</div>';
  const host = data.host;
  const db = data.db;

  const sessPct = c.globalCap ? (c.globalUsed / c.globalCap) * 100 : 0;
  const sessTone = sessPct >= 90 ? 'red' : sessPct >= 70 ? 'yellow' : 'green';
  let out = meterRow('Sessions (active + promoted)', `${c.globalUsed} / ${c.globalCap}`, sessPct, sessTone);

  out += `<div class="flex justify-between text-xs mb-3 text-zinc-600 dark:text-zinc-400">
    <span>Active turns <span class="mono text-zinc-800 dark:text-zinc-200">${c.activeTurns}</span> · warm idle <span class="mono text-zinc-800 dark:text-zinc-200">${c.warmIdleWorkers}</span></span>
    <span>per-user cap <span class="mono text-zinc-800 dark:text-zinc-200">${c.userCap}</span></span>
  </div>`;

  if (host) {
    const memUsed = host.memTotalBytes - host.memFreeBytes;
    const memTone = host.memUsedPct >= 90 ? 'red' : host.memUsedPct >= 75 ? 'yellow' : 'green';
    out += meterRow('Host RAM', `${fmtBytes(memUsed)} / ${fmtBytes(host.memTotalBytes)} (${host.memUsedPct}%)`, host.memUsedPct, memTone);
    const loadPct = host.cpus ? (host.loadAvg1 / host.cpus) * 100 : 0;
    const loadTone = loadPct >= 100 ? 'red' : loadPct >= 70 ? 'yellow' : 'zinc';
    out += meterRow(`Load (1m) / ${host.cpus} cores`, `${host.loadAvg1}`, loadPct, loadTone);
  }

  if (db) {
    const poolPct = db.max ? (db.total / db.max) * 100 : 0;
    const poolTone = db.waiting > 0 ? 'red' : poolPct >= 80 ? 'yellow' : 'zinc';
    out += meterRow('DB pool (open / max)', `${db.total} / ${db.max}${db.waiting > 0 ? ` · ${db.waiting} waiting` : ''}`, poolPct, poolTone);
  }

  const bs = c.byStatus || {};
  out += `<div class="mt-3 pt-3 border-t border-zinc-200 dark:border-zinc-800 grid grid-cols-2 gap-x-4 gap-y-1 text-xs">
    <div class="flex justify-between"><span class="text-zinc-500">active</span><span class="mono">${bs.active ?? 0}</span></div>
    <div class="flex justify-between"><span class="text-zinc-500">promoted</span><span class="mono">${bs.promoted ?? 0}</span></div>
    <div class="flex justify-between"><span class="text-zinc-500">paused</span><span class="mono">${bs.paused ?? 0}</span></div>
    <div class="flex justify-between"><span class="text-zinc-500">archived</span><span class="mono">${bs.archived ?? 0}</span></div>
    <div class="flex justify-between"><span class="text-zinc-500">stale → archive</span><span class="mono ${c.staleNotified > 0 ? 'text-yellow-600 dark:text-yellow-400' : ''}">${c.staleNotified}</span></div>
    <div class="flex justify-between"><span class="text-zinc-500">resumable</span><span class="mono">${c.archivedResumable}</span></div>
  </div>`;

  return out;
}

function statePill(state, label) {
  const map = {
    running: 'pill-running',
    exited: 'pill-stopped',
    stopped: 'pill-stopped',
    paused: 'pill-stopped',
    dead: 'pill-missing',
    missing: 'pill-missing',
    creating: 'pill-creating',
  };
  const cls = map[state] || 'pill-stopped';
  return `<span class="pill ${cls}"><span class="dot"></span>${h(label || state)}</span>`;
}

function summaryCard(label, value, tone = 'zinc') {
  const toneCls = {
    zinc: 'border-zinc-200 dark:border-zinc-800',
    green: 'border-green-300 dark:border-green-700/40',
    yellow: 'border-yellow-300 dark:border-yellow-700/40',
    red: 'border-red-300 dark:border-red-700/40',
  }[tone];
  return `
    <div class="rounded-lg border ${toneCls} bg-zinc-50 dark:bg-zinc-900/60 p-3">
      <div class="text-xs text-zinc-500 uppercase tracking-wide">${h(label)}</div>
      <div class="text-xl font-semibold mt-0.5">${value}</div>
    </div>`;
}

function renderSummary(s, node) {
  const prodTone = s.prodMissing > 0 ? 'red' : 'green';
  const workerTone = s.workersOrphaned > 0 ? 'red' : 'zinc';
  const stuckTone = s.stuckSessions > 0 ? 'yellow' : 'zinc';

  // Node summary card. Tone matches the dot color in renderNode() so the
  // top-of-page glance and the dedicated section agree at a glance.
  const nodeMeta = nodeStatusMeta(node);
  const nodeValue = `${nodeMeta.label}${node && typeof node.peers === 'number' ? ` <span class="text-zinc-500 text-xs">${node.peers}p</span>` : ''}`;

  // Long-lived worker breakdown: "in-flight" is what used to be the
  // only meaningful workersRunning figure; warm-idle is the new
  // background memory cost the operator pays for fast subsequent
  // dispatches. Showing them inline keeps the card narrow without
  // hiding the new state.
  const inFlight = s.workersInFlight ?? s.workersRunning ?? 0;
  const warmIdle = s.workersWarmIdle ?? 0;
  const workerExtras = [];
  if (warmIdle > 0) workerExtras.push(`<span class="text-zinc-500 text-xs">+${warmIdle} warm</span>`);
  if (s.workersOrphaned > 0) workerExtras.push(`<span class="text-red-600 dark:text-red-400 text-xs">+${s.workersOrphaned} orphan</span>`);
  const workerValue = `${inFlight}${workerExtras.length ? ' ' + workerExtras.join(' ') : ''}`;

  const cards = [
    summaryCard('Node', nodeValue, nodeMeta.tone),
    summaryCard('Apps', `${s.prodRunning}/${s.apps}`, prodTone),
    summaryCard('Staging', `${s.stagingRunning}/${s.stagingCap}`),
    summaryCard('Workers', workerValue, workerTone),
    summaryCard('Stuck', `${s.stuckSessions}`, stuckTone),
    summaryCard('Prod missing', `${s.prodMissing}`, s.prodMissing > 0 ? 'red' : 'zinc'),
  ];

  // Ramp headlines. Sessions vs the global cap (what 429s/eviction gate
  // on) and active turns (the real RAM pressure) are the two numbers to
  // watch during a load ramp. Host RAM/load are admin-only (stripped for
  // non-admins server-side), so guard on presence.
  if (s.sessionsGlobalCap != null) {
    const sessPct = s.sessionsGlobalCap ? Math.round((s.sessionsGlobalUsed / s.sessionsGlobalCap) * 100) : 0;
    const sessTone = sessPct >= 90 ? 'red' : sessPct >= 70 ? 'yellow' : 'zinc';
    cards.push(summaryCard('Sessions', `${s.sessionsGlobalUsed}/${s.sessionsGlobalCap}`, sessTone));
  }
  if (s.activeTurns != null) {
    cards.push(summaryCard('Active turns', `${s.activeTurns}`, s.activeTurns > 0 ? 'green' : 'zinc'));
  }
  if (s.hostMemUsedPct != null) {
    const memTone = s.hostMemUsedPct >= 90 ? 'red' : s.hostMemUsedPct >= 75 ? 'yellow' : 'zinc';
    cards.push(summaryCard('Host RAM', `${s.hostMemUsedPct}%`, memTone));
  }
  if (s.dbPoolWaiting != null) {
    cards.push(summaryCard('DB queue', `${s.dbPoolWaiting}`, s.dbPoolWaiting > 0 ? 'red' : 'zinc'));
  }

  if (s.globalSpendCents != null) {
    const spendPct = Math.round((s.globalSpendCents / s.globalSpendCap) * 100);
    const spendTone = spendPct > 80 ? 'red' : spendPct > 50 ? 'yellow' : 'zinc';
    cards.splice(5, 0, summaryCard('LLM today', `${fmtDollars(s.globalSpendCents)} / ${fmtDollars(s.globalSpendCap)}`, spendTone));
  }

  return cards.join('');
}

// Maps the sidecar's `node_sync_status` (Synced / Syncing / Connected /
// Connecting / unreachable / unknown) onto a human label, a status pill
// class, and the summary-card tone. Centralized so renderNode() and
// renderSummary() agree.
function nodeStatusMeta(node) {
  if (!node || !node.status) {
    return { label: 'unknown', pill: 'pill-stopped', tone: 'zinc' };
  }
  switch (node.status) {
    case 'Synced':      return { label: 'Synced',      pill: 'pill-running',  tone: 'green' };
    // Syncing after first sync is healthy ("just applying new tip blocks").
    // Before first sync it's a fresh boot still catching up — yellow there.
    case 'Syncing':     return {
      label: 'Syncing',
      pill: node.hasBeenSynced ? 'pill-running' : 'pill-creating',
      tone: node.hasBeenSynced ? 'green' : 'yellow',
    };
    case 'Connected':   return { label: 'Connected',   pill: 'pill-creating', tone: 'yellow' };
    case 'Connecting':  return { label: 'Connecting',  pill: 'pill-creating', tone: 'yellow' };
    case 'unreachable': return { label: 'Unreachable', pill: 'pill-missing',  tone: 'red' };
    case 'mock':        return { label: 'Mock',        pill: 'pill-stopped',  tone: 'zinc' };
    case 'unknown':
    default:            return { label: node.status,   pill: 'pill-stopped',  tone: 'zinc' };
  }
}

function renderNode(node) {
  if (!node || node.status === 'unknown') {
    return `<div class="text-zinc-500">No NODE_RPC_URL configured — node status unavailable.</div>`;
  }

  const meta = nodeStatusMeta(node);
  const ourTip = node.bestTipHeight;
  const peerTip = node.peerBestTipHeight;
  // Sync progress is only meaningful when we have both numbers; otherwise
  // hide the bar rather than render a misleading 0%/100%. Same logic the
  // dapps-starter overlay uses for its progress bar.
  const showBar = ourTip != null && peerTip != null && peerTip > 0;
  const pct = showBar ? Math.max(0, Math.min(100, (ourTip / peerTip) * 100)) : 0;
  const behind = showBar ? Math.max(0, peerTip - ourTip) : null;

  // Fresh-boot Syncing bar is yellow ("we're behind"); steady-state catch-up
  // after first sync is green ("just applying new tip blocks").
  const barColor = node.status === 'Syncing' && !node.hasBeenSynced ? 'bg-yellow-500'
    : node.status === 'Syncing' ? 'bg-green-500'
    : 'bg-violet-500';

  // PARTIAL_LEDGER_RECENT_TX_SOURCE_BUG warning. False here means the
  // sidecar booted without HAS_FULL_UTXO_DB, which causes the recent-tx
  // stream to silently drop tx from non-tracked senders. Operators should
  // restart the sidecar with a fresh archive snapshot.
  const partialLedgerWarning = node.hasFullUtxoDb === false ? `
    <div class="mt-3 rounded border border-red-300 dark:border-red-700/40 bg-red-50 dark:bg-red-900/20 p-2 text-xs">
      <span class="font-semibold text-red-700 dark:text-red-300">Partial ledger mode</span>
      <span class="text-red-700 dark:text-red-300/80">— sidecar booted without HAS_FULL_UTXO_DB. Incoming tx from non-tracked senders may be silently dropped. Restart with a fresh archive snapshot.</span>
    </div>` : '';

  const errorLine = node.error ? `
    <div class="mt-2 text-xs text-red-600 dark:text-red-400 mono break-all">${h(node.error)}</div>` : '';

  const tipLine = (ourTip != null || peerTip != null) ? `
    <div class="text-xs text-zinc-500 mt-1">
      tip <span class="mono text-zinc-700 dark:text-zinc-300">${ourTip != null ? ourTip.toLocaleString() : '—'}</span>
      ${peerTip != null ? `/ <span class="mono text-zinc-600 dark:text-zinc-400">${peerTip.toLocaleString()}</span> on network` : ''}
      ${behind != null && behind > 0 ? `<span class="text-yellow-600 dark:text-yellow-400 ml-1">(${behind.toLocaleString()} blocks behind)</span>` : ''}
    </div>` : '';

  const ageSeconds = node.at ? Math.max(0, Math.floor((Date.now() - new Date(node.at).getTime()) / 1000)) : null;
  const lastUpdated = ageSeconds != null ? `<span class="text-xs text-zinc-500 ml-auto">updated ${ageSeconds < 60 ? `${ageSeconds}s` : `${Math.floor(ageSeconds / 60)}m`} ago</span>` : '';

  const bar = showBar ? `
    <div class="mt-2">
      <div class="h-1.5 rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden">
        <div class="h-full ${barColor} transition-all duration-300" style="width:${pct.toFixed(1)}%"></div>
      </div>
    </div>` : '';

  return `
    <div class="flex items-center gap-3 flex-wrap">
      <span class="pill ${meta.pill}"><span class="dot"></span>${h(meta.label)}</span>
      <span class="text-zinc-700 dark:text-zinc-300">${node.peers} peer${node.peers === 1 ? '' : 's'}</span>
      ${node.hasFullUtxoDb === true ? '<span class="pill pill-running"><span class="dot"></span>full UTXO DB</span>' : ''}
      ${lastUpdated}
    </div>
    ${tipLine}
    ${bar}
    ${errorLine}
    ${partialLedgerWarning}`;
}

function renderApps(apps) {
  if (!apps.length) return '<div class="text-sm text-zinc-500">No apps yet.</div>';
  return apps.map((a) => {
    const prodState = a.prod?.state || (a.dbStatus === 'creating' ? 'creating' : 'missing');
    const prodLabel = a.prod?.state || a.dbStatus || 'missing';
    const mem = a.prod?.stats?.mem ? `<span class="mono text-zinc-500">${h(a.prod.stats.mem)}</span>` : '';
    const cpu = a.prod?.stats?.cpu ? `<span class="mono text-zinc-500">${h(a.prod.stats.cpu)}</span>` : '';

    const sessions = a.sessions.map((s) => {
      const stagingState = s.staging?.state || (s.stagingDriftWarning ? 'missing' : 'creating');
      const stagingLabel = s.staging?.state || (s.stagingDriftWarning ? 'drift' : 'pending');
      const stagingStats = s.staging?.stats ? `<span class="mono text-zinc-500 ml-2">${h(s.staging.stats.mem)} · ${h(s.staging.stats.cpu)}</span>` : '';
      const prLink = s.prUrl ? `<a href="${h(s.prUrl)}" target="_blank" class="text-violet-600 dark:text-violet-400 hover:underline">PR #${s.prNumber}</a>` : '<span class="text-zinc-500">no PR</span>';
      const prTitle = s.prTitle ? `<span class="text-zinc-700 dark:text-zinc-300 ml-2 truncate">${h(s.prTitle)}</span>` : '';
      const stagingResolved = s.stagingUrl ? resolveDevHost(s.stagingUrl) : '';
      const stagingLink = s.stagingUrl ? `<a href="${h(stagingResolved)}" target="_blank" class="text-violet-600 dark:text-violet-400 hover:underline mono text-xs break-all">${h(stagingResolved)}</a>` : '';

      let workerLine = '';
      if (s.worker) {
        const orphanTag = s.worker.orphan ? '<span class="text-red-600 dark:text-red-400 ml-1">(orphan)</span>' : '';
        workerLine = `
          <div class="mt-1.5 pl-3 border-l-2 border-violet-300 dark:border-violet-800 text-xs">
            <div class="flex items-center gap-2">
              <span class="pill pill-running"><span class="dot"></span>worker</span>
              <span class="text-zinc-600 dark:text-zinc-400">${fmtDuration(s.worker.uptimeSeconds)}${orphanTag}</span>
              ${s.worker.model ? `<span class="mono text-zinc-500">${h(s.worker.model)}</span>` : ''}
            </div>
            ${s.worker.lastProgress ? `<div class="text-zinc-600 dark:text-zinc-400 mt-0.5 mono truncate">▸ ${h(s.worker.lastProgress)}</div>` : ''}
          </div>`;
      }

      return `
        <div class="pl-3 border-l-2 border-zinc-200 dark:border-zinc-800 py-2">
          <div class="flex items-center gap-2 flex-wrap">
            ${statePill(stagingState, `staging: ${stagingLabel}`)}
            <span class="text-zinc-600 dark:text-zinc-400 text-xs">#${s.id}</span>
            <span class="text-zinc-700 dark:text-zinc-300 text-xs">@${h(s.username)}</span>
            <span class="mono text-zinc-500 text-xs">${h(s.branchName || '—')}</span>
            <span class="text-xs">${prLink}</span>
            ${prTitle}
            <span class="text-zinc-500 text-xs ml-auto">${fmtDuration(s.ageSeconds)}</span>
          </div>
          <div class="mt-0.5 text-xs flex items-center gap-2 flex-wrap">
            ${stagingLink}
            ${stagingStats}
          </div>
          ${workerLine}
        </div>`;
    }).join('');

    const repoHost = a.repoUrl ? new URL(a.repoUrl).pathname.replace(/^\//, '') : '';

    return `
      <div class="rounded-lg border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900/40">
        <div class="p-3 flex items-start justify-between gap-3 flex-wrap">
          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="font-semibold">${h(a.name)}</span>
              <span class="mono text-zinc-500 text-xs">${h(a.slug)}</span>
              ${statePill(prodState, `prod: ${prodLabel}`)}
            </div>
            <div class="text-xs text-zinc-500 mt-1 flex items-center gap-3 flex-wrap">
              ${a.repoUrl ? `<a href="${h(a.repoUrl)}" target="_blank" class="hover:text-violet-600 dark:hover:text-violet-400 mono">${h(repoHost)}</a>` : ''}
              <span>by @${h(a.createdBy || 'unknown')}</span>
              <span>${a.openSessions} session${a.openSessions === 1 ? '' : 's'}</span>
              <span>${a.openIssues} issue${a.openIssues === 1 ? '' : 's'}</span>
              ${a.prod ? `<span>up ${fmtDuration(a.prod.uptimeSeconds)}</span>` : ''}
              ${mem} ${cpu}
            </div>
          </div>
        </div>
        ${a.sessions.length ? `<div class="border-t border-zinc-200 dark:border-zinc-800 px-3 pb-2">${sessions}</div>` : ''}
      </div>`;
  }).join('');
}

function workerModePill(mode) {
  // Visual taxonomy for long-lived workers:
  //   in-flight    : currently running a docker exec — busy with a turn
  //   warm-idle    : waiting for the next dispatch (memory cost only)
  //   bootstrapping: clone + checkout + warm-ready in flight
  //   unregistered : container exists but isn't in the warm registry
  //                  (orphan from a prior process, or stale)
  if (!mode) return '';
  const cls = {
    'in-flight': 'pill-running',
    'warm-idle': 'pill-creating',
    bootstrapping: 'pill-creating',
    unregistered: 'pill-stopped',
  }[mode] || 'pill-stopped';
  return `<span class="pill ${cls}"><span class="dot"></span>${h(mode)}</span>`;
}

function renderWorkers(workers) {
  if (!workers.length) return '<div class="text-zinc-500">No workers running.</div>';
  return workers.map((w) => {
    const orphan = w.orphan ? '<span class="text-red-600 dark:text-red-400 ml-1">orphan</span>' : '';
    const idleLabel = w.workerMode === 'warm-idle' && w.idleMs != null
      ? `idle ${fmtDuration(Math.floor(w.idleMs / 1000))}`
      : '';
    return `
      <div class="rounded border ${w.orphan ? 'border-red-300 dark:border-red-700/40' : 'border-zinc-200 dark:border-zinc-800'} bg-zinc-50 dark:bg-zinc-900/40 p-2">
        <div class="flex items-center gap-2 flex-wrap">
          ${statePill(w.state, w.state)}
          ${workerModePill(w.workerMode)}
          <span class="text-xs text-zinc-600 dark:text-zinc-400">session #${w.sessionId}</span>
          ${w.appSlug ? `<span class="mono text-xs text-zinc-500">${h(w.appSlug)}</span>` : ''}
          ${w.username ? `<span class="text-xs">@${h(w.username)}</span>` : ''}
          ${idleLabel ? `<span class="text-xs text-zinc-500">${idleLabel}</span>` : ''}
          <span class="text-xs text-zinc-500 ml-auto">${fmtDuration(w.uptimeSeconds)}${orphan}</span>
        </div>
        ${w.lastProgress ? `<div class="mt-1 mono text-xs text-zinc-600 dark:text-zinc-400 truncate">▸ ${h(w.lastProgress)}</div>` : ''}
      </div>`;
  }).join('');
}

function renderStuck(stuck) {
  if (!stuck.length) return '<div class="text-zinc-500">None.</div>';
  return stuck.map((s) => `
    <div class="rounded border border-yellow-300 dark:border-yellow-700/40 bg-zinc-50 dark:bg-zinc-900/40 p-2">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="pill pill-stopped"><span class="dot"></span>stuck</span>
        <span class="text-xs text-zinc-600 dark:text-zinc-400">session #${s.id}</span>
        <span class="mono text-xs text-zinc-500">${h(s.appSlug)}</span>
        <span class="text-xs">@${h(s.username || 'unknown')}</span>
        <span class="text-xs text-zinc-500 ml-auto">${fmtDuration(s.ageSeconds)}</span>
      </div>
      <div class="text-xs text-zinc-500 mt-0.5 mono">${h(s.branchName)}</div>
    </div>`).join('');
}

function renderLlm(data) {
  const { llmUsage, stagingPerUser, summary, limits } = data;
  const pct = Math.min(100, Math.round((summary.globalSpendCents / summary.globalSpendCap) * 100));
  const bar = `
    <div class="mb-2">
      <div class="flex justify-between text-xs mb-1">
        <span class="text-zinc-600 dark:text-zinc-400">global</span>
        <span class="mono">${fmtDollars(summary.globalSpendCents)} / ${fmtDollars(summary.globalSpendCap)} (${pct}%)</span>
      </div>
      <div class="h-1.5 rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden">
        <div class="h-full bg-violet-500" style="width:${pct}%"></div>
      </div>
    </div>`;

  const rows = llmUsage.length ? llmUsage.map((u) => {
    const userPct = Math.min(100, Math.round((u.costCents / limits.userDailyCents) * 100));
    const atCap = u.costCents >= limits.userDailyCents;
    const stagingCt = stagingPerUser[u.username] || 0;
    return `
      <div class="flex items-center justify-between text-xs py-0.5">
        <div class="flex items-center gap-2 min-w-0">
          <span class="truncate">@${h(u.username)}</span>
          ${stagingCt >= limits.stagingPerUser ? `<span class="text-red-600 dark:text-red-400 text-[10px]">${stagingCt}/${limits.stagingPerUser} staging</span>` : stagingCt > 0 ? `<span class="text-zinc-500 text-[10px]">${stagingCt} staging</span>` : ''}
        </div>
        <span class="mono ${atCap ? 'text-red-600 dark:text-red-400' : 'text-zinc-600 dark:text-zinc-400'}">${fmtDollars(u.costCents)} (${userPct}%)</span>
      </div>`;
  }).join('') : '<div class="text-zinc-500 text-xs">no activity</div>';

  return bar + rows;
}

function renderDrift(drift) {
  if (!drift.length) return '<div class="text-zinc-500">No drift detected.</div>';
  return drift.map((d) => `
    <div class="rounded border border-red-300 dark:border-red-700/40 bg-zinc-50 dark:bg-zinc-900/40 p-2 text-xs">
      <div class="flex items-center gap-2">
        <span class="pill pill-missing"><span class="dot"></span>${h(d.kind)} missing</span>
        <span class="mono text-zinc-600 dark:text-zinc-400">${h(d.expected)}</span>
      </div>
    </div>`).join('');
}

function renderDeployBanner(deploy) {
  const banner = document.getElementById('deploy-banner');
  if (!deploy?.deploying) {
    banner.classList.add('hidden');
    return;
  }
  banner.classList.remove('hidden');
  const meta = document.getElementById('deploy-meta');
  const sha = deploy.sha ? deploy.sha.substring(0, 7) : '';
  const elapsed = deploy.startedAt
    ? fmtDuration(Math.floor((Date.now() - new Date(deploy.startedAt).getTime()) / 1000))
    : '';
  meta.textContent = [sha, elapsed && `${elapsed} ago`].filter(Boolean).join(' · ');
}

function renderEvents(events) {
  if (!events.length) return '<div class="text-zinc-500 text-xs">no events yet</div>';
  return events.map((e) => {
    const lvl = { ERROR: 'text-red-600 dark:text-red-400', WARN: 'text-yellow-600 dark:text-yellow-400', INFO: 'text-zinc-600 dark:text-zinc-400', DEBUG: 'text-zinc-600' }[e.level] || 'text-zinc-600 dark:text-zinc-400';
    const time = new Date(e.ts).toLocaleTimeString();
    const data = e.data ? ' ' + (typeof e.data === 'string' ? e.data : JSON.stringify(e.data)) : '';
    return `<div class="truncate"><span class="text-zinc-600">${h(time)}</span> <span class="${lvl}">${h(e.level)}</span> <span class="text-zinc-500">[${h(e.category)}]</span> ${h(e.message)}<span class="text-zinc-600">${h(data.substring(0, 200))}</span></div>`;
  }).join('');
}

async function refresh() {
  try {
    const res = await fetch('/api/status', { credentials: 'include' });
    if (res.status === 401 || res.status === 403) {
      document.body.innerHTML = '<div class="flex items-center justify-center min-h-screen text-zinc-500">Admin access required. <a href="/" class="text-violet-600 dark:text-violet-400 ml-2">home</a></div>';
      return;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    document.body.classList.toggle('is-admin', !!data.isAdmin);
    document.getElementById('version').textContent = data.version;
    renderDeployBanner(data.deployProgress);
    document.getElementById('summary').innerHTML = renderSummary(data.summary, data.node);
    document.getElementById('node').innerHTML = renderNode(data.node);
    document.getElementById('apps').innerHTML = renderApps(data.apps);
    document.getElementById('workers').innerHTML = renderWorkers(data.workers);
    document.getElementById('stuck').innerHTML = renderStuck(data.stuckSessions);
    document.getElementById('drift').innerHTML = renderDrift(data.driftContainers);
    if (data.isAdmin) {
      document.getElementById('capacity').innerHTML = renderCapacity(data);
      document.getElementById('llm').innerHTML = renderLlm(data);
      document.getElementById('events').innerHTML = renderEvents(data.events || []);
    }
  } catch (err) {
    console.error('status refresh failed', err);
  }
}

function scheduleRefresh() {
  clearInterval(refreshTimer);
  clearInterval(countdownTimer);
  if (!document.getElementById('autorefresh').checked) {
    document.getElementById('refresh-countdown').textContent = '(paused)';
    return;
  }
  let remaining = REFRESH_MS;
  document.getElementById('refresh-countdown').textContent = `(${Math.ceil(remaining / 1000)}s)`;
  countdownTimer = setInterval(() => {
    remaining -= 1000;
    if (remaining <= 0) remaining = REFRESH_MS;
    document.getElementById('refresh-countdown').textContent = `(${Math.ceil(remaining / 1000)}s)`;
  }, 1000);
  refreshTimer = setInterval(refresh, REFRESH_MS);
}

document.getElementById('refresh-now').addEventListener('click', refresh);
document.getElementById('autorefresh').addEventListener('change', scheduleRefresh);

refresh();
scheduleRefresh();
</script>
</body>
</html>
