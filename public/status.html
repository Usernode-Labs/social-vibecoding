<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platform status</title>
  <script>
    // Redirect stub (#860): the platform-health dashboard is now the SPA's
    // #admin/status section. This file only exists so old bookmarks, chat
    // links, and service-worker-cached copies keep working.
    //
    // Health & status is one of the console's two PUBLIC sections, so a
    // signed-in non-admin who follows this link still gets it (with the
    // same sanitized payload /api/status has always served them). A
    // SIGNED-OUT visitor now lands on the sign-in screen instead of the
    // public dashboard — the anonymous surface is the JSON endpoint
    // /api/status itself, which is unchanged and still open to anyone.
    location.replace('/' + (location.search || '') + '#admin/status');
  </script>
</head>
<body>
  <noscript><a href="/#admin/status">Continue to platform status</a></noscript>
</body>
