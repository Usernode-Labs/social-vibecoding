<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Homeroom</title>
<script>
// Homeroom's Google Analytics tag (#6314), alone in a frame of its own.
//
// Why a frame: gtag.js reports the address of the page it runs in, on every
// history change, whatever page_location it is told. The shell's address can
// hold a sign-in link's key and names private things, so the tag must never
// run in the shell's own page. Here its address is this file's, its title is
// the one above, and all it ever learns is what
// frontend/src/lib/google-analytics.ts posts: a cleaned path, a sign-up, and
// the account id of somebody who switched on Share usage analytics.
(function () {
  if (window.parent === window) return;
  if (location.hostname !== 'app.onhomeroom.com') return;
  var ID = 'G-TMWBDGGDCZ';
  window.dataLayer = window.dataLayer || [];
  function gtag() { window.dataLayer.push(arguments); }
  var SETTINGS = {
    send_page_view: false,
    page_location: location.origin + '/',
    page_referrer: '',
    allow_google_signals: false,
    allow_ad_personalization_signals: false,
  };
  gtag('js', new Date());
  gtag('config', ID, SETTINGS);
  addEventListener('message', function (event) {
    if (event.origin !== location.origin || event.source !== window.parent) return;
    var m = event.data || {};
    if (m.type === 'on') window['ga-disable-' + ID] = false;
    else if (m.type === 'off') window['ga-disable-' + ID] = true;
    else if (m.type === 'page' && /^\/[a-z0-9/-]*$/i.test(String(m.path))) {
      gtag('event', 'page_view', { page_location: location.origin + m.path, page_referrer: '' });
    } else if (m.type === 'sign_up') gtag('event', 'sign_up');
    else if (m.type === 'user') {
      gtag('set', { user_id: m.id == null ? null : String(m.id) });
    }
  });
  var tag = document.createElement('script');
  tag.async = true;
  tag.src = 'https://www.googletagmanager.com/gtag/js?id=' + ID;
  document.head.appendChild(tag);
  window.parent.postMessage({ type: 'homeroom-analytics-ready' }, location.origin);
})();
</script>
</head>
<body></body>
</html>
