<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Usernode Social Vibecoding — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = {
    darkMode: 'class',
    theme: { extend: { colors: {
      zinc: { 50:'#f6f6fb',100:'#eeeef6',200:'#d4d4e4',300:'#b0b0c8',400:'#9898b0',500:'#6e6e8a',600:'#4e4e6a',700:'#484870',800:'#2e2e50',900:'#1a1a30',950:'#08080f' },
      violet: { 400:'#a78bfa',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9' },
    } } },
  }</script>
  <script>
    if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>
<body class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm px-6">
    <h1 class="text-2xl font-bold text-center mb-1">Usernode Social Vibecoding</h1>
    <p class="text-xs text-zinc-500 dark:text-zinc-400 text-center mb-8 italic">where the users are the developers are the users are the developers...</p>

    <form id="login-form" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-zinc-500 dark:text-zinc-400 mb-1">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          required
          autocomplete="username"
          class="w-full rounded-lg bg-zinc-100 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 px-3 py-2 text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent"
          placeholder="username"
        >
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-zinc-500 dark:text-zinc-400 mb-1">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          autocomplete="current-password"
          class="w-full rounded-lg bg-zinc-100 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 px-3 py-2 text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent"
          placeholder="password"
        >
      </div>

      <div id="error" class="text-red-400 text-sm hidden"></div>

      <button
        type="submit"
        class="w-full rounded-lg bg-violet-600 hover:bg-violet-500 px-4 py-2 font-medium transition-colors text-white"
      >
        Log in
      </button>
    </form>

    <p class="text-center text-sm text-zinc-500 dark:text-zinc-400 mt-6">
      Have an activation code? <a href="/register.html" class="text-violet-400 hover:text-violet-300">Register</a>
    </p>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');

      const username = form.username.value.trim();
      const password = form.password.value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error || 'Login failed';
          errorEl.classList.remove('hidden');
          return;
        }

        window.location.href = '/';
      } catch {
        errorEl.textContent = 'Network error';
        errorEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
