<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usernode Social Vibecoding — Screenshot Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = {
    darkMode: 'class',
    theme: { extend: { colors: {
      zinc: { 50:'#f6f6fb',100:'#eeeef6',200:'#d4d4e4',300:'#b0b0c8',400:'#9898b0',500:'#6e6e8a',600:'#4e4e6a',700:'#484870',800:'#2e2e50',900:'#1a1a30',950:'#08080f' },
      violet: { 400:'#a78bfa',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9' },
    } } },
  }</script>
  <script>
    if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <script src="/js/theme.js"></script>
</head>
<body class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen p-6">
  <div class="max-w-5xl mx-auto">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold">Screenshot gallery</h1>
      <div class="flex items-center gap-3">
        <a href="/admin" class="text-sm text-violet-400 hover:text-violet-300">Admin &rarr;</a>
        <a href="/debug" class="text-sm text-violet-400 hover:text-violet-300">Merge debug &rarr;</a>
        <a href="/status" class="text-sm text-violet-400 hover:text-violet-300">Status &rarr;</a>
        <a href="/" class="text-sm text-violet-400 hover:text-violet-300">&larr; Back to app</a>
      </div>
    </div>

    <div id="gate" class="hidden text-zinc-500 text-center py-20"></div>

    <main id="content" class="hidden space-y-4">
      <p class="text-sm text-zinc-500">
        Before/after screenshots of every merged proposal, newest first. Each row
        shows the screen it was shot at and the frame it was shot in; recordings
        play on click.
      </p>

      <!-- Filter bar -->
      <section class="bg-zinc-50 dark:bg-zinc-900 rounded-lg p-3 border border-zinc-200 dark:border-zinc-800
                      flex flex-wrap items-end gap-3">
        <label class="flex flex-col text-xs text-zinc-400">App
          <select id="f-app" class="mt-1 bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded px-2 py-1 text-sm text-zinc-900 dark:text-zinc-100">
            <option value="">All apps</option>
          </select>
        </label>
        <label class="flex flex-col text-xs text-zinc-400">Problem
          <select id="f-problem" class="mt-1 bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded px-2 py-1 text-sm text-zinc-900 dark:text-zinc-100">
            <option value="">Any</option>
            <option value="missing_recording">Missing recording</option>
            <option value="missing_before">Missing before side</option>
            <option value="before_fell_back">Before fell back to home page</option>
            <option value="root_only">Shot at the front page only</option>
            <option value="failed_or_skipped">Capture failed or skipped</option>
          </select>
        </label>
        <button id="apply" class="ml-auto px-3 py-1.5 rounded bg-violet-600 hover:bg-violet-700 text-white text-sm">Apply</button>
        <button id="refresh" class="px-3 py-1.5 rounded bg-zinc-200 dark:bg-zinc-800 hover:bg-zinc-300 dark:hover:bg-zinc-700 text-sm">Refresh</button>
      </section>

      <!-- Stats strip for the current filter -->
      <section id="stats" class="hidden flex-wrap gap-x-5 gap-y-1 text-xs text-zinc-500 dark:text-zinc-400
                                 bg-zinc-50 dark:bg-zinc-900 rounded-lg px-3 py-2 border border-zinc-200 dark:border-zinc-800"></section>

      <div id="proposals" class="space-y-4"></div>

      <div class="flex justify-center py-4">
        <button id="load-older" class="hidden px-4 py-2 rounded bg-zinc-200 dark:bg-zinc-800 hover:bg-zinc-300 dark:hover:bg-zinc-700 text-sm">Load older</button>
        <span id="empty" class="hidden text-zinc-500 text-sm">No merged proposals match these filters yet.</span>
      </div>
    </main>
  </div>

  <!-- The gallery reuses AppView.visualsTilesHtml (gallery mode: click-to-play
       recordings, no comparison overlay) so the tiles can never drift from the
       proposal cards. app-view.js is a plain browser script exposing AppView. -->
  <script src="/js/app-view.js"></script>
  <script src="/js/gallery.js"></script>
</body>
</html>
