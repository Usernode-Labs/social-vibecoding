<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot gallery</title>
  <script>
    // Redirect stub (#860): the before/after screenshot gallery is now the
    // SPA's #admin/gallery section. This file only exists so old bookmarks,
    // chat links, and service-worker-cached copies keep working. The query
    // string is preserved so a staging `?demo=1` link still lands on the
    // demo-seeded view (/?demo=1#admin/gallery).
    location.replace('/' + (location.search || '') + '#admin/gallery');
  </script>
</head>
<body>
  <noscript><a href="/#admin/gallery">Continue to the screenshot gallery</a></noscript>
</body>
</html>
